<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Barcode Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=4">
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>

<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper">

        <!-- SCREEN: Barcode Scanner -->
        <div class="screen screen-barcode active" data-screen="barcode">
          <div class="barcode-content">
            <!-- Status Bar -->
            <div class="status-bar light">
              <span class="status-time" id="statusTime">9:41</span>
              <div class="status-icons">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <rect x="1" y="10" width="3" height="5" rx="0.5" fill="white" />
                  <rect x="6" y="7" width="3" height="8" rx="0.5" fill="white" />
                  <rect x="11" y="3" width="3" height="12" rx="0.5" fill="white" />
                </svg>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path
                    d="M8 3c-1.66 0-3.08.69-4.12 1.78l.7.72A4.97 4.97 0 018 4c1.38 0 2.63.56 3.54 1.46l.7-.71A5.97 5.97 0 008 3z"
                    fill="white" />
                  <path
                    d="M10.83 7.17A3.98 3.98 0 008 6c-1.1 0-2.08.45-2.83 1.17l.71.71A2.99 2.99 0 018 7c.83 0 1.58.34 2.12.88l.71-.71z"
                    fill="white" />
                  <circle cx="8" cy="11" r="2" fill="white" />
                </svg>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <rect x="1" y="5" width="2" height="6" rx="0.5" fill="white" />
                  <rect x="5" y="3" width="2" height="8" rx="0.5" fill="white" />
                  <rect x="9" y="1" width="2" height="10" rx="0.5" fill="white" />
                  <rect x="13" y="6" width="1.5" height="4" rx="0.5" fill="white" />
                </svg>
              </div>
            </div>

            <!-- Header -->
            <div class="barcode-header">
              <button class="barcode-back-btn" onclick="navigateTo('logbook')" aria-label="Go back">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="15,18 9,12 15,6" />
                </svg>
              </button>
              <h1 class="barcode-title">Scan Barcode</h1>
              <div class="header-spacer"></div>
            </div>

            <!-- Camera Viewfinder -->
            <div class="barcode-viewfinder">
              <div class="camera-overlay">
                <!-- Scanner frame -->
                <div class="scanner-frame">
                  <div class="scanner-corner top-left"></div>
                  <div class="scanner-corner top-right"></div>
                  <div class="scanner-corner bottom-left"></div>
                  <div class="scanner-corner bottom-right"></div>

                  <!-- Laser line animation -->
                  <div class="scanner-laser" id="scannerLaser"></div>
                </div>

                <!-- Instructions -->
                <div class="scanner-instructions">
                  <span>Point camera at barcode</span>
                </div>
              </div>

              <!-- Simulated camera feed (in real app, this would be actual camera) -->
              <div class="camera-feed">
                <div class="camera-placeholder">
                  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                  </svg>
                </div>
              </div>
            </div>

            <!-- Fallback Button -->
            <div class="barcode-footer">
              <button class="barcode-manual-btn" onclick="navigateTo('manual-entry')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
                <span>Enter Manually</span>
              </button>
            </div>
          </div>

          <!-- Scan Success Overlay -->
          <div class="scan-success-overlay" id="scanSuccessOverlay" style="display: none;">
            <div class="scan-success-content">
              <div class="scan-success-icon">✓</div>
              <span class="scan-success-text">Barcode found!</span>
              <div class="scanned-product" id="scannedProduct">
                <span class="product-name">Product Name</span>
                <span class="product-brand">Brand</span>
              </div>
            </div>
          </div>

          <!-- Scan Not Found Overlay -->
          <div class="scan-not-found-overlay" id="scanNotFoundOverlay" style="display: none;">
            <div class="scan-not-found-content">
              <div class="scan-not-found-icon">⚠️</div>
              <span class="scan-not-found-title">Barcode not found</span>
              <span class="scan-not-found-text">This product isn't in our database yet.</span>
              <button class="scan-not-found-btn" onclick="showManualEntry()">
                Enter Details Manually
              </button>
              <button class="scan-not-found-secondary" onclick="resumeScanning()">
                Try Again
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../app.js?v=4"></script>
  <script>
    // Check premium status
    function checkPremiumStatus() {
      let isPremium = false;
      try {
        const savedState = localStorage.getItem('strivio_state');
        if (savedState) {
          const parsed = JSON.parse(savedState);
          isPremium = parsed.isPremium || false;
        }
      } catch (e) {}
      return isPremium;
    }

    // Mock barcode database
    const mockBarcodeDatabase = {
      '123456789012': { name: 'Organic Oats', brand: 'Quaker', cal: 150, p: 5, c: 27, f: 3, serving: '1/2 cup (40g)' },
      '987654321098': { name: 'Greek Yogurt', brand: 'Fage', cal: 100, p: 18, c: 6, f: 0, serving: '170g' },
      '456789012345': { name: 'Almond Milk', brand: 'Silk', cal: 30, p: 1, c: 1, f: 2.5, serving: '1 cup (240ml)' }
    };

    let isScanning = true;

    function simulateScan() {
      // Simulate random scan after 2-3 seconds
      setTimeout(() => {
        if (!isScanning) return;

        // 70% chance of success
        if (Math.random() > 0.3) {
          const codes = Object.keys(mockBarcodeDatabase);
          const randomCode = codes[Math.floor(Math.random() * codes.length)];
          const product = mockBarcodeDatabase[randomCode];
          showScanSuccess(product);
        } else {
          showScanNotFound();
        }
      }, 2000 + Math.random() * 1000);
    }

    function showScanSuccess(product) {
      isScanning = false;
      document.getElementById('scannerLaser').style.animation = 'none';

      const overlay = document.getElementById('scanSuccessOverlay');
      document.getElementById('scannedProduct').innerHTML = `
        <span class="product-name">${product.name}</span>
        <span class="product-brand">${product.brand} • ${product.cal} kcal</span>
      `;

      overlay.style.display = 'flex';

      // Auto proceed after 1.5 seconds
      setTimeout(() => {
        // In real app, would navigate to assign food screen
        localStorage.setItem('scanned_food', JSON.stringify(product));
        window.location.href = 'logbook.html';
      }, 1500);
    }

    function showScanNotFound() {
      isScanning = false;
      document.getElementById('scannerLaser').style.animation = 'none';
      document.getElementById('scanNotFoundOverlay').style.display = 'flex';
    }

    function showManualEntry() {
      window.location.href = 'manual-entry.html';
    }

    function resumeScanning() {
      isScanning = true;
      document.getElementById('scanNotFoundOverlay').style.display = 'none';
      document.getElementById('scannerLaser').style.animation = '';
      simulateScan();
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      // Check if user is premium - DISABLED FOR FIGMA CAPTURE
      // const isPremium = checkPremiumStatus();
      const isPremium = true; // Always allow for capture

      /* PREMIUM CHECK DISABLED FOR FIGMA CAPTURE
      if (!isPremium) {
        // Redirect to logbook if not premium
        alert('Barcode Scanner is a Premium feature. Please upgrade to access it.');
        navigateTo('logbook');
        return;
      }
      */

      // Update status time
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('statusTime').textContent = hours + ':' + minutes;

      // Start scanning simulation
      simulateScan();

      // Tap to scan manually (for demo)
      document.querySelector('.barcode-viewfinder').addEventListener('click', () => {
        if (isScanning) {
          const codes = Object.keys(mockBarcodeDatabase);
          const randomCode = codes[Math.floor(Math.random() * codes.length)];
          const product = mockBarcodeDatabase[randomCode];
          showScanSuccess(product);
        }
      });
    });
  </script>
</body>

</html>
