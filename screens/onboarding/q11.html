<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>

<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- SCREEN 12: Q11 — Diet Preference -->
        <div class="screen active" data-screen="q11">
          <div class="progress-section">
            <div class="progress-bar">
              <div class="progress-fill" style="width:73.33%"></div>
            </div>
            <span class="progress-label">Question 11 of 15</span>
          </div>
          <div class="question-content scrollable">
            <div class="question-icon">
              <img src="../../assets/illustration/option=nutrition.svg" alt="">
            </div>
            <h2 class="question-title">Do you follow a specific diet?</h2>
            <p class="question-helper">We'll tailor your meal plan to match your preference.</p>
            <div class="option-cards single-select" data-key="diet" id="dietOptions">
              <div class="option-card has-desc" data-value="none"><img src="../../assets/svg_icons/hat-chef.svg"
                  class="icon icon-blue" width="22" alt="">
                <div class="option-text"><span class="option-label">No preference</span><span class="option-desc">I eat
                    a balanced diet</span></div><span class="option-check"></span>
              </div>
              <div class="option-card" data-value="keto"><img src="../../assets/svg_icons/flame.svg"
                  class="icon icon-orange" width="22" alt=""><span class="option-label">Low-carb / Keto</span><span
                  class="option-check"></span></div>
              <div class="option-card" data-value="vegetarian"><img src="../../assets/svg_icons/salad.svg"
                  class="icon icon-green" width="22" alt=""><span class="option-label">Vegetarian</span><span
                  class="option-check"></span></div>
              <div class="option-card" data-value="vegan"><img src="../../assets/svg_icons/avocado.svg"
                  class="icon icon-teal" width="22" alt=""><span class="option-label">Vegan</span><span
                  class="option-check"></span></div>
              <div class="option-card" data-value="gluten_free"><img src="../../assets/svg_icons/gluten free.svg"
                  class="icon icon-amber" width="22" alt=""><span class="option-label">Gluten-free</span><span
                  class="option-check"></span></div>
            </div>
          </div>
          <div class="cta-section">
            <button class="btn-primary" id="btnQ11" disabled onclick="saveAndNext('q11','diet','q12')">Continue</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>

</html>
