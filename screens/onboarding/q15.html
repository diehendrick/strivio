<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>

<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- SCREEN 16: Q15 — Workout Duration -->
        <div class="screen active" data-screen="q15">
          <div class="progress-section">
            <div class="progress-bar">
              <div class="progress-fill" style="width:93.75%"></div>
            </div>
            <span class="progress-label">Question 15 of 16</span>
          </div>
          <div class="question-content scrollable">
            <div class="question-icon">
              <img src="../../assets/illustration/option=clock.svg" alt="">
            </div>
            <h2 class="question-title">What's your ideal workout duration?</h2>

            <div class="goal-section" id="workoutDurationSection">
              <div class="list-card" data-value="less_30">
                <span class="card-label">Less than 30 min</span>
                <span class="radio-indicator"></span>
              </div>
              <div class="list-card" data-value="30_45">
                <span class="card-label">30 - 45 min</span>
                <span class="radio-indicator"></span>
              </div>
              <div class="list-card" data-value="45_60">
                <span class="card-label">45 - 60 min</span>
                <span class="radio-indicator"></span>
              </div>
              <div class="list-card" data-value="60_90">
                <span class="card-label">60 - 90 min</span>
                <span class="radio-indicator"></span>
              </div>
              <div class="list-card" data-value="more_90">
                <span class="card-label">More than 90 min</span>
                <span class="radio-indicator"></span>
              </div>
            </div>
          </div>
          <div class="cta-section">
            <button class="btn-primary" id="btnQ15" disabled onclick="saveAndNext('q15','workoutDuration','q16')">Continue</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>

</html>
