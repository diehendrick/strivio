<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>

<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- SCREEN 13: Q12 — Fitness Level -->
        <div class="screen active" data-screen="q12">
          <div class="progress-section">
            <div class="progress-bar">
              <div class="progress-fill" style="width:80%"></div>
            </div>
            <span class="progress-label">Question 12 of 15</span>
          </div>
          <div class="question-content scrollable">
            <div class="question-icon">
              <img src="../../assets/illustration/option=level.svg" alt="">
            </div>
            <h2 class="question-title">How would you rate your current fitness level?</h2>
            <div class="option-cards single-select" data-key="fitness" id="fitnessOptions">
              <div class="option-card has-desc" data-value="beginner"><span class="icon icon-blue"
                  style="--icon-url: url('../../assets/svg_icons/meditation.svg'); width: 22px; height: 22px;" aria-hidden="true"></span>
                <div class="option-text"><span class="option-label">Beginner</span><span class="option-desc">I'm new to
                    exercise or haven't trained regularly</span></div><span class="option-check"></span>
              </div>
              <div class="option-card has-desc" data-value="intermediate"><span class="icon icon-navy"
                  style="--icon-url: url('../../assets/svg_icons/muscle.svg'); width: 22px; height: 22px;" aria-hidden="true"></span>
                <div class="option-text"><span class="option-label">Intermediate</span><span class="option-desc">I
                    exercise regularly but am not following a program</span></div><span class="option-check"></span>
              </div>
              <div class="option-card has-desc" data-value="advanced"><span class="icon icon-orange"
                  style="--icon-url: url('../../assets/svg_icons/dumbbell-ray.svg'); width: 22px; height: 22px;" aria-hidden="true"></span>
                <div class="option-text"><span class="option-label">Advanced</span><span class="option-desc">I follow a
                    structured training program already</span></div><span class="option-check"></span>
              </div>
            </div>
          </div>
          <div class="cta-section">
            <button class="btn-primary" id="btnQ12" disabled
              onclick="saveAndNext('q12','fitness','q13')">Continue</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>

</html>
