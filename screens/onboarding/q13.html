<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>

<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- SCREEN: Q13 — Training Location -->
        <div class="screen active" data-screen="q13">
          <div class="progress-section">
            <div class="progress-bar">
              <div class="progress-fill" style="width:86.67%"></div>
            </div>
            <span class="progress-label">Question 13 of 15</span>
          </div>
          <div class="question-content">
            <div class="question-icon">
              <img src="../../assets/illustration/option=excercise.svg" alt="">
            </div>
            <h2 class="question-title">Where will you mostly train?</h2>
            <p class="question-helper">This helps us suggest the right exercises based on available equipment.</p>
            <div class="option-cards single-select" data-key="location" id="locationOptions">
              <div class="option-card has-desc" data-value="gym"><img src="../../assets/svg_icons/muscle.svg"
                  class="icon icon-purple" width="22" alt="">
                <div class="option-text"><span class="option-label">Gym</span><span class="option-desc">Full equipment,
                    machines, free weights</span></div><span class="option-check"></span>
              </div>
              <div class="option-card has-desc" data-value="home"><img src="../../assets/svg_icons/home.svg"
                  class="icon icon-blue" width="22" alt="">
                <div class="option-text"><span class="option-label">Home</span><span class="option-desc">Minimal
                    equipment, body-weight, resistance bands</span></div><span class="option-check"></span>
              </div>
              <div class="option-card has-desc" data-value="both"><img src="../../assets/svg_icons/gym.svg"
                  class="icon icon-orange" width="22" alt="">
                <div class="option-text"><span class="option-label">Both equally</span><span class="option-desc">Mix of
                    gym and home</span></div><span class="option-check"></span>
              </div>
            </div>
          </div>
          <div class="cta-section">
            <button class="btn-primary" id="btnQ13" disabled
              onclick="saveAndNext('q13','location','q14')">Continue</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>

</html>
