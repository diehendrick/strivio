<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- SCREEN 2: Q1 — Preferred Name -->
        <div class="screen active" data-screen="q1">
          <div class="progress-section">
            <div class="progress-bar"><div class="progress-fill" style="width:6.67%"></div></div>
            <span class="progress-label">Question 1 of 15</span>
          </div>
          <div class="question-content">
            <div class="question-icon">
              <img src="../../assets/illustration/option=profile.svg" alt="">
            </div>
            <h2 class="question-title">What should we call you?</h2>
            <p class="question-helper">Your coach will use this name when talking to you.</p>
            <div class="input-group">
              <input type="text" class="text-input" id="inputName" placeholder="e.g. Alex" maxlength="30" autocomplete="off">
              <span class="input-underline"></span>
            </div>
          </div>
          <div class="cta-section">
            <button class="btn-primary" id="btnQ1" disabled onclick="saveAndNext('q1','name','q2')">Continue</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>
</html>
