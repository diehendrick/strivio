<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- SCREEN 7: Q6 — Age -->
        <div class="screen active" data-screen="q6">
          <div class="progress-section">
            <div class="progress-bar"><div class="progress-fill" style="width:40%"></div></div>
            <span class="progress-label">Question 6 of 15</span>
          </div>
          <div class="question-content">
            <div class="question-icon">
              <img src="../../assets/illustration/option=calendar.svg" alt="">
            </div>
            <h2 class="question-title">How old are you?</h2>
            <p class="question-helper">We use this to calculate your daily calorie needs.</p>
            <div class="numeric-input-group">
              <input type="number" class="numeric-input" id="inputAge" placeholder="25" min="14" max="100" inputmode="numeric">
              <span class="numeric-unit">years</span>
            </div>
          </div>
          <div class="cta-section">
            <button class="btn-primary" id="btnQ6" disabled onclick="saveAndNext('q6','age','q7')">Continue</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>
</html>
