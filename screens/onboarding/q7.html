<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- SCREEN 8: Q7 — Height -->
        <div class="screen active" data-screen="q7">
          <div class="progress-section">
            <div class="progress-bar"><div class="progress-fill" style="width:46.67%"></div></div>
            <span class="progress-label">Question 7 of 15</span>
          </div>
          <div class="question-content">
            <div class="question-icon">
              <img src="../../assets/illustration/option=height.svg" alt="">
            </div>
            <h2 class="question-title">What is your height?</h2>
            <div class="numeric-input-group">
              <input type="number" class="numeric-input" id="inputHeight" placeholder="175" min="100" max="220" inputmode="numeric">
              <span class="numeric-unit">cm</span>
            </div>
          </div>
          <div class="cta-section">
            <button class="btn-primary" id="btnQ7" disabled onclick="saveAndNext('q7','height','q8')">Continue</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>
</html>
