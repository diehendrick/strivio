<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>

<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- SCREEN 6: Q5 — Activity Level -->
        <div class="screen active" data-screen="q5">
          <div class="progress-section">
            <div class="progress-bar">
              <div class="progress-fill" style="width:31.25%"></div>
            </div>
            <span class="progress-label">Question 5 of 16</span>
          </div>
          <div class="question-content scrollable">
            <div class="question-icon">
              <img src="../../assets/illustration/option=running 1.svg" alt="">
            </div>
            <h2 class="question-title">How would you describe your current activity level?</h2>
            <div class="option-cards single-select" data-key="activity" id="activityOptions">
              <div class="option-card has-desc" data-value="sedentary"><span class="icon icon-blue"
                  style="--icon-url: url('../../assets/svg_icons/couch.svg'); width: 22px; height: 22px;" aria-hidden="true"></span>
                <div class="option-text"><span class="option-label">Sedentary</span><span class="option-desc">Little or
                    no exercise, desk job</span></div><span class="option-check"></span>
              </div>
              <div class="option-card has-desc" data-value="light"><span class="icon icon-green"
                  style="--icon-url: url('../../assets/svg_icons/walking.svg'); width: 22px; height: 22px;" aria-hidden="true"></span>
                <div class="option-text"><span class="option-label">Light</span><span class="option-desc">Light exercise
                    1-3 days/week</span></div><span class="option-check"></span>
              </div>
              <div class="option-card has-desc" data-value="moderate"><span class="icon icon-amber"
                  style="--icon-url: url('../../assets/svg_icons/running.svg'); width: 22px; height: 22px;" aria-hidden="true"></span>
                <div class="option-text"><span class="option-label">Moderate</span><span class="option-desc">Moderate
                    exercise 3-5 days/week</span></div><span class="option-check"></span>
              </div>
              <div class="option-card has-desc" data-value="active"><span class="icon icon-orange"
                  style="--icon-url: url('../../assets/svg_icons/dumbbell-ray.svg'); width: 22px; height: 22px;" aria-hidden="true"></span>
                <div class="option-text"><span class="option-label">Active</span><span class="option-desc">Hard exercise
                    6-7 days/week</span></div><span class="option-check"></span>
              </div>
              <div class="option-card has-desc" data-value="very_active"><span class="icon icon-red"
                  style="--icon-url: url('../../assets/svg_icons/bolt.svg'); width: 22px; height: 22px;" aria-hidden="true"></span>
                <div class="option-text"><span class="option-label">Very Active</span><span class="option-desc">Intense
                    daily exercise or physical job</span></div><span class="option-check"></span>
              </div>
            </div>
          </div>
          <div class="cta-section">
            <button class="btn-primary" id="btnQ5" disabled
              onclick="saveAndNext('q5','activity','q6')">Continue</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>

</html>
