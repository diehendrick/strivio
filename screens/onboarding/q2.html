<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>

<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- SCREEN 3: Q2 — Primary Goals (Weight + Fitness) -->
        <div class="screen active" data-screen="q2">
          <div class="progress-section">
            <div class="progress-bar">
              <div class="progress-fill" style="width:12.5%"></div>
            </div>
            <span class="progress-label">Question 2 of 16</span>
          </div>
          <div class="question-content scrollable">
            <div class="question-icon">
              <img src="../../assets/illustration/option=goal.svg" alt="">
            </div>
            <h2 class="question-title">What are your primary goals?</h2>
            <p class="question-subtitle">Choose one goal from each section.</p>

            <!-- Section 1: Weight Goal -->
            <div class="goal-section" id="weightGoalSection">
              <div class="section-header-wrapper">
                <div class="section-header">Weight goal</div>
                <p class="section-subtitle">Choose 1</p>
              </div>
              <div class="list-card" data-value="lose_weight">
                <span class="icon card-icon"
                  style="--icon-url: url('../../assets/svg_icons/weight.svg'); width: 22px; height: 22px; background-color: var(--color-primary);"
                  aria-hidden="true"></span>
                <span class="card-label">Lose weight</span>
                <span class="radio-indicator"></span>
              </div>
              <div class="list-card" data-value="gain_weight">
                <span class="icon card-icon"
                  style="--icon-url: url('../../assets/svg_icons/body.svg'); width: 22px; height: 22px; background-color: var(--color-tertiary);"
                  aria-hidden="true"></span>
                <span class="card-label">Gain Weight</span>
                <span class="radio-indicator"></span>
              </div>
              <div class="list-card" data-value="maintain_weight">
                <span class="icon card-icon"
                  style="--icon-url: url('../../assets/svg_icons/bullseye-arrow.svg'); width: 22px; height: 22px; background-color: var(--color-warning);"
                  aria-hidden="true"></span>
                <span class="card-label">Maintain Weight</span>
                <span class="radio-indicator"></span>
              </div>
            </div>

            <!-- Section 2: Fitness Goal -->
            <div class="goal-section" id="fitnessGoalSection">
              <div class="section-header-wrapper">
                <div class="section-header">Fitness goal</div>
                <p class="section-subtitle">Choose 1</p>
              </div>
              <div class="list-card" data-value="build_muscle">
                <span class="icon card-icon"
                  style="--icon-url: url('../../assets/svg_icons/muscle.svg'); width: 22px; height: 22px; background-color: var(--color-primary);"
                  aria-hidden="true"></span>
                <span class="card-label">Build Muscle</span>
                <span class="radio-indicator"></span>
              </div>
              <div class="list-card" data-value="stay_fit">
                <span class="icon card-icon"
                  style="--icon-url: url('../../assets/svg_icons/hearth-rate.svg'); width: 22px; height: 22px; background-color: var(--color-warning);"
                  aria-hidden="true"></span>
                <span class="card-label">Stay Fit</span>
                <span class="radio-indicator"></span>
              </div>
              <div class="list-card" data-value="get_stronger">
                <span class="icon card-icon"
                  style="--icon-url: url('../../assets/svg_icons/dumbbell-ray.svg'); width: 22px; height: 22px; background-color: var(--color-error);"
                  aria-hidden="true"></span>
                <span class="card-label">Get Stronger</span>
                <span class="radio-indicator"></span>
              </div>
            </div>
          </div>
          <div class="cta-section">
            <button class="btn-primary" id="btnQ2" disabled onclick="saveAndNext('q2',null,'q3')">Continue</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>

</html>
