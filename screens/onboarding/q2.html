<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>

<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- SCREEN 3: Q2 — Primary Goals (Multi-Select) -->
        <div class="screen active" data-screen="q2">
          <div class="progress-section">
            <div class="progress-bar">
              <div class="progress-fill" style="width:13.33%"></div>
            </div>
            <span class="progress-label">Question 2 of 15</span>
          </div>
          <div class="question-content scrollable">
            <div class="question-icon">
              <img src="../../assets/illustration/option=goal.svg" alt="">
            </div>
            <h2 class="question-title">What are your primary goals?</h2>
            <div class="helper-row">
              <p class="question-helper">Select up to 2</p>
              <span class="select-counter" id="goalsCounter">0/2</span>
            </div>
            <div class="option-cards multi-select" data-max="2" data-key="goals" id="goalsOptions">
              <div class="option-card" data-value="lose_weight"><img src="../../assets/svg_icons/weight.svg"
                  class="icon icon-purple" width="22" alt=""><span class="option-label">Lose weight</span><span
                  class="option-check"></span></div>
              <div class="option-card" data-value="build_muscle"><img src="../../assets/svg_icons/muscle.svg"
                  class="icon icon-red" width="22" alt=""><span class="option-label">Build muscle</span><span
                  class="option-check"></span></div>
              <div class="option-card" data-value="endurance"><img src="../../assets/svg_icons/endurance.svg"
                  class="icon icon-blue" width="22" alt=""><span class="option-label">Improve endurance</span><span
                  class="option-check"></span></div>
              <div class="option-card" data-value="flexibility"><img src="../../assets/svg_icons/running.svg"
                  class="icon icon-teal" width="22" alt=""><span class="option-label">Increase flexibility</span><span
                  class="option-check"></span></div>
              <div class="option-card" data-value="stronger"><img src="../../assets/svg_icons/gym.svg"
                  class="icon icon-amber" width="22" alt=""><span class="option-label">General fitness</span><span
                  class="option-check"></span></div>
            </div>
          </div>
          <div class="cta-section">
            <button class="btn-primary" id="btnQ2" disabled onclick="saveAndNext('q2','goals','q3')">Continue</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>

</html>
