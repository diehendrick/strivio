<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- SCREEN 9: Q8 — Current Weight -->
        <div class="screen active" data-screen="q8">
          <div class="progress-section">
            <div class="progress-bar"><div class="progress-fill" style="width:53.33%"></div></div>
            <span class="progress-label">Question 8 of 15</span>
          </div>
          <div class="question-content">
            <div class="question-icon">
              <img src="../../assets/illustration/option=weight.svg" alt="">
            </div>
            <h2 class="question-title">What is your current weight?</h2>
            <div class="numeric-input-group">
              <input type="number" class="numeric-input" id="inputWeight" placeholder="78.5" min="30" max="300" step="0.1" inputmode="decimal">
              <span class="numeric-unit">kg</span>
            </div>
          </div>
          <div class="cta-section">
            <button class="btn-primary" id="btnQ8" disabled onclick="saveAndNext('q8','weight','q9')">Continue</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>
</html>
