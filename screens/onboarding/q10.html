<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>

<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- SCREEN 11: Q10 — Weight Timeline (Weeks Slider) -->
        <div class="screen active" data-screen="q10">
          <div class="progress-section">
            <div class="progress-bar">
              <div class="progress-fill" style="width:62.5%"></div>
            </div>
            <span class="progress-label">Question 10 of 16</span>
          </div>
          <div class="question-content">
            <div class="question-icon">
              <img src="../../assets/illustration/option=timer.svg" alt="">
            </div>
            <h2 class="question-title">How quickly do you want to reach your target weight?</h2>
            <p class="question-subtitle">We'll calculate a safe weekly pace based on your target</p>

            <div class="slider-group">
              <input type="range" class="slider" id="weeksSlider" min="1" max="80" step="1" value="16">
              <div class="weeks-slider-labels">
                <div class="slider-label-left">
                  <span class="slider-min-label" id="minWeeksLabel">6 Weeks</span>
                  <span class="slider-min-sub">Maximum</span>
                </div>
                <div class="slider-label-right">
                  <span class="slider-max-label" id="maxWeeksLabel">80 Weeks</span>
                  <span class="slider-max-sub">Min slow pace</span>
                </div>
              </div>
            </div>

            <div class="pace-display">
              <p class="pace-selected" id="selectedWeeks">Selected: 16 weeks</p>
              <p class="pace-estimate" id="estimatedPace">Estimated pace: 0.5 kg/week</p>
            </div>

            <div class="recommendation-row">
              <span class="icon recommendation-icon" style="--icon-url: url('../../assets/svg_icons/shield-checked.svg'); width: 16px; height: 16px; background-color: var(--color-default);" aria-hidden="true"></span>
              <p class="recommendation-text">Recommended: around 0.5 kg/week</p>
            </div>
          </div>
          <div class="cta-section">
            <button class="btn-primary" id="btnQ10" onclick="saveAndNext('q10','weeks','q11')">Continue</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>

</html>
