<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- SCREEN 15: Q14 — Training Frequency (Slider) -->
        <div class="screen active" data-screen="q14">
          <div class="progress-section">
            <div class="progress-bar"><div class="progress-fill" style="width:93.33%"></div></div>
            <span class="progress-label">Question 14 of 15</span>
          </div>
          <div class="question-content">
            <div class="question-icon">
              <img src="../../assets/illustration/option=calendar day.svg" alt="">
            </div>
            <h2 class="question-title">How many days per week would you like to train?</h2>
            <div class="slider-group">
              <input type="range" class="slider" id="freqSlider" min="1" max="7" step="1" value="4">
              <div class="slider-labels slider-labels-freq">
                <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span>
              </div>
              <div class="slider-unit">days/week</div>
            </div>
            <div class="pace-value" id="freqValue">Selected: 4 days/week</div>
          </div>
          <div class="cta-section">
            <button class="btn-primary" id="btnQ14" onclick="saveAndNext('q14','frequency','q15')">Continue</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>
</html>
