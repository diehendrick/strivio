<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- ===== AUTH: Forgot Password ===== -->
        <div class="screen screen-forgot active" data-screen="forgot-password">
          <button class="auth-back-icon" onclick="navigateTo('login')">
            <img src="../../assets/svg_icons/back.svg" class="icon" width="24" alt="">
          </button>

          <div class="auth-header">
            <div class="auth-heading">Reset Password</div>
            <div class="auth-subheading">Enter your email address and we'll send you a link to reset your password.</div>
          </div>

          <div class="auth-form">
            <label class="form-label" for="forgotEmail">Email Address</label>
            <div class="form-input-wrap has-icon">
              <img src="../../assets/svg_icons/envelope.svg" class="input-icon icon" width="20" alt="">
              <input class="form-input" type="email" id="forgotEmail" placeholder="your@email.com" autocomplete="email">
            </div>
            <div class="form-error" id="forgotEmailError"></div>
          </div>

          <div class="auth-footer-fixed">
            <button class="btn-primary" onclick="sendResetLink()">Send Reset Link</button>
            <div class="auth-footer-text">Remember your password? <a onclick="navigateTo('login')">Log In</a></div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>
</html>
