<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- ===== AUTH: Login ===== -->
        <div class="screen screen-auth active" data-screen="login">
          <!-- Back button -->
          <button class="auth-back-icon" onclick="navigateTo('welcome')">
            <img src="../../assets/svg_icons/back.svg" class="icon" width="24" alt="">
          </button>

          <div class="auth-header">
            <div class="auth-heading">Welcome Back</div>
            <div class="auth-subheading">Log in to continue your fitness journey</div>
          </div>

          <div class="auth-form">
            <div class="auth-banner error-banner" id="loginBanner">
              <img src="../../assets/svg_icons/alert.svg" class="icon" width="18" alt="">
              <span id="loginBannerText"></span>
            </div>

            <div class="form-group">
              <label class="form-label" for="loginEmail">Email</label>
              <div class="form-input-wrap has-icon">
                <img src="../../assets/svg_icons/envelope.svg" class="input-icon icon" width="20" alt="">
                <input class="form-input" type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
              </div>
              <div class="form-error" id="loginEmailError"></div>
            </div>

            <div class="form-group">
              <label class="form-label" for="loginPassword">Password</label>
              <div class="input-password-wrap form-input-wrap has-icon">
                <img src="../../assets/svg_icons/lock.svg" class="input-icon icon" width="20" alt="">
                <input class="form-input" type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
                <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Toggle password visibility">
                  <img src="../../assets/svg_icons/eye.svg" class="icon" width="20" alt="">
                </button>
              </div>
              <div class="form-error" id="loginPasswordError"></div>
            </div>

            <div class="forgot-link-row">
              <label class="checkbox-group" style="margin-bottom:0">
                <div class="custom-checkbox">
                  <input type="checkbox" id="rememberMe">
                  <div class="checkmark"><iconify-icon icon="solar:check-read-bold-duotone" width="14"></iconify-icon></div>
                </div>
                <span class="checkbox-label">Remember me</span>
              </label>
              <a class="auth-link" onclick="navigateTo('forgot-password')">Forgot Password?</a>
            </div>
          </div>

          <div class="auth-footer-fixed">
            <button class="btn-primary" id="btnLogin" onclick="validateLogin()">Log In</button>
            <div class="divider-or"><span>Or</span></div>

            <button class="sso-btn sso-btn-google" onclick="ssoDemo('google')">
              <iconify-icon icon="logos:google-icon" width="20"></iconify-icon>
              Continue with Google
            </button>
            <div style="height:10px"></div>
            <button class="sso-btn sso-btn-apple" onclick="ssoDemo('apple')">
              <iconify-icon icon="solar:apple-bold-duotone" width="20"></iconify-icon>
              Continue with Apple
            </button>

            <div class="auth-footer-text">Don't have an account? <a onclick="navigateTo('register')">Sign Up</a></div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>
</html>
