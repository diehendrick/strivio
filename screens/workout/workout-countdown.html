<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio - Workout Warmup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=7">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- ===== WORKOUT TAB: Execution - Warmup ===== -->
        <div class="screen screen-exec-dark screen-exec-warmup active" data-screen="workout-countdown">
          <div class="wk-live-bg wk-live-bg-warmup"></div>
          <div class="wk-live-overlay"></div>

          <div class="status-bar wk-live-status">
            <span class="status-time">9:41</span>
            <div class="status-icons">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="10" width="3" height="5" rx="0.5" fill="#fff"/><rect x="6" y="7" width="3" height="8" rx="0.5" fill="#fff"/><rect x="11" y="3" width="3" height="12" rx="0.5" fill="#fff"/></svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3c-1.66 0-3.08.69-4.12 1.78l.7.72A4.97 4.97 0 018 4c1.38 0 2.63.56 3.54 1.46l.7-.71A5.97 5.97 0 008 3z" fill="#fff"/><path d="M10.83 7.17A3.98 3.98 0 008 6c-1.1 0-2.08.45-2.83 1.17l.71.71A2.99 2.99 0 018 7c.83 0 1.58.34 2.12.88l.71-.71z" fill="#fff"/><circle cx="8" cy="11" r="2" fill="#fff"/></svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="5" width="2" height="6" rx="0.5" fill="#fff"/><rect x="5" y="3" width="2" height="8" rx="0.5" fill="#fff"/><rect x="9" y="1" width="2" height="10" rx="0.5" fill="#fff"/><rect x="13" y="6" width="1.5" height="4" rx="0.5" fill="#fff"/></svg>
            </div>
          </div>

          <button class="wk-live-back" onclick="goBack()" aria-label="Back">
            <img src="../../assets/svg_icons/back.svg" class="icon" width="24" alt="">
          </button>

          <main class="wk-live-wrap">
            <section class="wk-live-progress">
              <div class="wk-live-progress-head">
                <strong id="wkCountdownProgress">0:00 &bull; 0%</strong>
                <button type="button" onclick="skipCountdown()" class="wk-live-skip">
                  <img src="../../assets/svg_icons/foward.svg" width="18" height="18" alt=""> Skip Section
                </button>
              </div>
              <div class="wk-live-segments" id="wkCountdownSegments" aria-hidden="true"></div>
            </section>

            <section class="wk-warmup-content">
              <h1>WARMUP</h1>
              <div class="wk-warmup-equipment">
                <h2>Equipment</h2>
                <p>Bodyweight</p>
              </div>
              <div class="wk-warmup-list" id="wkWarmupList">
                <div><span>1x</span> Knee Hug</div>
                <div><span>1x</span> Squat</div>
                <div><span>1x</span> Butt Kick</div>
              </div>
            </section>

            <section class="wk-warmup-bottom">
              <img src="../../assets/img/marcus.jpg" alt="Coach Marcus">
              <strong id="wkCountdownNum">0:20</strong>
            </section>
          </main>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=7"></script>
</body>
</html>
