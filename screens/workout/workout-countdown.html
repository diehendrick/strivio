<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio - Workout Warmup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=8">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- ===== WORKOUT TAB: Warmup (Pre-Countdown + Exercise) ===== -->
        <div class="screen screen-exec-warmup active" data-screen="workout-countdown">

          <div class="status-bar wk-live-status">
            <span class="status-time">9:41</span>
            <div class="status-icons">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="10" width="3" height="5" rx="0.5" fill="#0f172a"/><rect x="6" y="7" width="3" height="8" rx="0.5" fill="#0f172a"/><rect x="11" y="3" width="3" height="12" rx="0.5" fill="#0f172a"/></svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3c-1.66 0-3.08.69-4.12 1.78l.7.72A4.97 4.97 0 018 4c1.38 0 2.63.56 3.54 1.46l.7-.71A5.97 5.97 0 008 3z" fill="#0f172a"/><path d="M10.83 7.17A3.98 3.98 0 008 6c-1.1 0-2.08.45-2.83 1.17l.71.71A2.99 2.99 0 018 7c.83 0 1.58.34 2.12.88l.71-.71z" fill="#0f172a"/><circle cx="8" cy="11" r="2" fill="#0f172a"/></svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="5" width="2" height="6" rx="0.5" fill="#0f172a"/><rect x="5" y="3" width="2" height="8" rx="0.5" fill="#0f172a"/><rect x="9" y="1" width="2" height="10" rx="0.5" fill="#0f172a"/><rect x="13" y="6" width="1.5" height="4" rx="0.5" fill="#0f172a"/></svg>
            </div>
          </div>

          <main class="wk-live-wrap">
            <section class="wk-live-header">
              <button class="wk-live-back" onclick="goBack()" aria-label="Back">
                <span class="icon wk-live-back-icon" style="--icon-url: url('../../assets/svg_icons/back.svg'); width: 24px; height: 24px;" aria-hidden="true"></span>
              </button>
              <h1 class="wk-live-title">Warm Up</h1>
              <span class="wk-live-header-spacer" aria-hidden="true"></span>
            </section>

            <section class="wk-live-progress">
              <div class="wk-live-progress-head">
                <strong id="wkCountdownProgress">0:00 &bull; 0%</strong>
                <button type="button" id="wkSkipBtn" onclick="skipWarmupCountdown()" class="wk-live-skip">
                  <span class="icon wk-live-skip-icon" style="--icon-url: url('../../assets/svg_icons/foward.svg'); width: 20px; height: 20px;" aria-hidden="true"></span>
                  <span>Skip Section</span>
                </button>
              </div>
              <div class="wk-live-segments" id="wkCountdownSegments" aria-hidden="true"></div>
            </section>

            <!-- Phase 1: Pre-Countdown -->
            <section class="wk-warmup-content" id="wkPreCountdown">
              <h1>WARMUP</h1>
              <div class="wk-warmup-equipment">
                <h2>Equipment</h2>
                <p>Bodyweight</p>
              </div>
              <div class="wk-warmup-list" id="wkWarmupList">
                <div><span>1x</span> Knee Hug</div>
                <div><span>1x</span> Squat</div>
                <div><span>1x</span> Butt Kick</div>
              </div>
            </section>

            <section class="wk-countdown-footer" id="wkCountdownFooter">
              <strong id="wkCountdownNum">0:60</strong>
              <p>Pre-Workout Countdown</p>
            </section>

            <!-- Phase 2: Warm-Up Exercise -->
            <section class="wk-exercise-live-content" id="wkExercisePhase" style="display:none;">
              <h1 id="wkExSetLabel">Set 1 of 1</h1>
              <p id="wkExName" style="color: var(--color-primary, #0056D8);">Knee Hug</p>
            </section>

            <div class="wk-gauge-wrap" id="wkGaugeWrap" style="display:none;">
              <div class="wk-gauge-bars" id="wkGaugeBars"></div>
              <strong id="wkGaugeTime">0:12</strong>
            </div>

            <div class="wk-ex-video-card" id="wkVideoCard" style="display:none;">
              <div class="wk-ex-video-frame" id="wkVideoFrame">
                <!-- YouTube iframe will be injected by JS -->
                <div class="wk-ex-video-control" id="wkVideoControl" onclick="toggleWarmupVideo()" aria-label="Pause video"></div>
                <div class="wk-ex-video-progress" id="wkVideoProgress"><span id="wkVideoProgressFill"></span></div>
              </div>
            </div>
          </main>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=8"></script>
</body>
</html>
