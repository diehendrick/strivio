<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Workout Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=15">
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- ===== WORKOUT TAB: Workout Detail ===== -->
        <div class="screen screen-workout-detail screen-workout-detail-figma active" data-screen="workout-detail" style="padding:0!important;overflow:hidden;display:flex;flex-direction:column;position:relative;height:100%;">
          
          <!-- Status Bar -->
          <div class="status-bar" style="flex-shrink:0;">
            <span class="status-time">9:41</span>
            <div class="status-icons">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="10" width="3" height="5" rx="0.5" fill="#0f172a" />
                <rect x="6" y="7" width="3" height="8" rx="0.5" fill="#0f172a" />
                <rect x="11" y="3" width="3" height="12" rx="0.5" fill="#0f172a" />
              </svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 3c-1.66 0-3.08.69-4.12 1.78l.7.72A4.97 4.97 0 018 4c1.38 0 2.63.56 3.54 1.46l.7-.71A5.97 5.97 0 008 3z" fill="#0f172a" />
                <path d="M10.83 7.17A3.98 3.98 0 008 6c-1.1 0-2.08.45-2.83 1.17l.71.71A2.99 2.99 0 018 7c.83 0 1.58.34 2.12.88l.71-.71z" fill="#0f172a" />
                <circle cx="8" cy="11" r="2" fill="#0f172a" />
              </svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="5" width="2" height="6" rx="0.5" fill="#0f172a" />
                <rect x="5" y="3" width="2" height="8" rx="0.5" fill="#0f172a" />
                <rect x="9" y="1" width="2" height="10" rx="0.5" fill="#0f172a" />
                <rect x="13" y="6" width="1.5" height="4" rx="0.5" fill="#0f172a" />
              </svg>
            </div>
          </div>

          <!-- Nav Header -->
          <div class="wk-nav-header" style="justify-content: space-between; padding: 0 24px; flex-shrink:0;">
            <div style="display: flex; align-items: center; gap: 12px;">
              <button class="wk-back-btn" onclick="handleBackClick()" aria-label="Back">
                <img src="../../assets/svg_icons/back.svg" class="icon" width="22" alt="">
              </button>
              <span class="wk-nav-title" style="font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 24px; color: #1a1d26; line-height: 32px;">Workout Details</span>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
              <button id="wkDetailConflictBtn" class="wk-action-icon" style="background:none; border:none; padding:0; cursor:pointer;" onclick="showConflictAlert()" hidden>
                <img src="../../assets/svg_icons/alert.svg" width="24" height="24" alt="Conflict alert" style="filter: brightness(0) saturate(100%) invert(7%) sepia(19%) saturate(5119%) hue-rotate(191deg) brightness(92%) contrast(98%);">
              </button>
              <button id="wkDetailFavBtn" class="wk-action-icon" style="background:none; border:none; padding:0; cursor:pointer;" onclick="toggleFavoriteDetail()">
                <img id="wkDetailFavIcon" src="../../assets/svg_icons/health.svg" width="24" height="24" alt="Favorite">
              </button>
            </div>
          </div>

          <!-- Detail Body Content -->
          <div class="wk-detail-body" id="wkDetailBody" style="padding-bottom: 96px;">
            <!-- Dynamically populated -->
          </div>

          <!-- Bottom Action Bars -->
          <!-- Normal Mode Actions -->
          <div class="wk-detail-actions wk-detail-actions-normal" id="wkDetailActionsNormal" style="position: absolute; bottom: 0; left: 0; right: 0; background: #fff; padding: 12px 24px; display: flex; gap: 16px; align-items: center; box-shadow: 0 -8px 24px rgba(0,0,0,0.05); z-index: 10;">
            <button class="wk-start-btn" id="wkDetailStart" onclick="startWorkout()" style="flex: 1; height: 56px; border-radius: 9999px; background: var(--color-primary, #0056D8); color: #fff; border: none; font-size: 16px; font-weight: 800; font-family: 'Nunito', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; padding: 0;">
              <img src="../../assets/svg_icons/play.svg" class="icon" width="18" alt="" style="filter: brightness(0) invert(1);"> Start
            </button>
            <button class="wk-action-icon-settings" id="wkDetailSettings" onclick="openWorkoutSettings()" aria-label="Settings" style="width: 56px; height: 56px; border-radius: 50%; background: var(--color-primary-container, #EFF5FF); display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; flex-shrink: 0; padding: 0;">
              <img src="../../assets/svg_icons/settings.svg" class="icon" width="24" height="24" alt="">
            </button>
          </div>

          <!-- Customize Mode Actions -->
          <div class="wk-detail-actions-customize" id="wkDetailActionsCustomize" style="position: absolute; bottom: 0; left: 0; right: 0; background: #fff; padding: 12px 24px; display: none; gap: 16px; align-items: center; box-shadow: 0 -8px 24px rgba(0,0,0,0.05); z-index: 10;">
            <button class="wk-sheet-action-btn" id="wkDetailSave" onclick="saveCustomizedWorkout()" style="flex: 1;">
              <img src="../../assets/svg_icons/play.svg" class="icon" width="18" alt="" style="filter: brightness(0) invert(1);"> Save Changes
            </button>
            <button class="wk-action-icon-cancel" id="wkDetailCancelCustomize" onclick="exitCustomizeMode(false)" aria-label="Cancel" style="width: 56px; height: 56px; border-radius: 50%; background: var(--color-primary-container, #EFF5FF); display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; flex-shrink: 0; padding: 0;">
              <img src="../../assets/svg_icons/cross-x.svg" class="icon" width="20" height="20" alt="">
            </button>
          </div>

          <!-- ===== ADD EXERCISE BOTTOM SHEET ===== -->
          <div class="wk-bottom-sheet-backdrop" id="addSheetBackdrop" onclick="closeAddExerciseSheet()"></div>
          <div class="wk-bottom-sheet" id="addExerciseSheet">
            <div class="wk-sheet-handle"></div>
            <div class="wk-sheet-header">
              <h2 class="wk-sheet-title">Add Exercise</h2>
              <button class="wk-sheet-close" onclick="closeAddExerciseSheet()">
                <img src="../../assets/svg_icons/cross-x.svg" alt="Close">
              </button>
            </div>
            
            <!-- Search bar -->
            <div class="wk-sheet-search-wrap">
              <img src="../../assets/svg_icons/search.svg" class="wk-sheet-search-icon-img" alt="Search">
              <input type="text" class="wk-sheet-search-input" placeholder="Search workouts..." id="addSheetSearch" oninput="handleAddSheetSearch(this.value)">
              <button class="wk-sheet-search-clear" id="addSheetSearchClear" onclick="clearAddSheetSearch()" style="display:none">
                <img src="../../assets/svg_icons/cross-x.svg" alt="Clear">
              </button>
            </div>

            <!-- Filters -->
            <div class="wk-sheet-filter-row" id="addSheetFiltersContainer">
              <button class="wk-sheet-adv-filter-btn" id="addSheetAdvFilterToggle" onclick="toggleAddSheetAdvFilter()" aria-label="Advanced filters">
                <img src="../../assets/svg_icons/settings-1.svg" alt="Filters">
              </button>
              
              <!-- Level Dropdown Chip -->
              <div style="position: relative;">
                <button class="wk-sheet-filter-chip" id="addSheetLevelChip" onclick="toggleDropdownMenu(event, 'level')">
                  <span id="addSheetLevelText">Level</span>
                  <img src="../../assets/svg_icons/down.svg" class="chevron" alt="">
                </button>
                <div class="wk-dropdown-menu" id="addSheetLevelMenu">
                  <!-- Dynamically rendered -->
                </div>
              </div>

              <!-- Location Dropdown Chip -->
              <div style="position: relative;">
                <button class="wk-sheet-filter-chip" id="addSheetLocationChip" onclick="toggleDropdownMenu(event, 'location')">
                  <span id="addSheetLocationText">Location</span>
                  <img src="../../assets/svg_icons/down.svg" class="chevron" alt="">
                </button>
                <div class="wk-dropdown-menu" id="addSheetLocationMenu">
                  <!-- Dynamically rendered -->
                </div>
              </div>
            </div>

            <!-- Advanced Filter muscle options row (initially hidden) -->
            <div id="addSheetAdvFilterRow" style="display:none; padding:0 24px 12px; gap:8px; overflow-x:auto; scrollbar-width:none; flex-shrink:0;">
              <!-- Dynamically populated muscle tags -->
            </div>

            <!-- Exercise List -->
            <div class="wk-sheet-list" id="addSheetList">
              <!-- Dynamically populated -->
            </div>

            <!-- Footer Action Button -->
            <div class="wk-sheet-footer">
              <button class="wk-sheet-action-btn" id="addSheetApplyBtn" onclick="applyAddExercises()" disabled>
                Add Selected (0)
              </button>
            </div>
          </div>

          <!-- ===== EDIT EXERCISE BOTTOM SHEET ===== -->
          <div class="wk-bottom-sheet-backdrop" id="editSheetBackdrop" onclick="closeEditExerciseSheet()"></div>
          <div class="wk-bottom-sheet" id="editExerciseSheet">
            <div class="wk-sheet-handle"></div>
            <div class="wk-sheet-header">
              <h2 class="wk-sheet-title">Edit Exercise</h2>
              <button class="wk-sheet-close" onclick="closeEditExerciseSheet()">
                <img src="../../assets/svg_icons/cross-x.svg" alt="Close">
              </button>
            </div>

            <!-- Exercise Info Summary -->
            <div style="display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--color-border, #f4f4f4); flex-shrink:0;">
              <div class="wk-sheet-item-img" id="editSheetExImg" style="width: 56px; height: 56px; border-radius: 12px;">
                <!-- img tag -->
              </div>
              <div class="wk-sheet-item-text">
                <div class="wk-sheet-item-name" id="editSheetExName" style="font-size: 16px;">Barbell Bench</div>
                <div class="wk-sheet-item-details" id="editSheetExParams">4 sets · 8 reps</div>
              </div>
            </div>

            <!-- Stepper Container -->
            <div class="wk-edit-stepper-container">
              <div class="wk-edit-badge-row">
                <h3>Total Sets and Reps</h3>
                <span class="wk-edit-badge">
                  <img src="../../assets/svg_icons/dumbbell-ray.svg" alt="">
                  <span id="editSheetTotalSummaryBadge">4 Sets 8 Reps</span>
                </span>
              </div>

              <!-- Sets Stepper -->
              <div class="wk-edit-stepper-row">
                <span class="wk-edit-stepper-title">Sets</span>
                <div class="wk-edit-stepper-ctrl">
                  <button class="wk-edit-stepper-btn" onclick="adjustEditStepper('sets', -1)">
                    <img src="../../assets/svg_icons/minus.svg" alt="-">
                  </button>
                  <span class="wk-edit-stepper-val" id="editSheetSetsVal">4</span>
                  <button class="wk-edit-stepper-btn" onclick="adjustEditStepper('sets', 1)">
                    <img src="../../assets/svg_icons/plus.svg" alt="+">
                  </button>
                </div>
              </div>

              <!-- Reps Stepper -->
              <div class="wk-edit-stepper-row">
                <span class="wk-edit-stepper-title" id="editSheetRepsTitle">Reps</span>
                <div class="wk-edit-stepper-ctrl">
                  <button class="wk-edit-stepper-btn" onclick="adjustEditStepper('reps', -1)">
                    <img src="../../assets/svg_icons/minus.svg" alt="-">
                  </button>
                  <span class="wk-edit-stepper-val" id="editSheetRepsVal">8</span>
                  <button class="wk-edit-stepper-btn" onclick="adjustEditStepper('reps', 1)">
                    <img src="../../assets/svg_icons/plus.svg" alt="+">
                  </button>
                </div>
              </div>

              <!-- Rest Time Stepper -->
              <div class="wk-edit-stepper-row">
                <span class="wk-edit-stepper-title">Rest Time</span>
                <div class="wk-edit-stepper-ctrl">
                  <button class="wk-edit-stepper-btn" onclick="adjustEditStepper('rest', -15)">
                    <img src="../../assets/svg_icons/minus.svg" alt="-">
                  </button>
                  <span class="wk-edit-stepper-val" id="editSheetRestVal">60 sec</span>
                  <button class="wk-edit-stepper-btn" onclick="adjustEditStepper('rest', 15)">
                    <img src="../../assets/svg_icons/plus.svg" alt="+">
                  </button>
                </div>
              </div>
            </div>

            <!-- Footer Action Button -->
            <div class="wk-sheet-footer">
              <button class="wk-sheet-action-btn" id="editSheetSaveBtn" onclick="saveEditExercise()" disabled>
                Save
              </button>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="../../app.js?v=15"></script>
  <script>
    (function () {
      // ── Local working variables ──
      var activeWorkout = null;
      var currentExercises = [];
      var isCustomizeMode = false;
      var dragSrcEl = null;

      // ── Add Sheet variables ──
      var addSheetSelected = []; // array of exercise objects
      var addSheetSearchVal = '';
      var addSheetActiveLevel = 'all';
      var addSheetActiveLocation = 'all';
      var addSheetActiveMuscle = 'all';
      var addSheetShowAdvFilters = false;

      // ── Edit Sheet variables ──
      var editActiveIndex = -1;
      var editCurrentState = { sets: 3, reps: 10, rest: 60 };
      var editOriginalState = { sets: 3, reps: 10, rest: 60 };

      // Helper: get exercise image
      function getExerciseImage(ex) {
        var name = String(ex.name || '').toLowerCase();
        if (name.indexOf('bench') >= 0) return '../../assets/img/workouts/barbell_bench.png';
        if (name.indexOf('row') >= 0) return '../../assets/img/workouts/barbel_row.png';
        if (name.indexOf('overhead') >= 0 || name.indexOf('ohp') >= 0 || name.indexOf('press') >= 0) return '../../assets/img/workouts/overhead_press.png';
        if (name.indexOf('pull') >= 0) return '../../assets/img/workouts/Pull-Ups.png';
        if (name.indexOf('curl') >= 0) return '../../assets/img/workouts/barbell_curl.png';
        if (name.indexOf('squat') >= 0) return '../../assets/img/workouts/barber_squat.png';
        if (name.indexOf('plank') >= 0) return '../../assets/img/workouts/plank.png';
        if (name.indexOf('hiit') >= 0 || name.indexOf('cardio') >= 0) return '../../assets/img/workouts/Cardio.png';
        return '../../assets/img/workouts/strength_building.png';
      }

      function getSavedWorkout() {
        try {
          var rawState = localStorage.getItem('strivio_state');
          var savedState = rawState ? JSON.parse(rawState) : null;
          if (savedState && savedState.currentWorkout) {
            return savedState.currentWorkout;
          }
        } catch (error) {}
        
        // Fallback w1 Upper Body Strength
        return {
          id: 'w1',
          name: 'Upper Body Strength',
          muscle: 'chest',
          muscles: ['Chest', 'Shoulders', 'Upper Back'],
          duration: 45,
          difficulty: 'intermediate',
          equipment: ['Barbell', 'Dumbbells', 'Pull-up Bar'],
          calories: 280,
          desc: 'Build overall upper body strength with compound movements.',
          exercises: ['e1', 'e4', 'e3', 'e2', 'e20', 'e7']
        };
      }

      function getWorkoutExerciseList(workout) {
        var items = workout.exercises || [];
        return items.map(function (item, index) {
          if (item && typeof item === 'object') {
            return {
              id: item.id || 'fallback-' + index,
              name: item.name || 'Exercise',
              sets: item.sets || 3,
              reps: String(item.reps || '10'),
              equipment: item.equipment || 'Bodyweight',
              rest: item.rest || 60,
              difficulty: item.difficulty || 'intermediate',
              muscle: item.muscle || 'general',
              muscles: item.muscles || []
            };
          }
          // String ID
          if (typeof window.getEx === 'function') {
            var libEx = window.getEx(item);
            if (libEx) {
              return {
                id: libEx.id,
                name: libEx.name,
                sets: libEx.sets || 3,
                reps: String(libEx.reps || '10'),
                equipment: libEx.equipment || 'Bodyweight',
                rest: libEx.rest || 60,
                difficulty: libEx.difficulty || 'intermediate',
                muscle: libEx.muscle || 'general',
                muscles: libEx.muscles || []
              };
            }
          }
          return {
            id: String(item),
            name: 'Exercise ' + (index + 1),
            sets: 3,
            reps: '10',
            equipment: 'Bodyweight',
            rest: 60
          };
        });
      }

      function escapeText(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Render the workout detail content dynamically
      function renderDetail() {
        var body = document.getElementById('wkDetailBody');
        if (!body) return;

        var w = activeWorkout;
        var difficultyLabel = String(w.difficulty || 'intermediate');
        difficultyLabel = difficultyLabel.charAt(0).toUpperCase() + difficultyLabel.slice(1);
        
        // Favorite icon toggle state
        var favIcon = document.getElementById('wkDetailFavIcon');
        if (favIcon) {
          if (w.favorite) {
            // Active: primary blue color
            favIcon.style.filter = 'brightness(0) saturate(100%) invert(16%) sepia(88%) saturate(3280%) hue-rotate(210deg) brightness(94%) contrast(101%)';
          } else {
            // Inactive: dark textprimary
            favIcon.style.filter = 'brightness(0) saturate(100%) invert(7%) sepia(19%) saturate(5119%) hue-rotate(191deg) brightness(92%) contrast(98%)';
          }
        }

        // Equipment list
        var eqList = Array.isArray(w.equipment) ? w.equipment.join(', ') : (w.equipment || 'Bodyweight');

        // Dynamic target area badges
        var badgeHtml = (w.muscles || ['Chest', 'Shoulders']).map(function(muscle) {
          var cleanName = muscle.toLowerCase().replace(/\s+/g, '-');
          var imgUrl = '../../assets/img/anatomical-muscles/anatomical-' + cleanName + '.png';
          // Check fallback for muscle names
          if (cleanName === 'upper-back' || cleanName === 'back') {
            imgUrl = '../../assets/img/anatomical-muscles/anatomical-upper-back.png';
          } else if (cleanName === 'chest') {
            imgUrl = '../../assets/img/anatomical-muscles/anatomical-chest.png';
          } else if (cleanName === 'shoulders') {
            imgUrl = '../../assets/img/anatomical-muscles/anatomical-shoulders.png';
          } else if (cleanName === 'forearm' || cleanName === 'arms') {
            imgUrl = '../../assets/img/anatomical-muscles/anatomical-forearm.png';
          } else if (cleanName === 'triceps') {
            imgUrl = '../../assets/img/anatomical-muscles/anatomical-tricep.png';
          } else if (cleanName === 'biceps' || cleanName === 'bicep') {
            imgUrl = '../../assets/img/anatomical-muscles/anatomical-bicep.png';
          } else {
            imgUrl = '../../assets/img/anatomical-muscles/anatomical-chest.png'; // default fallback
          }

          return '<div class="wk-muscle-badge">' +
            '<img src="' + imgUrl + '" alt="' + escapeText(muscle) + '">' +
            '<span>' + escapeText(muscle) + '</span>' +
          '</div>';
        }).join('');

        // Exercise Rows
        var exerciseRowsHtml = currentExercises.map(function (ex, index) {
          var formattedReps = String(ex.reps).indexOf('sec') >= 0 || String(ex.reps).indexOf('s') >= 0 ? ex.reps : ex.reps + ' reps';
          var isLast = index === currentExercises.length - 1;
          var rowBorderStyle = isLast ? 'none' : '1px solid var(--color-border, #f4f4f4)';

          if (isCustomizeMode) {
            return '<div class="wk-detail-ex-row" draggable="true" data-index="' + index + '" style="cursor: grab; display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: ' + rowBorderStyle + '; margin-bottom: ' + (isLast ? '0' : '12px') + ';">' +
              '<div style="display:flex; align-items:center; gap: 8px; flex: 1; min-width: 0;">' +
                '<div class="wk-ex-drag-handle" style="display: inline-flex; width: 24px; height: 24px; justify-content: center; align-items: center; flex-shrink: 0;">' +
                  '<img src="../../assets/svg_icons/grid dot vertical.svg" alt="Drag" style="opacity: 0.4;">' +
                '</div>' +
                '<div style="display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0;">' +
                  '<div style="width: 64px; height: 64px; border-radius: 12px; overflow: hidden; background: var(--color-primary-container, #EFF5FF); flex-shrink: 0; position: relative;">' +
                    '<img src="' + getExerciseImage(ex) + '" alt="' + escapeText(ex.name) + '" style="width: 100%; height: 100%; object-fit: cover;">' +
                  '</div>' +
                  '<div onclick="openEditExerciseSheet(' + index + ')" style="flex: 1; min-width: 0; cursor: pointer;">' +
                    '<span style="font-family: \'Nunito\', sans-serif; font-size: 14px; font-weight: 700; color: var(--color-text-primary, #0f172a); letter-spacing: 0.1px; line-height: 20px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">' + escapeText(ex.name) + '</span>' +
                    '<span style="font-family: \'Nunito\', sans-serif; font-size: 12px; font-weight: 400; color: var(--color-text-tertiary, #64748b); letter-spacing: 0; line-height: 16px; display: block;">' + escapeText(ex.sets) + ' sets · ' + escapeText(formattedReps) + '</span>' +
                  '</div>' +
                '</div>' +
              '</div>' +
              '<button class="wk-ex-delete-btn" onclick="deleteExercise(' + index + ')" style="border: none; background: transparent; cursor: pointer; padding: 4px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; margin-left: 8px;">' +
                '<img src="../../assets/svg_icons/minus.svg" alt="Delete" style="width: 24px; height: 24px; filter: invert(27%) sepia(98%) saturate(1200%) hue-rotate(337deg) brightness(90%);">' +
              '</button>' +
            '</div>';
          } else {
            return '<div class="wk-detail-ex-row" style="display: flex; align-items: center; gap: 14px; padding-bottom: ' + (isLast ? '0' : '12px') + '; border-bottom: ' + rowBorderStyle + '; margin-bottom: ' + (isLast ? '0' : '12px') + ';">' +
              '<div style="width: 64px; height: 64px; border-radius: 12px; overflow: hidden; background: var(--color-primary-container, #EFF5FF); flex-shrink: 0; position: relative;">' +
                '<img src="' + getExerciseImage(ex) + '" alt="' + escapeText(ex.name) + '" style="width: 100%; height: 100%; object-fit: cover;">' +
              '</div>' +
              '<div style="flex: 1; min-width: 0; display: flex; flex-direction: row; align-items: center; gap: 14px;">' +
                '<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">' +
                  '<span style="font-family: \'Nunito\', sans-serif; font-size: 14px; font-weight: 700; color: var(--color-text-primary, #0f172a); letter-spacing: 0.1px; line-height: 20px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">' + escapeText(ex.name) + '</span>' +
                  '<span style="font-family: \'Nunito\', sans-serif; font-size: 12px; font-weight: 400; color: var(--color-text-tertiary, #64748b); letter-spacing: 0; line-height: 16px; display: block;">' + escapeText(ex.sets) + ' sets · ' + escapeText(formattedReps) + '</span>' +
                '</div>' +

      function setupDragAndDrop() {
        var rows = document.querySelectorAll('#wkDetailExercisesListContainer .wk-detail-ex-row');
        rows.forEach(function (row) {
          row.addEventListener('dragstart', handleDragStart, false);
          row.addEventListener('dragenter', handleDragEnter, false);
          row.addEventListener('dragover', handleDragOver, false);
          row.addEventListener('dragleave', handleDragLeave, false);
          row.addEventListener('drop', handleDrop, false);
          row.addEventListener('dragend', handleDragEnd, false);
        });
      }

      function handleDragStart(e) {
        dragSrcEl = this;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', this.dataset.index);
        this.classList.add('is-dragging');
      }

      function handleDragOver(e) {
        if (e.preventDefault) {
          e.preventDefault();
        }
        e.dataTransfer.dropEffect = 'move';
        return false;
      }

      function handleDragEnter(e) {
        this.classList.add('drag-over');
      }

      function handleDragLeave(e) {
        this.classList.remove('drag-over');
      }

      function handleDrop(e) {
        if (e.stopPropagation) {
          e.stopPropagation();
        }
        
        this.classList.remove('drag-over');
        
        var sourceIndex = parseInt(e.dataTransfer.getData('text/plain'), 10);
        var targetIndex = parseInt(this.dataset.index, 10);
        
        if (sourceIndex !== targetIndex) {
          // Reorder array
          var movedItem = currentExercises.splice(sourceIndex, 1)[0];
          currentExercises.splice(targetIndex, 0, movedItem);
          renderDetail();
          updateSaveBtnDisabledState();
        }
        return false;
      }

      function handleDragEnd(e) {
        this.classList.remove('is-dragging');
        var rows = document.querySelectorAll('#wkDetailExercisesListContainer .wk-detail-ex-row');
        rows.forEach(function (row) {
          row.classList.remove('drag-over');
        });
      }

      // ── Save Changes to LocalStorage ──
      window.saveCustomizedWorkout = function saveCustomizedWorkout() {
        activeWorkout.exercises = currentExercises.map(function(ex) {
          return {
            id: ex.id,
            name: ex.name,
            sets: ex.sets,
            reps: ex.reps,
            equipment: ex.equipment,
            rest: ex.rest,
            difficulty: ex.difficulty,
            muscle: ex.muscle,
            muscles: ex.muscles
          };
        });

        // Save back to global state
        if (typeof state !== 'undefined') {
          state.currentWorkout = activeWorkout;
          
          // Also update in customWorkouts list if exists there
          if (Array.isArray(state.customWorkouts)) {
            var idx = state.customWorkouts.findIndex(function(cw) { return cw.id === activeWorkout.id; });
            if (idx >= 0) {
              state.customWorkouts[idx] = activeWorkout;
            }
          }
          
          try {
            localStorage.setItem('strivio_state', JSON.stringify(state));
          } catch(e) {}
        }
        
        exitCustomizeMode(true);
        showToast("Workout customized successfully!");
      };

      function updateSaveBtnDisabledState() {
        // Workout detail save changes button behaviour:
        // Mockup dictates "by default botton akan ke disabled, jika ada ubahan baru botton akan enabled."
        var saveBtn = document.getElementById('wkDetailSave');
        if (!saveBtn) return;
        
        var originalExs = getWorkoutExerciseList(activeWorkout);
        var isChanged = false;
        
        if (currentExercises.length !== originalExs.length) {
          isChanged = true;
        } else {
          for (var i = 0; i < currentExercises.length; i++) {
            if (currentExercises[i].id !== originalExs[i].id ||
                currentExercises[i].sets !== originalExs[i].sets ||
                currentExercises[i].reps !== originalExs[i].reps ||
                currentExercises[i].rest !== originalExs[i].rest) {
              isChanged = true;
              break;
            }
          }
        }
        
        if (isChanged) {
          saveBtn.disabled = false;
          saveBtn.style.opacity = '1';
        } else {
          saveBtn.disabled = true;
          saveBtn.style.opacity = '0.5';
        }
      }

      function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);

      // Populate exercises list inside bottom sheet
      function renderAddSheetList() {
        var container = document.getElementById('addSheetList');
        if (!container || typeof exerciseLibrary === 'undefined') return;

        // Filter list
        var list = exerciseLibrary.filter(function(ex) {
          // Search
          if (addSheetSearchVal) {
            var q = addSheetSearchVal.toLowerCase();
            var matchedSearch = ex.name.toLowerCase().indexOf(q) >= 0 ||
                                (ex.equipment && ex.equipment.toLowerCase().indexOf(q) >= 0) ||
                                (ex.muscle && ex.muscle.toLowerCase().indexOf(q) >= 0);
            if (!matchedSearch) return false;
          }
          // Level
          if (addSheetActiveLevel !== 'all' && ex.difficulty !== addSheetActiveLevel) return false;
          // Location (mapping equipment to location category)
          if (addSheetActiveLocation !== 'all') {
            var isHome = addSheetActiveLocation === 'home';
            var isGym = addSheetActiveLocation === 'gym';
            var eq = String(ex.equipment || '').toLowerCase();
            if (isHome && eq.indexOf('machine') >= 0) return false;
            if (isGym && eq.indexOf('bodyweight') >= 0 && eq.indexOf('barbell') === -1) return false;
          }
          // Muscle (Advanced filter)
          if (addSheetActiveMuscle !== 'all') {
            if (ex.muscle !== addSheetActiveMuscle && (ex.muscles || []).map(function(m) { return m.toLowerCase(); }).indexOf(addSheetActiveMuscle) === -1) {
              return false;
            }
          }
          return true;
        });

        if (!list.length) {
          container.innerHTML = '<div style="text-align:center; padding: 40px 20px; color:#64748b; font-family:\'Nunito\';">No exercises found match these filters.</div>';
          return;
        }

        container.innerHTML = list.map(function(ex) {
          // Check if already selected or already in workout
          var isDraftSelected = addSheetSelected.some(function(item) { return item.id === ex.id; });
          var isAlreadyInWorkout = currentExercises.some(function(item) { return item.id === ex.id; });
          
          var isSelectedState = isDraftSelected || isAlreadyInWorkout;
          var iconUrl = isSelectedState ? '../../assets/svg_icons/minus.svg' : '../../assets/svg_icons/plus.svg';
          var filterStyle = isSelectedState ? '' : 'filter: invert(36%) sepia(85%) saturate(2283%) hue-rotate(205deg) brightness(91%) contrast(101%);';

          return '<div class="wk-sheet-item">' +
            '<div class="wk-sheet-item-left">' +
              '<div class="wk-sheet-item-img">' +
                '<img src="' + getExerciseImage(ex) + '" alt="">' +
              '</div>' +
              '<div class="wk-sheet-item-text">' +
                '<div class="wk-sheet-item-name">' + escapeText(ex.name) + '</div>' +
                '<div class="wk-sheet-item-details">' + escapeText(ex.sets || 3) + ' sets · ' + escapeText(ex.reps || '10') + ' reps · ' + escapeText(ex.equipment || 'Bodyweight') + '</div>' +
              '</div>' +
            '</div>' +
            '<button class="wk-sheet-item-toggle" onclick="toggleAddSheetExercise(' + JSON.stringify(ex).replace(/"/g, '&quot;') + ')">' +
              '<img src="' + iconUrl + '" alt="" style="' + filterStyle + '">' +
            '</button>' +
          '</div>';
        }).join('');
      }

      window.toggleAddSheetExercise = function toggleAddSheetExercise(ex) {
        // Find if in selected draft
        var idx = addSheetSelected.findIndex(function(item) { return item.id === ex.id; });
        var isAlreadyInWorkout = currentExercises.some(function(item) { return item.id === ex.id; });
        
        if (isAlreadyInWorkout) {
          // If already in workout, clicking minus deletes it directly from currentExercises
          var workIdx = currentExercises.findIndex(function(item) { return item.id === ex.id; });
          if (workIdx >= 0) {
            currentExercises.splice(workIdx, 1);
            showToast("Removed " + ex.name);
          }
        } else {
          if (idx >= 0) {
            addSheetSelected.splice(idx, 1);
          } else {
            addSheetSelected.push({
              id: ex.id,
              name: ex.name,
              sets: ex.sets || 3,
              reps: String(ex.reps || '10'),
              equipment: ex.equipment || 'Bodyweight',
              rest: ex.rest || 60,
              difficulty: ex.difficulty || 'intermediate',
              muscle: ex.muscle || 'general',
              muscles: ex.muscles || []
            });
          }
        }
        
        renderAddSheetList();
        updateAddSheetApplyButton();
        renderDetail(); // Keep main page detail updated
      };

      function updateAddSheetApplyButton() {
        var btn = document.getElementById('addSheetApplyBtn');
        if (!btn) return;
        var count = addSheetSelected.length;
        btn.textContent = 'Add Selected (' + count + ')';
        
        if (count > 0) {
          btn.disabled = false;
          btn.style.opacity = '1';
        } else {
          btn.disabled = true;
          btn.style.opacity = '0.5';
        }
      }

      window.applyAddExercises = function applyAddExercises() {
        if (!addSheetSelected.length) return;
        
        // Append selections
        currentExercises = currentExercises.concat(addSheetSelected);
        renderDetail();
        closeAddExerciseSheet();
        updateSaveBtnDisabledState();
        showToast("Added " + addSheetSelected.length + " exercise(s) to workout");
      };

      // ── EDIT EXERCISE BOTTOM SHEET LOGIC ──
      window.openEditExerciseSheet = function openEditExerciseSheet(index) {
        editActiveIndex = index;
        var ex = currentExercises[index];
        if (!ex) return;

        // Setup image & text
        document.getElementById('editSheetExImg').innerHTML = '<img src="' + getExerciseImage(ex) + '" style="width:100%; height:100%; object-fit:cover;">';
        document.getElementById('editSheetExName').textContent = ex.name;
        
        var formattedReps = String(ex.reps).indexOf('sec') >= 0 || String(ex.reps).indexOf('s') >= 0 ? ex.reps : ex.reps + ' reps';
        document.getElementById('editSheetExParams').textContent = ex.sets + ' sets · ' + formattedReps;

        // Parse reps number
        var parsedReps = parseInt(ex.reps, 10);
        if (isNaN(parsedReps)) parsedReps = 10;
        
        var isSeconds = String(ex.reps).indexOf('sec') >= 0 || String(ex.reps).indexOf('s') >= 0;
        document.getElementById('editSheetRepsTitle').textContent = isSeconds ? 'Seconds' : 'Reps';

        // Load state
        editCurrentState.sets = parseInt(ex.sets, 10) || 3;
        editCurrentState.reps = parsedReps;
        editCurrentState.rest = parseInt(ex.rest, 10) || 60;
        editCurrentState.isSeconds = isSeconds;

        // Store original state to detect modification
        editOriginalState.sets = editCurrentState.sets;
        editOriginalState.reps = editCurrentState.reps;
        editOriginalState.rest = editCurrentState.rest;
        editOriginalState.isSeconds = isSeconds;

        renderEditSheetSteppers();

        document.getElementById('editSheetBackdrop').classList.add('is-visible');
        document.getElementById('editExerciseSheet').classList.add('is-open');
      };

      window.closeEditExerciseSheet = function closeEditExerciseSheet() {
        document.getElementById('editSheetBackdrop').classList.remove('is-visible');
        document.getElementById('editExerciseSheet').classList.remove('is-open');
        editActiveIndex = -1;
      };

      function renderEditSheetSteppers() {
        document.getElementById('editSheetSetsVal').textContent = editCurrentState.sets;
        
        var repsLabel = editCurrentState.isSeconds ? editCurrentState.reps + 's' : editCurrentState.reps;
        document.getElementById('editSheetRepsVal').textContent = repsLabel;
        
        document.getElementById('editSheetRestVal').textContent = editCurrentState.rest + ' sec';

        // Badge pill
        var textBadge = editCurrentState.sets + ' Sets ' + (editCurrentState.isSeconds ? editCurrentState.reps + ' Secs' : editCurrentState.reps + ' Reps');
        document.getElementById('editSheetTotalSummaryBadge').textContent = textBadge;

        // Disable/enable Save button
        var saveBtn = document.getElementById('editSheetSaveBtn');
        var isModified = editCurrentState.sets !== editOriginalState.sets ||
                           editCurrentState.reps !== editOriginalState.reps ||
                           editCurrentState.rest !== editOriginalState.rest;
        
        if (isModified) {
          saveBtn.disabled = false;
          saveBtn.style.opacity = '1';
        } else {
          saveBtn.disabled = true;
          saveBtn.style.opacity = '0.5';
        }
      }

      window.adjustEditStepper = function adjustEditStepper(type, delta) {
        if (type === 'sets') {
          editCurrentState.sets = Math.max(1, Math.min(10, editCurrentState.sets + delta));
        } else if (type === 'reps') {
          var step = editCurrentState.isSeconds ? 5 : 1;
          editCurrentState.reps = Math.max(1, Math.min(120, editCurrentState.reps + (delta * step)));
        } else if (type === 'rest') {
          editCurrentState.rest = Math.max(0, Math.min(600, editCurrentState.rest + delta));
        }
        renderEditSheetSteppers();
      };

      window.saveEditExercise = function saveEditExercise() {
        if (editActiveIndex < 0) return;
        var ex = currentExercises[editActiveIndex];
        if (!ex) return;

        ex.sets = editCurrentState.sets;
        var repSuffix = editCurrentState.isSeconds ? ' sec' : '';
        ex.reps = String(editCurrentState.reps) + repSuffix;
        ex.rest = editCurrentState.rest;

        renderDetail();
        closeEditExerciseSheet();
        updateSaveBtnDisabledState();
        showToast("Exercise sets/reps updated");
      };

      // ── Custom Page Loader Hook ──
      window.initWorkoutDetailCustom = function initWorkoutDetailCustom() {
        activeWorkout = getSavedWorkout();
        currentExercises = getWorkoutExerciseList(activeWorkout);
        isCustomizeMode = false;
        
        // Show conflict icon if warning active
        var conflictBtn = document.getElementById('wkDetailConflictBtn');
        if (conflictBtn) {
          conflictBtn.hidden = activeWorkout.conflict ? false : true;
        }

        renderDetail();
        
        // Initial setup for customize buttons display
        document.getElementById('wkDetailActionsNormal').style.display = 'flex';
        document.getElementById('wkDetailActionsCustomize').style.display = 'none';
        
        // Override global initWorkoutDetail in app.js
        window.initWorkoutDetail = function() {
          activeWorkout = getSavedWorkout();
          currentExercises = getWorkoutExerciseList(activeWorkout);
          renderDetail();
        };
      };

      // Bind window load
      window.addEventListener('load', function () {
        setTimeout(function () {
          window.initWorkoutDetailCustom();
        }, 100);
      });
    })();
  </script>
</body>
</html>
