<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Workout Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=15">
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>

<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- ===== WORKOUT TAB: Workout Detail ===== -->
        <div class="screen screen-workout-detail screen-workout-detail-figma active" data-screen="workout-detail">

          <!-- Status Bar -->
          <div class="status-bar">
            <span class="status-time">9:41</span>
            <span class="status-time">9:41</span>
            <div class="status-icons">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="10" width="3" height="5" rx="0.5" fill="#0f172a" />
                <rect x="6" y="7" width="3" height="8" rx="0.5" fill="#0f172a" />
                <rect x="11" y="3" width="3" height="12" rx="0.5" fill="#0f172a" />
              </svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path
                  d="M8 3c-1.66 0-3.08.69-4.12 1.78l.7.72A4.97 4.97 0 018 4c1.38 0 2.63.56 3.54 1.46l.7-.71A5.97 5.97 0 008 3z"
                  fill="#0f172a" />
                <path
                  d="M10.83 7.17A3.98 3.98 0 008 6c-1.1 0-2.08.45-2.83 1.17l.71.71A2.99 2.99 0 018 7c.83 0 1.58.34 2.12.88l.71-.71z"
                  fill="#0f172a" />
                <circle cx="8" cy="11" r="2" fill="#0f172a" />
              </svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="5" width="2" height="6" rx="0.5" fill="#0f172a" />
                <rect x="5" y="3" width="2" height="8" rx="0.5" fill="#0f172a" />
                <rect x="9" y="1" width="2" height="10" rx="0.5" fill="#0f172a" />
                <rect x="13" y="6" width="1.5" height="4" rx="0.5" fill="#0f172a" />
              </svg>
            </div>
          </div>

          <!-- Nav Header -->
          <div class="wk-nav-header">
            <div class="wk-nav-header-left">
              <button class="wk-back-btn" onclick="handleBackClick()" aria-label="Back">
                <img src="../../assets/svg_icons/back.svg" class="icon" width="22" alt="">
              </button>
              <span class="wk-nav-title">Workout Details</span>
            </div>
            <div class="wk-nav-header-right">
              <button id="wkDetailConflictBtn" class="wk-action-icon" onclick="showConflictAlert()" aria-label="Conflict alert">
                <span class="wk-icon-wrapper wk-icon-alert">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g clip-path="url(#clip0_448_6227)">
                      <path d="M22.536 8.46014L15.537 1.45914C14.592 0.515141 13.337 -0.00585938 12.001 -0.00585938C10.665 -0.00585938 9.409 0.515141 8.465 1.45914L1.466 8.46014C-0.483004 10.4091 -0.483004 13.5801 1.466 15.5291L8.465 22.5301C9.409 23.4741 10.665 23.9951 12.001 23.9951C13.337 23.9951 14.592 23.4741 15.537 22.5301L22.536 15.5291C23.48 14.5851 24 13.3301 24 11.9951C24 10.6601 23.48 9.40414 22.536 8.46014ZM21.122 14.1151L14.123 21.1161C12.989 22.2491 11.013 22.2491 9.879 21.1161L2.88 14.1151C1.711 12.9461 1.711 11.0431 2.88 9.87414L9.879 2.87314C10.446 2.30714 11.199 1.99414 12.001 1.99414C12.803 1.99414 13.556 2.30614 14.123 2.87314L21.122 9.87414C21.688 10.4401 22 11.1931 22 11.9951C22 12.7971 21.688 13.5491 21.122 14.1151ZM13.5 16.5001C13.5 17.3281 12.828 18.0001 12 18.0001C11.172 18.0001 10.5 17.3281 10.5 16.5001C10.5 15.6721 11.172 15.0001 12 15.0001C12.828 15.0001 13.5 15.6721 13.5 16.5001ZM11 12.5001V7.00014C11 6.44714 11.448 6.00014 12 6.00014C12.552 6.00014 13 6.44714 13 7.00014V12.5001C13 13.0531 12.552 13.5001 12 13.5001C11.448 13.5001 11 13.0531 11 12.5001Z" fill="currentColor"/>
                    </g>
                    <defs>
                      <clipPath id="clip0_448_6227">
                        <rect width="24" height="24" fill="white"/>
                      </clipPath>
                    </defs>
                  </svg>
                </span>
              </button>
              <button id="wkDetailFavBtn" class="wk-action-icon" onclick="toggleFavoriteDetail()" aria-label="Favorite">
                <span class="wk-icon-wrapper wk-icon-favorite" id="wkDetailFavIconWrapper">
                  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <g clip-path="url(#clip0_488_3434)">
                      <path d="M17.5 1.91699C16.374 1.93451 15.2725 2.24885 14.3068 2.82826C13.3411 3.40768 12.5454 4.23166 12 5.21699C11.4547 4.23166 10.659 3.40768 9.69326 2.82826C8.72756 2.24885 7.62607 1.93451 6.50002 1.91699C4.70496 1.99498 3.01373 2.78025 1.7958 4.10122C0.577879 5.4222 -0.0677312 7.17152 1.93259e-05 8.96699C1.93259e-05 13.514 4.78602 18.48 8.80002 21.847C9.69624 22.6001 10.8294 23.013 12 23.013C13.1707 23.013 14.3038 22.6001 15.2 21.847C19.214 18.48 24 13.514 24 8.96699C24.0678 7.17152 23.4222 5.4222 22.2042 4.10122C20.9863 2.78025 19.2951 1.99498 17.5 1.91699ZM13.915 20.317C13.379 20.7684 12.7008 21.0159 12 21.0159C11.2993 21.0159 10.621 20.7684 10.085 20.317C4.94702 16.006 2.00002 11.87 2.00002 8.96699C1.93166 7.70171 2.36639 6.46072 3.20938 5.51469C4.05238 4.56866 5.23525 3.99434 6.50002 3.91699C7.76479 3.99434 8.94766 4.56866 9.79066 5.51469C10.6337 6.46072 11.0684 7.70171 11 8.96699C11 9.23221 11.1054 9.48656 11.2929 9.6741C11.4804 9.86164 11.7348 9.96699 12 9.96699C12.2652 9.96699 12.5196 9.86164 12.7071 9.6741C12.8947 9.48656 13 9.23221 13 8.96699C12.9317 7.70171 13.3664 6.46072 14.2094 5.51469C15.0524 4.56866 16.2353 3.99434 17.5 3.91699C18.7648 3.99434 19.9477 4.56866 20.7907 5.51469C21.6337 6.46072 22.0684 7.70171 22 8.96699C22 11.87 19.053 16.006 13.915 20.313V20.317Z" fill="currentColor"/>
                    </g>
                    <defs>
                      <clipPath id="clip0_488_3434">
                        <rect width="24" height="24" fill="white"/>
                      </clipPath>
                    </defs>
                  </svg>
                </span>
              </button>
            </div>
          </div>

          <!-- Detail Body Content -->
          <div class="wk-detail-body" id="wkDetailBody">
            <!-- Dynamically populated -->
          </div>

          <!-- Bottom Action Bars -->
          <!-- Normal Mode Actions -->
          <div class="wk-detail-actions-normal" id="wkDetailActionsNormal">
            <button class="wk-start-btn" id="wkDetailStart" onclick="startWorkout()">
              <img src="../../assets/svg_icons/play.svg" class="icon" width="18" alt=""> Start
            </button>
            <button class="wk-action-icon-settings" id="wkDetailSettings" onclick="openWorkoutSettings()"
              aria-label="Settings">
              <img src="../../assets/svg_icons/settings.svg" class="icon" width="24" height="24" alt="">
            </button>
          </div>

          <!-- Customize Mode Actions -->
          <div class="wk-detail-actions-customize" id="wkDetailActionsCustomize">
            <button class="wk-sheet-action-btn" id="wkDetailSave" onclick="saveCustomizedWorkout()">
              <img src="../../assets/svg_icons/play.svg" class="icon" width="18" alt=""> Save Changes
            </button>
            <button class="wk-action-icon-cancel" id="wkDetailCancelCustomize" onclick="exitCustomizeMode(false)"
              aria-label="Cancel">
              <img src="../../assets/svg_icons/cross-x.svg" class="icon" width="20" height="20" alt="">
            </button>
          </div>

          <!-- ===== ADD EXERCISE BOTTOM SHEET ===== -->
          <div class="wk-bottom-sheet-backdrop" id="addSheetBackdrop" onclick="closeAddExerciseSheet()"></div>
          <div class="wk-bottom-sheet" id="addExerciseSheet">
            <div class="wk-sheet-handle"></div>
            <div class="wk-sheet-header">
              <h2 class="wk-sheet-title">Add Exercise</h2>
              <button class="wk-sheet-close" onclick="closeAddExerciseSheet()">
                <img src="../../assets/svg_icons/cross-x.svg" alt="Close">
              </button>
            </div>

            <!-- Search bar -->
            <div class="wk-sheet-search-wrap">
              <img src="../../assets/svg_icons/search.svg" class="wk-sheet-search-icon-img" alt="Search">
              <input type="text" class="wk-sheet-search-input" placeholder="Search workouts..." id="addSheetSearch"
                oninput="handleAddSheetSearch(this.value)">
              <button class="wk-sheet-search-clear" id="addSheetSearchClear" onclick="clearAddSheetSearch()"
                style="display:none">
                <img src="../../assets/svg_icons/cross-x.svg" alt="Clear">
              </button>
            </div>

            <!-- Filters (matching workout-library) -->
            <div class="wk-filter-row" id="addSheetFilters">
              <button class="wk-filter-trigger" id="addSheetMuscleChip" type="button" onclick="openAddSheetFilterSheet('muscle')" aria-haspopup="dialog" aria-expanded="false">
                <span class="icon wk-default-icon" style="--icon-url: url('../../assets/svg_icons/muscle.svg'); width: 16px; height: 16px;"></span>
                <span class="wk-filter-trigger-text" id="addSheetFilterValue-muscle">Muscle</span>
                <span class="icon wk-default-icon wk-filter-chevron" style="--icon-url: url('../../assets/svg_icons/down.svg'); width: 16px; height: 16px;"></span>
              </button>
              <button class="wk-filter-trigger" id="addSheetLevelChip" type="button" onclick="openAddSheetFilterSheet('level')" aria-haspopup="dialog" aria-expanded="false">
                <span class="wk-filter-trigger-text" id="addSheetFilterValue-level">Level</span>
                <span class="icon wk-default-icon wk-filter-chevron" style="--icon-url: url('../../assets/svg_icons/down.svg'); width: 16px; height: 16px;"></span>
              </button>
              <button class="wk-filter-trigger" id="addSheetLocationChip" type="button" onclick="openAddSheetFilterSheet('location')" aria-haspopup="dialog" aria-expanded="false">
                <span class="wk-filter-trigger-text" id="addSheetFilterValue-location">Location</span>
                <span class="icon wk-default-icon wk-filter-chevron" style="--icon-url: url('../../assets/svg_icons/down.svg'); width: 16px; height: 16px;"></span>
              </button>
            </div>

            <!-- Applied Filters (matching workout-library) -->
            <div class="wk-library-applied-filters" id="addSheetAppliedFilters" hidden>
              <div class="wk-library-applied-list" id="addSheetAppliedFilterList"></div>
              <button class="wk-library-clear-all" type="button" id="addSheetClearAll" onclick="resetAddSheetFilters()">Clear All</button>
            </div>

            <!-- Exercise List -->
            <div class="wk-sheet-list" id="addSheetList">
              <!-- Dynamically populated -->
            </div>

            <!-- Stacking Filter Bottom Sheet (matching workout-library) -->
            <div class="wk-filter-sheet-backdrop" id="addSheetFilterBackdrop" onclick="closeAddSheetFilterSheet()"></div>
            <section class="wk-filter-sheet" id="addSheetFilterSheet" aria-hidden="true">
              <div class="wk-filter-sheet-handle" aria-hidden="true"></div>
              <div class="wk-filter-sheet-content" id="addSheetFilterSheetContent"></div>
            </section>

            <!-- Footer Action Button -->
            <div class="wk-sheet-footer">
              <button class="wk-sheet-action-btn" id="addSheetApplyBtn" onclick="applyAddExercises()" disabled>
                Add Selected (0)
              </button>
            </div>
          </div>

          <!-- ===== EDIT EXERCISE BOTTOM SHEET ===== -->
          <div class="wk-bottom-sheet-backdrop" id="editSheetBackdrop" onclick="closeEditExerciseSheet()"></div>
          <div class="wk-bottom-sheet" id="editExerciseSheet">
            <div class="wk-sheet-handle"></div>
            <div class="wk-sheet-header">
              <h2 class="wk-sheet-title">Edit Exercise</h2>
              <button class="wk-sheet-close" onclick="closeEditExerciseSheet()">
                <img src="../../assets/svg_icons/cross-x.svg" alt="Close">
              </button>
            </div>

            <!-- Exercise Info Summary -->
            <div class="wk-edit-ex-info-row">
              <div class="wk-sheet-item-img" id="editSheetExImg">
                <!-- img tag -->
              </div>
              <div class="wk-sheet-item-text">
                <div class="wk-sheet-item-name" id="editSheetExName">Barbell Bench</div>
                <div class="wk-sheet-item-details" id="editSheetExParams">4 sets · 8 reps</div>
              </div>
            </div>

            <!-- Stepper Container -->
            <div class="wk-edit-stepper-container">
              <div class="wk-edit-badge-row">
                <h3>Total Sets and Reps</h3>
                <span class="wk-edit-badge">
                  <img src="../../assets/svg_icons/dumbbell-ray.svg" alt="">
                  <span id="editSheetTotalSummaryBadge">4 Sets 8 Reps</span>
                </span>
              </div>

              <!-- Sets Stepper -->
              <div class="wk-edit-stepper-row">
                <span class="wk-edit-stepper-title">Sets</span>
                <div class="wk-edit-stepper-ctrl">
                  <button class="wk-edit-stepper-btn" onclick="adjustEditStepper('sets', -1)">
                    <img src="../../assets/svg_icons/minus.svg" alt="-">
                  </button>
                  <span class="wk-edit-stepper-val" id="editSheetSetsVal">4</span>
                  <button class="wk-edit-stepper-btn" onclick="adjustEditStepper('sets', 1)">
                    <img src="../../assets/svg_icons/plus.svg" alt="+">
                  </button>
                </div>
              </div>

              <!-- Reps Stepper -->
              <div class="wk-edit-stepper-row">
                <span class="wk-edit-stepper-title" id="editSheetRepsTitle">Reps</span>
                <div class="wk-edit-stepper-ctrl">
                  <button class="wk-edit-stepper-btn" onclick="adjustEditStepper('reps', -1)">
                    <img src="../../assets/svg_icons/minus.svg" alt="-">
                  </button>
                  <span class="wk-edit-stepper-val" id="editSheetRepsVal">8</span>
                  <button class="wk-edit-stepper-btn" onclick="adjustEditStepper('reps', 1)">
                    <img src="../../assets/svg_icons/plus.svg" alt="+">
                  </button>
                </div>
              </div>

              <!-- Rest Time Stepper -->
              <div class="wk-edit-stepper-row">
                <span class="wk-edit-stepper-title">Rest Time</span>
                <div class="wk-edit-stepper-ctrl">
                  <button class="wk-edit-stepper-btn" onclick="adjustEditStepper('rest', -15)">
                    <img src="../../assets/svg_icons/minus.svg" alt="-">
                  </button>
                  <span class="wk-edit-stepper-val" id="editSheetRestVal">60 sec</span>
                  <button class="wk-edit-stepper-btn" onclick="adjustEditStepper('rest', 15)">
                    <img src="../../assets/svg_icons/plus.svg" alt="+">
                  </button>
                </div>
              </div>
            </div>

            <!-- Footer Action Button -->
            <div class="wk-sheet-footer">
              <button class="wk-sheet-action-btn" id="editSheetSaveBtn" onclick="saveEditExercise()" disabled>
                Save
              </button>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="../../app.js?v=15"></script>
  <script>
    (function () {
      // ── Local working variables ──
      var activeWorkout = null;
      var currentExercises = [];
      var isCustomizeMode = false;
      var dragSrcEl = null;

      // ── Add Sheet variables ──
      var addSheetSelected = []; // array of exercise objects
      var addSheetSearchVal = '';
      var addSheetActiveLevel = 'all';
      var addSheetActiveLocation = 'all';
      var addSheetActiveMuscle = 'all';
      var addSheetActiveFilterSheet = null; // tracks which filter sheet is open
      var addSheetFilterDraft = {
        muscle: 'all',
        level: 'all',
        location: 'all'
      };
      var addSheetFilterSheetParent = null;

      var addSheetFilterDefinitions = {
        muscle: {
          label: 'Muscle',
          title: 'Muscle Group',
          options: [
            { value: 'all', label: 'All Muscle Groups' },
            { value: 'chest', label: 'Chest', image: '../../assets/img/anatomical-muscles/anatomical-chest.png' },
            { value: 'shoulders', label: 'Shoulders', image: '../../assets/img/anatomical-muscles/anatomical-shoulders.png' },
            { value: 'back', label: 'Back', image: '../../assets/img/anatomical-muscles/anatomical-upper-back.png' },
            { value: 'core', label: 'Core', image: '../../assets/img/anatomical-muscles/anatomical-lower-back.png' },
            { value: 'legs', label: 'Legs', image: '../../assets/img/anatomical-muscles/anatomical-upper-back.png' },
            { value: 'arms', label: 'Arms', image: '../../assets/img/anatomical-muscles/anatomical-bicep.png' }
          ]
        },
        level: {
          label: 'Level',
          title: 'Level',
          options: [
            { value: 'all', label: 'All Levels', icon: '../../assets/svg_icons/sparkles.svg', iconColor: 'var(--color-default)' },
            { value: 'beginner', label: 'Beginner', icon: '../../assets/svg_icons/meditation.svg', iconColor: 'var(--color-toq)' },
            { value: 'intermediate', label: 'Intermediate', icon: '../../assets/svg_icons/user.svg', iconColor: 'var(--color-primary)' },
            { value: 'advanced', label: 'Advanced', icon: '../../assets/svg_icons/dumbbell-ray.svg', iconColor: 'var(--color-secondary)' }
          ]
        },
        location: {
          label: 'Location',
          title: 'Location',
          options: [
            { value: 'all', label: 'All Locations', icon: '../../assets/svg_icons/location.svg', iconColor: 'var(--color-default)' },
            { value: 'home', label: 'Home', icon: '../../assets/svg_icons/house.svg', iconColor: 'var(--color-primary)' },
            { value: 'gym', label: 'Gym', icon: '../../assets/svg_icons/gym.svg', iconColor: 'var(--color-tertiary)' }
          ]
        }
      };

      // ── Edit Sheet variables ──
      var editActiveIndex = -1;
      var editCurrentState = { sets: 3, reps: 10, rest: 60 };
      var editOriginalState = { sets: 3, reps: 10, rest: 60 };

      // Helper: get exercise image
      function getExerciseImage(ex) {
        var name = String(ex.name || '').toLowerCase();
        if (name.indexOf('bench') >= 0) return '../../assets/img/workouts/barbell_bench.png';
        if (name.indexOf('row') >= 0) return '../../assets/img/workouts/barbel_row.png';
        if (name.indexOf('overhead') >= 0 || name.indexOf('ohp') >= 0 || name.indexOf('press') >= 0) return '../../assets/img/workouts/overhead_press.png';
        if (name.indexOf('pull') >= 0) return '../../assets/img/workouts/Pull-Ups.png';
        if (name.indexOf('curl') >= 0) return '../../assets/img/workouts/barbell_curl.png';
        if (name.indexOf('squat') >= 0) return '../../assets/img/workouts/barber_squat.png';
        if (name.indexOf('plank') >= 0) return '../../assets/img/workouts/plank.png';
        if (name.indexOf('hiit') >= 0 || name.indexOf('cardio') >= 0) return '../../assets/img/workouts/Cardio.png';
        return '../../assets/img/workouts/strength_building.png';
      }

      function getSavedWorkout() {
        try {
          var rawState = localStorage.getItem('strivio_state');
          var savedState = rawState ? JSON.parse(rawState) : null;
          if (savedState && savedState.currentWorkout) {
            return savedState.currentWorkout;
          }
        } catch (error) { }

        // Fallback w1 Upper Body Strength
        return {
          id: 'w1',
          name: 'Upper Body Strength',
          muscle: 'chest',
          muscles: ['Chest', 'Shoulders', 'Upper Back'],
          duration: 45,
          difficulty: 'intermediate',
          equipment: ['Barbell', 'Dumbbells', 'Pull-up Bar'],
          calories: 280,
          desc: 'Build overall upper body strength with compound movements.',
          exercises: ['e1', 'e4', 'e3', 'e2', 'e20', 'e7']
        };
      }

      function getWorkoutExerciseList(workout) {
        var items = workout.exercises || [];
        return items.map(function (item, index) {
          if (item && typeof item === 'object') {
            return {
              id: item.id || 'fallback-' + index,
              name: item.name || 'Exercise',
              sets: item.sets || 3,
              reps: String(item.reps || '10'),
              equipment: item.equipment || 'Bodyweight',
              rest: item.rest || 60,
              difficulty: item.difficulty || 'intermediate',
              muscle: item.muscle || 'general',
              muscles: item.muscles || []
            };
          }
          // String ID
          if (typeof window.getEx === 'function') {
            var libEx = window.getEx(item);
            if (libEx) {
              return {
                id: libEx.id,
                name: libEx.name,
                sets: libEx.sets || 3,
                reps: String(libEx.reps || '10'),
                equipment: libEx.equipment || 'Bodyweight',
                rest: libEx.rest || 60,
                difficulty: libEx.difficulty || 'intermediate',
                muscle: libEx.muscle || 'general',
                muscles: libEx.muscles || []
              };
            }
          }
          return {
            id: String(item),
            name: 'Exercise ' + (index + 1),
            sets: 3,
            reps: '10',
            equipment: 'Bodyweight',
            rest: 60
          };
        });
      }

      function escapeText(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Render the workout detail content dynamically
      function renderDetail() {
        var body = document.getElementById('wkDetailBody');
        if (!body) return;

        var w = activeWorkout;
        var difficultyLabel = String(w.difficulty || 'intermediate');
        difficultyLabel = difficultyLabel.charAt(0).toUpperCase() + difficultyLabel.slice(1);

        // Favorite icon toggle state
        var favWrapper = document.getElementById('wkDetailFavIconWrapper');
        if (favWrapper) {
          if (w.favorite) {
            favWrapper.classList.add('is-favorite');
          } else {
            favWrapper.classList.remove('is-favorite');
          }
        }

        // Conflict icon alert state
        var alertWrapper = document.querySelector('#wkDetailConflictBtn .wk-icon-alert');
        if (alertWrapper) {
          if (w.conflict) {
            alertWrapper.classList.add('has-conflict');
          } else {
            alertWrapper.classList.remove('has-conflict');
          }
        }

        // Equipment list
        var eqList = Array.isArray(w.equipment) ? w.equipment.join(', ') : (w.equipment || 'Bodyweight');

        // Dynamic target area badges
        var badgeHtml = (w.muscles || ['Chest', 'Shoulders']).map(function (muscle) {
          var cleanName = muscle.toLowerCase().replace(/\s+/g, '-');
          var imgUrl = '../../assets/img/anatomical-muscles/anatomical-' + cleanName + '.png';
          // Check fallback for muscle names
          if (cleanName === 'upper-back' || cleanName === 'back') {

        document.getElementById('wkDetailActionsNormal').style.display = 'flex';

      function setupDragAndDrop() {
        var rows = document.querySelectorAll('#wkDetailExercisesListContainer .wk-detail-ex-row-customize');
        rows.forEach(function (row) {
          row.addEventListener('dragstart', handleDragStart, false);
          row.addEventListener('dragenter', handleDragEnter, false);
          row.addEventListener('dragover', handleDragOver, false);
          row.addEventListener('dragleave', handleDragLeave, false);
          row.addEventListener('drop', handleDrop, false);
          row.addEventListener('dragend', handleDragEnd, false);
        });
      }

      function handleDragStart(e) {
        dragSrcEl = this;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', this.dataset.index);
        this.classList.add('is-dragging');
      }

      function handleDragOver(e) {
        if (e.preventDefault) {
          e.preventDefault();
        }
        e.dataTransfer.dropEffect = 'move';
        return false;
      }

      function handleDragEnter(e) {
        this.classList.add('drag-over');
      }

      function handleDragLeave(e) {
        this.classList.remove('drag-over');
      }

      function handleDrop(e) {
        if (e.stopPropagation) {
          e.stopPropagation();
        }

        this.classList.remove('drag-over');

        var sourceIndex = parseInt(e.dataTransfer.getData('text/plain'), 10);
        var targetIndex = parseInt(this.dataset.index, 10);

        if (sourceIndex !== targetIndex) {
          // Reorder array
          var movedItem = currentExercises.splice(sourceIndex, 1)[0];
          currentExercises.splice(targetIndex, 0, movedItem);
          renderDetail();
          updateSaveBtnDisabledState();
        }
        return false;
      }

      function handleDragEnd(e) {
        this.classList.remove('is-dragging');
        var rows = document.querySelectorAll('#wkDetailExercisesListContainer .wk-detail-ex-row-customize');
        rows.forEach(function (row) {
          row.classList.remove('drag-over');
        });
      }

      // ── Save Changes to LocalStorage ──
      window.saveCustomizedWorkout = function saveCustomizedWorkout() {
        activeWorkout.exercises = currentExercises.map(function (ex) {
          return {
            id: ex.id,
            name: ex.name,
            sets: ex.sets,
            reps: ex.reps,
            equipment: ex.equipment,
            rest: ex.rest,
            difficulty: ex.difficulty,
            muscle: ex.muscle,
            muscles: ex.muscles
          };
        });

        // Save back to global state
        if (typeof state !== 'undefined') {
          state.currentWorkout = activeWorkout;

          // Also update in customWorkouts list if exists there
          if (Array.isArray(state.customWorkouts)) {
            var idx = state.customWorkouts.findIndex(function (cw) { return cw.id === activeWorkout.id; });
            if (idx >= 0) {
              state.customWorkouts[idx] = activeWorkout;
            }
          }

          try {
            localStorage.setItem('strivio_state', JSON.stringify(state));
          } catch (e) { }
        }

        exitCustomizeMode(true);
        showToast("Workout customized successfully!");
      };

      function updateSaveBtnDisabledState() {
        // Workout detail save changes button behaviour:
        // Mockup dictates "by default botton akan ke disabled, jika ada ubahan baru botton akan enabled."
        var saveBtn = document.getElementById('wkDetailSave');
        if (!saveBtn) return;

        var originalExs = getWorkoutExerciseList(activeWorkout);
        var isChanged = false;

        if (currentExercises.length !== originalExs.length) {
          isChanged = true;
        } else {
          for (var i = 0; i < currentExercises.length; i++) {
            if (currentExercises[i].id !== originalExs[i].id ||
              currentExercises[i].sets !== originalExs[i].sets ||
              currentExercises[i].reps !== originalExs[i].reps ||
              currentExercises[i].rest !== originalExs[i].rest) {
              isChanged = true;
              break;
            }
          }
        }

        if (isChanged) {
          saveBtn.disabled = false;
          saveBtn.style.opacity = '1';
        } else {
          saveBtn.disabled = true;
          saveBtn.style.opacity = '0.5';
        }
      }

        toast.style.transform = 'translateX(-50%)';
        toast.style.background = '#0f172a';
        toast.style.color = '#fff';
        toast.style.padding = '10px 20px';
        toast.style.borderRadius = '9999px';
        toast.style.fontSize = '12px';
        toast.style.fontFamily = '\'Nunito\', sans-serif';
        toast.style.fontWeight = '700';
        toast.style.zIndex = '10000';
        toast.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
        toast.textContent = msg;

        var screen = document.querySelector('.screen-workout-detail');
        if (screen) {
          screen.appendChild(toast);
          setTimeout(function () {
            toast.style.transition = 'opacity 0.5s ease';
            toast.style.opacity = '0';
            setTimeout(function () { toast.remove(); }, 500);
          }, 2000);
        }

      function renderAddSheetAppliedFilters() {
        var row = document.getElementById('addSheetAppliedFilters');

        var activeFilters = [];
        if (addSheetActiveMuscle !== 'all') {

          activeFilters.push({ type: 'muscle', label: opt ? opt.label : addSheetActiveMuscle });

        if (addSheetActiveLevel !== 'all') {
          var opt = addSheetFilterDefinitions.level.options.find(function(o) { return o.value === addSheetActiveLevel; });
          activeFilters.push({ type: 'level', label: opt ? opt.label : addSheetActiveLevel });
        }
        if (addSheetActiveLocation !== 'all') {
          var opt = addSheetFilterDefinitions.location.options.find(function(o) { return o.value === addSheetActiveLocation; });
          activeFilters.push({ type: 'location', label: opt ? opt.label : addSheetActiveLocation });

        list.innerHTML = activeFilters.map(function(item) {

            '<span>' + escapeText(item.label) + '</span>' +
            '<span class="wk-filter-pill-remove" aria-hidden="true">&times;</span>' +
          '</button>';

        var hasAnyFilters = activeFilters.length > 0;

        row.classList.toggle('is-empty', activeFilters.length === 0);
      }

      window.removeAddSheetFilterPill = function removeAddSheetFilterPill(type) {
        if (type === 'muscle') addSheetActiveMuscle = 'all';
        if (type === 'level') addSheetActiveLevel = 'all';
        if (type === 'location') addSheetActiveLocation = 'all';
        updateFilterChips();
        renderAddSheetList();
      };

      function updateFilterChips() {
        ['muscle', 'level', 'location'].forEach(function(filterType) {
          var valueEl = document.getElementById('addSheetFilterValue-' + filterType);
          var trigger = document.getElementById('addSheet' + capitalize(filterType) + 'Chip');
          var isValActive = (filterType === 'muscle' ? addSheetActiveMuscle : (filterType === 'level' ? addSheetActiveLevel : addSheetActiveLocation)) !== 'all';

          if (valueEl) {
            valueEl.textContent = isValActive
              ? getAddSheetFilterLabel(filterType, filterType === 'muscle' ? addSheetActiveMuscle : (filterType === 'level' ? addSheetActiveLevel : addSheetActiveLocation))
              : addSheetFilterDefinitions[filterType].label;
          }
          if (trigger) {
            trigger.classList.toggle('is-active', isValActive);
            trigger.setAttribute('aria-expanded', addSheetActiveFilterSheet === filterType ? 'true' : 'false');
          }
        });

        renderAddSheetAppliedFilters();
      }

      function getAddSheetFilterLabel(filterType, value) {
        var config = addSheetFilterDefinitions[filterType];
        if (!config) return 'All';
        var match = config.options.find(function(option) { return option.value === value; });
        return match ? match.label : config.options[0].label;
      }

      function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      // Populate exercises list inside bottom sheet
      function renderAddSheetList() {
        var container = document.getElementById('addSheetList');
        if (!container || typeof exerciseLibrary === 'undefined') return;

        // Filter list
        var list = exerciseLibrary.filter(function (ex) {
          // Search
          if (addSheetSearchVal) {
            var q = addSheetSearchVal.toLowerCase();
            var matchedSearch = ex.name.toLowerCase().indexOf(q) >= 0 ||
              (ex.equipment && ex.equipment.toLowerCase().indexOf(q) >= 0) ||
              (ex.muscle && ex.muscle.toLowerCase().indexOf(q) >= 0);
            if (!matchedSearch) return false;
          }
          // Level
          if (addSheetActiveLevel !== 'all' && ex.difficulty !== addSheetActiveLevel) return false;
          // Location (mapping equipment to location category)
          if (addSheetActiveLocation !== 'all') {
            var isHome = addSheetActiveLocation === 'home';
            var isGym = addSheetActiveLocation === 'gym';
            var eq = String(ex.equipment || '').toLowerCase();
            if (isHome && eq.indexOf('machine') >= 0) return false;
            if (isGym && eq.indexOf('bodyweight') >= 0 && eq.indexOf('barbell') === -1) return false;
          }
          // Muscle (Advanced filter)
          if (addSheetActiveMuscle !== 'all') {
            if (ex.muscle !== addSheetActiveMuscle && (ex.muscles || []).map(function (m) { return m.toLowerCase(); }).indexOf(addSheetActiveMuscle) === -1) {
              return false;
            }
          }
          return true;
        });

        if (!list.length) {
          container.innerHTML = '<div class="wk-sheet-empty-msg">No exercises found match these filters.</div>';
          return;
        }

        container.innerHTML = list.map(function (ex) {
          // Check if already selected or already in workout
          var isDraftSelected = addSheetSelected.some(function (item) { return item.id === ex.id; });
          var isAlreadyInWorkout = currentExercises.some(function (item) { return item.id === ex.id; });

          var isSelectedState = isDraftSelected || isAlreadyInWorkout;
          var iconUrl = isSelectedState ? '../../assets/svg_icons/minus.svg' : '../../assets/svg_icons/plus.svg';
          var filterStyle = isSelectedState ? '' : 'filter: invert(36%) sepia(85%) saturate(2283%) hue-rotate(205deg) brightness(91%) contrast(101%);';
          var toggleClass = isSelectedState ? ' wk-sheet-item-toggle is-selected' : ' wk-sheet-item-toggle';

          return '<div class="wk-sheet-item">' +
            '<div class="wk-sheet-item-left">' +
            '<div class="wk-sheet-item-img">' +
            '<img src="' + getExerciseImage(ex) + '" alt="">' +
            '</div>' +
            '<div class="wk-sheet-item-text">' +
            '<div class="wk-sheet-item-name">' + escapeText(ex.name) + '</div>' +
            '<div class="wk-sheet-item-details">' + escapeText(ex.sets || 3) + ' sets · ' + escapeText(ex.reps || '10') + ' reps · ' + escapeText(ex.equipment || 'Bodyweight') + '</div>' +
            '</div>' +
            '</div>' +
            '<button class="' + toggleClass + '" onclick="toggleAddSheetExercise(' + JSON.stringify(ex).replace(/"/g, '&quot;') + ')">' +
            '<img src="' + iconUrl + '" alt="" style="' + filterStyle + '">' +
            '</button>' +
            '</div>';
        }).join('');
      }

      window.toggleAddSheetExercise = function toggleAddSheetExercise(ex) {
        // Find if in selected draft
        var idx = addSheetSelected.findIndex(function (item) { return item.id === ex.id; });
        var isAlreadyInWorkout = currentExercises.some(function (item) { return item.id === ex.id; });

        if (isAlreadyInWorkout) {
          // If already in workout, clicking minus deletes it directly from currentExercises
          var workIdx = currentExercises.findIndex(function (item) { return item.id === ex.id; });
          if (workIdx >= 0) {
            currentExercises.splice(workIdx, 1);
            showToast("Removed " + ex.name);
          }
        } else {
          if (idx >= 0) {
            addSheetSelected.splice(idx, 1);
          } else {
            addSheetSelected.push({
              id: ex.id,
              name: ex.name,
              sets: ex.sets || 3,
              reps: String(ex.reps || '10'),
              equipment: ex.equipment || 'Bodyweight',
              rest: ex.rest || 60,
              difficulty: ex.difficulty || 'intermediate',
              muscle: ex.muscle || 'general',
              muscles: ex.muscles || []
            });
          }
        }

        renderAddSheetList();
        updateAddSheetApplyButton();
        renderDetail(); // Keep main page detail updated
      };

      function updateAddSheetApplyButton() {
        var btn = document.getElementById('addSheetApplyBtn');
        if (!btn) return;
        var count = addSheetSelected.length;
        btn.textContent = 'Add Selected (' + count + ')';

        if (count > 0) {
          btn.disabled = false;
          btn.style.opacity = '1';
        } else {
          btn.disabled = true;
          btn.style.opacity = '0.5';
        }
      }

      window.applyAddExercises = function applyAddExercises() {
        if (!addSheetSelected.length) return;

        // Append selections
        currentExercises = currentExercises.concat(addSheetSelected);
        renderDetail();
        closeAddExerciseSheet();
        updateSaveBtnDisabledState();
        showToast("Added " + addSheetSelected.length + " exercise(s) to workout");
      };

      // ── EDIT EXERCISE BOTTOM SHEET LOGIC ──
      window.openEditExerciseSheet = function openEditExerciseSheet(index) {
        editActiveIndex = index;
        var ex = currentExercises[index];
        if (!ex) return;

        // Setup image & text
        document.getElementById('editSheetExImg').innerHTML = '<img src="' + getExerciseImage(ex) + '">';
        document.getElementById('editSheetExName').textContent = ex.name;

        var formattedReps = String(ex.reps).indexOf('sec') >= 0 || String(ex.reps).indexOf('s') >= 0 ? ex.reps : ex.reps + ' reps';
        document.getElementById('editSheetExParams').textContent = ex.sets + ' sets · ' + formattedReps;

        // Parse reps number
        var parsedReps = parseInt(ex.reps, 10);
        if (isNaN(parsedReps)) parsedReps = 10;

        var isSeconds = String(ex.reps).indexOf('sec') >= 0 || String(ex.reps).indexOf('s') >= 0;
        document.getElementById('editSheetRepsTitle').textContent = isSeconds ? 'Seconds' : 'Reps';

        // Load state
        editCurrentState.sets = parseInt(ex.sets, 10) || 3;
        editCurrentState.reps = parsedReps;
        editCurrentState.rest = parseInt(ex.rest, 10) || 60;
        editCurrentState.isSeconds = isSeconds;

        // Store original state to detect modification
        editOriginalState.sets = editCurrentState.sets;
        editOriginalState.reps = editCurrentState.reps;
        editOriginalState.rest = editCurrentState.rest;
        editOriginalState.isSeconds = isSeconds;

        renderEditSheetSteppers();

        document.getElementById('editSheetBackdrop').classList.add('is-visible');
        document.getElementById('editExerciseSheet').classList.add('is-open');
      };

      window.closeEditExerciseSheet = function closeEditExerciseSheet() {
        document.getElementById('editSheetBackdrop').classList.remove('is-visible');
        document.getElementById('editExerciseSheet').classList.remove('is-open');
        editActiveIndex = -1;
      };

      function renderEditSheetSteppers() {
        document.getElementById('editSheetSetsVal').textContent = editCurrentState.sets;

        var repsLabel = editCurrentState.isSeconds ? editCurrentState.reps + 's' : editCurrentState.reps;
        document.getElementById('editSheetRepsVal').textContent = repsLabel;

        document.getElementById('editSheetRestVal').textContent = editCurrentState.rest + ' sec';

        // Badge pill
        var textBadge = editCurrentState.sets + ' Sets ' + (editCurrentState.isSeconds ? editCurrentState.reps + ' Secs' : editCurrentState.reps + ' Reps');
        document.getElementById('editSheetTotalSummaryBadge').textContent = textBadge;

        // Disable/enable Save button
        var saveBtn = document.getElementById('editSheetSaveBtn');
        var isModified = editCurrentState.sets !== editOriginalState.sets ||
          editCurrentState.reps !== editOriginalState.reps ||
          editCurrentState.rest !== editOriginalState.rest;

        if (isModified) {
          saveBtn.disabled = false;
          saveBtn.style.opacity = '1';
        } else {
          saveBtn.disabled = true;
          saveBtn.style.opacity = '0.5';
        }
      }

      window.adjustEditStepper = function adjustEditStepper(type, delta) {
        if (type === 'sets') {
          editCurrentState.sets = Math.max(1, Math.min(10, editCurrentState.sets + delta));
        } else if (type === 'reps') {
          var step = editCurrentState.isSeconds ? 5 : 1;
          editCurrentState.reps = Math.max(1, Math.min(120, editCurrentState.reps + (delta * step)));
        } else if (type === 'rest') {
          editCurrentState.rest = Math.max(0, Math.min(600, editCurrentState.rest + delta));
        }
        renderEditSheetSteppers();
      };

      window.saveEditExercise = function saveEditExercise() {
        if (editActiveIndex < 0) return;
        var ex = currentExercises[editActiveIndex];
        if (!ex) return;

        ex.sets = editCurrentState.sets;
        var repSuffix = editCurrentState.isSeconds ? ' sec' : '';
        ex.reps = String(editCurrentState.reps) + repSuffix;
        ex.rest = editCurrentState.rest;

        renderDetail();
        closeEditExerciseSheet();
        updateSaveBtnDisabledState();
        showToast("Exercise sets/reps updated");
      };

      // ── Custom Page Loader Hook ──
      window.initWorkoutDetailCustom = function initWorkoutDetailCustom() {
        activeWorkout = getSavedWorkout();
        currentExercises = getWorkoutExerciseList(activeWorkout);
        isCustomizeMode = false;

        // Show conflict icon and make it always visible
        var conflictBtn = document.getElementById('wkDetailConflictBtn');
        if (conflictBtn) {
          conflictBtn.hidden = false;
        }

        renderDetail();

        // Initial setup for customize buttons display
        document.getElementById('wkDetailActionsNormal').style.display = 'flex';
        document.getElementById('wkDetailActionsCustomize').style.display = 'none';

        // Override global initWorkoutDetail in app.js
        window.initWorkoutDetail = function () {
          activeWorkout = getSavedWorkout();
          currentExercises = getWorkoutExerciseList(activeWorkout);
          renderDetail();
        };
      };

      // Bind window load
      window.addEventListener('load', function () {
        setTimeout(function () {
          window.initWorkoutDetailCustom();
        }, 100);
      });
    })();
  </script>
</body>
