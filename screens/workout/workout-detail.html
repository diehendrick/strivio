<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- ===== WORKOUT TAB: Workout Detail ===== -->
        <div class="screen screen-workout-detail active" data-screen="workout-detail" style="padding:0!important;overflow:hidden;display:flex;flex-direction:column">
          <div class="wk-nav-header">
            <button class="wk-back-btn" onclick="goBack()"><img src="../../assets/svg_icons/back.svg" class="icon" width="22" alt=""></button>
            <span class="wk-nav-title">Workout Details</span>
            <button class="wk-action-icon" id="wkDetailFav" onclick="toggleFavorite()"><iconify-icon icon="solar:heart-bold-duotone" width="22"></iconify-icon></button>
          </div>
          <div class="wk-detail-body" id="wkDetailBody">
            <!-- Dynamically rendered -->
          </div>
          <div class="wk-detail-actions" id="wkDetailActions">
            <button class="wk-start-btn" id="wkDetailStart" onclick="navigateTo('workout-countdown')"><img src="../../assets/svg_icons/play.svg" class="icon" width="18" alt=""> Start</button>
            <button class="wk-action-secondary" id="wkDetailEdit" onclick="navigateTo('workout-edit')">Edit</button>
            <button class="wk-action-icon" id="wkDetailShare" onclick="shareWorkout()"><img src="../../assets/svg_icons/foward.svg" class="icon" width="22" alt=""></button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>
</html>
