<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=5">
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- ===== WORKOUT TAB: Workout Detail ===== -->
        <div class="screen screen-workout-detail screen-workout-detail-figma active" data-screen="workout-detail" style="padding:0!important;overflow:hidden;display:flex;flex-direction:column">
          <div class="status-bar">
            <span class="status-time">9:41</span>
            <div class="status-icons">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="10" width="3" height="5" rx="0.5" fill="#0f172a" />
                <rect x="6" y="7" width="3" height="8" rx="0.5" fill="#0f172a" />
                <rect x="11" y="3" width="3" height="12" rx="0.5" fill="#0f172a" />
              </svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 3c-1.66 0-3.08.69-4.12 1.78l.7.72A4.97 4.97 0 018 4c1.38 0 2.63.56 3.54 1.46l.7-.71A5.97 5.97 0 008 3z" fill="#0f172a" />
                <path d="M10.83 7.17A3.98 3.98 0 008 6c-1.1 0-2.08.45-2.83 1.17l.71.71A2.99 2.99 0 018 7c.83 0 1.58.34 2.12.88l.71-.71z" fill="#0f172a" />
                <circle cx="8" cy="11" r="2" fill="#0f172a" />
              </svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="5" width="2" height="6" rx="0.5" fill="#0f172a" />
                <rect x="5" y="3" width="2" height="8" rx="0.5" fill="#0f172a" />
                <rect x="9" y="1" width="2" height="10" rx="0.5" fill="#0f172a" />
                <rect x="13" y="6" width="1.5" height="4" rx="0.5" fill="#0f172a" />
              </svg>
            </div>
          </div>

          <div class="wk-nav-header">
            <button class="wk-back-btn" onclick="goBack()" aria-label="Back"><img src="../../assets/svg_icons/back.svg" class="icon" width="22" alt=""></button>
            <span class="wk-nav-title">Workout Details</span>
          </div>

          <div class="wk-detail-body" id="wkDetailBody">
            <!-- Dynamically rendered -->
          </div>

          <div class="wk-detail-actions" id="wkDetailActions">
            <button class="wk-start-btn" id="wkDetailStart" onclick="navigateTo('workout-countdown')">
              <img src="../../assets/svg_icons/play.svg" class="icon" width="18" alt=""> Start
            </button>
            <button class="wk-action-icon wk-action-icon-edit" id="wkDetailEdit" onclick="navigateTo('workout-edit')" aria-label="Edit">
              <img src="../../assets/svg_icons/file-edit.svg" class="icon" width="24" height="24" alt="">
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=5"></script>
  <script>
    (function () {
      var fallbackWorkout = {
        id: 'w1',
        name: 'Upper Body Strength',
        duration: 45,
        difficulty: 'Intermediate',
        image: '../../assets/img/woman-upper-body.png',
        exercises: [
          { id: 'e1', name: 'Bench Press', sets: 4, reps: '8-10' },
          { id: 'e8', name: 'Incline Dumbbell Press', sets: 3, reps: '10-12' },
          { id: 'e12', name: 'Dumbbell Fly', sets: 3, reps: '12-15' },
          { id: 'e3', name: 'Overhead Press', sets: 4, reps: '8-10' },
          { id: 'e7', name: 'Tricep Pushdown', sets: 3, reps: '12-15' }
        ]
      };

      function escapeText(value) {
        return String(value || '').replace(/[&<>"']/g, function (match) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
          }[match];
        });
      }

      function getSavedWorkout() {
        try {
          var rawState = localStorage.getItem('strivio_state');
          var savedState = rawState ? JSON.parse(rawState) : null;
          if (savedState && savedState.currentWorkout) {
            return savedState.currentWorkout;
          }
        } catch (error) {
          // Fall back to the default workout when storage is unavailable.
        }
        return fallbackWorkout;
      }

      function normalizeExercises(workout) {
        if (!workout || !Array.isArray(workout.exercises)) return fallbackWorkout.exercises;
        var exercises = workout.exercises.map(function (exercise, index) {
          if (exercise && typeof exercise === 'object') {
            return {
              id: exercise.id || 'fallback-' + index,
              name: exercise.name || 'Exercise',
              sets: exercise.sets || 3,
              reps: exercise.reps || '10'
            };
          }
          var fallback = fallbackWorkout.exercises[index % fallbackWorkout.exercises.length];
          return {
            id: String(exercise || fallback.id),
            name: fallback.name,
            sets: fallback.sets,
            reps: fallback.reps
          };
        }).filter(Boolean);
        return exercises.length ? exercises : fallbackWorkout.exercises;
      }

      function renderFallbackDetail() {
        var body = document.getElementById('wkDetailBody');
        if (!body) return;

        var workout = getSavedWorkout();
        var title = workout.name || fallbackWorkout.name;
        var duration = workout.duration || fallbackWorkout.duration;
        var difficulty = workout.difficulty || fallbackWorkout.difficulty;
        var difficultyLabel = String(difficulty).charAt(0).toUpperCase() + String(difficulty).slice(1);
        var image = workout.image || '../../assets/img/woman-upper-body.png';
        var exercises = normalizeExercises(workout);

        body.innerHTML =
          '<section class="wk-detail-hero-card">' +
            '<div class="wk-detail-hero-bg"></div>' +
            '<div class="wk-detail-hero-date"><img src="../../assets/svg_icons/calendar.svg" width="16" height="16" alt=""> Today, May 23</div>' +
            '<h2>' + escapeText(title) + '</h2>' +
            '<div class="wk-detail-hero-meta">' +
              '<span><img src="../../assets/svg_icons/clock-five.svg" width="16" height="16" alt=""> ' + escapeText(duration) + ' min</span>' +
              '<span><img src="../../assets/svg_icons/chart-simple.svg" width="16" height="16" alt=""> ' + escapeText(difficultyLabel) + '</span>' +
            '</div>' +
            '<div class="wk-detail-hero-image"><img src="' + escapeText(image) + '" alt=""></div>' +
          '</section>' +
          '<h3 class="wk-detail-exercises-title">Exercises</h3>' +
          '<section class="wk-detail-exercises-card">' +
            exercises.map(function (exercise, index) {
              return '<button class="wk-detail-ex-row" type="button" data-exercise-id="' + escapeText(exercise.id) + '">' +
                '<span class="wk-detail-ex-num">' + (index + 1) + '</span>' +
                '<span class="wk-detail-ex-info">' +
                  '<span class="wk-detail-ex-name">' + escapeText(exercise.name) + '</span>' +
                  '<span class="wk-detail-ex-params">' + escapeText(exercise.sets) + ' sets &middot; ' + escapeText(exercise.reps) + ' reps</span>' +
                '</span>' +
                '<span class="wk-detail-ex-arrow"><img src="../../assets/svg_icons/foward.svg" width="14" height="14" alt=""></span>' +
              '</button>';
            }).join('') +
          '</section>';

        body.querySelectorAll('.wk-detail-ex-row').forEach(function (row) {
          row.addEventListener('click', function () {
            if (typeof window.openExerciseDetail === 'function') {
              window.openExerciseDetail(row.dataset.exerciseId);
            }
          });
        });
      }

      window.addEventListener('load', function () {
        setTimeout(function () {
          var body = document.getElementById('wkDetailBody');
          if (!body || body.children.length) return;

          if (typeof window.initWorkoutDetail === 'function') {
            try {
              window.initWorkoutDetail();
            } catch (error) {
              body.innerHTML = '';
            }
          }

          if (!body.children.length) {
            renderFallbackDetail();
          }
        }, 80);
      });
    })();
  </script>
</body>
</html>
