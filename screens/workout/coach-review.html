<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Coach's Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="../../styles.css?v=5">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <div class="screen screen-coach-review active" data-screen="coach-review">
          <div class="cr-header">
            <button class="cr-back" onclick="goBack()">
              <img src="../../assets/svg_icons/back.svg" width="32" alt="">
            </button>
            <span class="cr-header-title">Builder Plan</span>
            <div class="cr-header-spacer"></div>
          </div>

          <div class="cr-scroll">
            <div class="cr-banner">
              <div class="cr-banner-icon">
                <img src="../../assets/svg_icons/life.svg" width="28" alt="">
              </div>
              <span>Your coach built this based on your preferences</span>
            </div>

            <div class="cr-card" id="wkCoachReviewBody">
              <!-- Dynamically rendered -->
            </div>
          </div>

          <div class="cr-actions">
            <button class="cr-btn-save" onclick="saveCoachWorkout()">
              <span>Save Library</span>
            </button>
            <button class="cr-btn-discard" onclick="navigateTo('workout')">Discard</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <script src="../../app.js?v=5"></script>
</body>
</html>
