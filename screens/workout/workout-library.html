<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=5">
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- ===== WORKOUT TAB: Workout Library ===== -->
        <div class="screen screen-workout-library screen-workout-library-figma active" data-screen="workout-library">
          <div class="status-bar">
            <span class="status-time">9:41</span>
            <div class="status-icons">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="10" width="3" height="5" rx="0.5" fill="#0f172a" />
                <rect x="6" y="7" width="3" height="8" rx="0.5" fill="#0f172a" />
                <rect x="11" y="3" width="3" height="12" rx="0.5" fill="#0f172a" />
              </svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 3c-1.66 0-3.08.69-4.12 1.78l.7.72A4.97 4.97 0 018 4c1.38 0 2.63.56 3.54 1.46l.7-.71A5.97 5.97 0 008 3z" fill="#0f172a" />
                <path d="M10.83 7.17A3.98 3.98 0 008 6c-1.1 0-2.08.45-2.83 1.17l.71.71A2.99 2.99 0 018 7c.83 0 1.58.34 2.12.88l.71-.71z" fill="#0f172a" />
                <circle cx="8" cy="11" r="2" fill="#0f172a" />
              </svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="5" width="2" height="6" rx="0.5" fill="#0f172a" />
                <rect x="5" y="3" width="2" height="8" rx="0.5" fill="#0f172a" />
                <rect x="9" y="1" width="2" height="10" rx="0.5" fill="#0f172a" />
                <rect x="13" y="6" width="1.5" height="4" rx="0.5" fill="#0f172a" />
              </svg>
            </div>
          </div>

          <div class="wk-nav-header">
            <button class="wk-back-btn" onclick="goBack()" aria-label="Back">
              <img src="../../assets/svg_icons/back.svg" class="icon" width="22" alt="">
            </button>
            <span class="wk-nav-title">Workout Library</span>
          </div>

          <div class="wk-search-wrap wk-library-search-wrap">
            <img src="../../assets/svg_icons/search.svg" class="wk-search-icon-img" width="20" height="20" alt="">
            <input type="text" class="wk-search-input" placeholder="Search workouts..." id="wkLibrarySearch">
            <button class="wk-search-clear" id="wkLibrarySearchClear" onclick="clearWorkoutSearch()" style="display:none" aria-label="Clear search">
              <img src="../../assets/svg_icons/cross-x.svg" class="icon" width="16" height="16" alt="">
            </button>
          </div>

          <div class="wk-filters" id="wkLibraryFilters">
            <button class="wk-chip active" data-filter="all">All</button>
            <button class="wk-chip" data-filter="chest">Chest</button>
            <button class="wk-chip" data-filter="back">Back</button>
            <button class="wk-chip" data-filter="legs">Legs</button>
            <button class="wk-chip" data-filter="shoulders">Shoulders</button>
            <button class="wk-chip" data-filter="arms">Arms</button>
            <button class="wk-chip" data-filter="core">Core</button>
          </div>

          <div class="wk-list wk-library-list" id="wkLibraryList">
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=5"></script>
  <script>
    (function () {
      var fallbackWorkouts = [
        {
          id: 'w1',
          name: 'Upper Body Strength',
          desc: 'Build overall upper body strength with compound movements.',
          muscle: 'chest',
          muscles: ['Chest', 'Back', 'Shoulders'],
          duration: 45,
          difficulty: 'Intermediate',
          image: '../../assets/img/woman-upper-body.png'
        },
        {
          id: 'w2',
          name: 'Lower Body Power',
          desc: 'Increase leg strength with explosive and strength exercises.',
          muscle: 'legs',
          muscles: ['Quadriceps', 'Glutes'],
          duration: 50,
          difficulty: 'Advanced',
          image: '../../assets/img/david.jpg'
        },
        {
          id: 'w4',
          name: 'Core Stability',
          desc: 'Enhance core muscles for better balance and posture.',
          muscle: 'core',
          muscles: ['Abs', 'Lower Back'],
          duration: 30,
          difficulty: 'Beginner',
          image: '../../assets/img/sara.jpg'
        },
        {
          id: 'w5',
          name: 'Flexibility & Mobility',
          desc: 'Improve joint range of motion with dynamic stretches.',
          muscle: 'shoulders',
          muscles: ['Shoulders', 'Hips', 'Spine'],
          duration: 40,
          difficulty: 'All Levels',
          image: '../../assets/img/lena.jpg'
        },
        {
          id: 'w8',
          name: 'Cardio Endurance',
          desc: 'Boost cardiovascular health with interval training.',
          muscle: 'legs',
          muscles: ['Heart', 'Lungs', 'Legs'],
          duration: 35,
          difficulty: 'Intermediate',
          image: '../../assets/img/marcus.jpg'
        }
      ];

      function escapeText(value) {
        return String(value || '').replace(/[&<>"']/g, function (match) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
          }[match];
        });
      }

      function getFallbackState() {
        var activeChip = document.querySelector('#wkLibraryFilters .wk-chip.active');
        var input = document.getElementById('wkLibrarySearch');
        return {
          filter: activeChip ? activeChip.dataset.filter : 'all',
          search: input ? input.value.trim().toLowerCase() : ''
        };
      }

      function openFallbackWorkout(id) {
        if (typeof window.openWorkoutDetail === 'function') {
          window.openWorkoutDetail(id);
          return;
        }

        var workout = fallbackWorkouts.find(function (item) { return item.id === id; });
        if (workout) {
          try {
            var rawState = localStorage.getItem('strivio_state');
            var savedState = rawState ? JSON.parse(rawState) : {};
            savedState.currentWorkout = workout;
            localStorage.setItem('strivio_state', JSON.stringify(savedState));
          } catch (error) {
            // Navigation still works if storage is unavailable.
          }
        }
        window.location.href = 'workout-detail.html';
      }

      function renderFallbackLibrary() {
        var list = document.getElementById('wkLibraryList');
        var clearBtn = document.getElementById('wkLibrarySearchClear');
        if (!list) return;

        var current = getFallbackState();
        var results = fallbackWorkouts.filter(function (workout) {
          var matchesFilter = current.filter === 'all' || workout.muscle === current.filter || (workout.muscles || []).some(function (muscle) {
            return muscle.toLowerCase().includes(current.filter);
          });
          var haystack = [workout.name, workout.desc, workout.muscle].concat(workout.muscles || []).join(' ').toLowerCase();
          var matchesSearch = !current.search || haystack.includes(current.search);
          return matchesFilter && matchesSearch;
        });

        if (clearBtn) {
          clearBtn.style.display = current.search ? 'flex' : 'none';
        }

        if (!results.length) {
          list.innerHTML = '<div class="wk-lib-empty">' +
            '<div class="wk-lib-empty-icon"><img src="../../assets/svg_icons/search.svg" width="38" height="38" alt=""></div>' +
            '<h3>No workouts found for "' + escapeText(current.search || current.filter) + '"</h3>' +
            '<p>Try searching another muscle group or clear the filter to browse the full library.</p>' +
            '<button class="wk-empty-clear" type="button">Clear search</button>' +
            '</div>';
          var emptyButton = list.querySelector('.wk-empty-clear');
          if (emptyButton) {
            emptyButton.addEventListener('click', function () {
              var input = document.getElementById('wkLibrarySearch');
              if (input) input.value = '';
              document.querySelectorAll('#wkLibraryFilters .wk-chip').forEach(function (chip) {
                chip.classList.toggle('active', chip.dataset.filter === 'all');
              });
              renderFallbackLibrary();
            });
          }
          return;
        }

        list.innerHTML = results.map(function (workout) {
          var tags = (workout.muscles || []).slice(0, 2).map(function (tag) {
            return '<span>' + escapeText(tag) + '</span>';
          }).join('');
          return '<button class="wk-lib-card" type="button" data-workout-id="' + escapeText(workout.id) + '">' +
            '<div class="wk-lib-thumb"><img src="' + escapeText(workout.image) + '" alt="' + escapeText(workout.name) + '"></div>' +
            '<div class="wk-lib-content">' +
              '<h3>' + escapeText(workout.name) + '</h3>' +
              '<p>' + escapeText(workout.desc) + '</p>' +
              '<div class="wk-lib-meta">' +
                '<span>' + escapeText(workout.duration) + ' min</span>' +
                '<span>' + escapeText(workout.difficulty) + '</span>' +
              '</div>' +
              '<div class="wk-lib-tags">' + tags + '</div>' +
            '</div>' +
          '</button>';
        }).join('');

        list.querySelectorAll('.wk-lib-card').forEach(function (card) {
          card.addEventListener('click', function () {
            openFallbackWorkout(card.dataset.workoutId);
          });
        });
      }

      function wireFallbackLibrary() {
        var search = document.getElementById('wkLibrarySearch');
        var clear = document.getElementById('wkLibrarySearchClear');
        var filters = document.getElementById('wkLibraryFilters');

        if (search && !search.dataset.fallbackReady) {
          search.dataset.fallbackReady = 'true';
          search.addEventListener('input', renderFallbackLibrary);
        }

        if (clear && !clear.dataset.fallbackReady) {
          clear.dataset.fallbackReady = 'true';
          clear.addEventListener('click', function () {
            if (search) {
              search.value = '';
              search.focus();
            }
            renderFallbackLibrary();
          });
        }

        if (filters && !filters.dataset.fallbackReady) {
          filters.dataset.fallbackReady = 'true';
          filters.addEventListener('click', function (event) {
            var chip = event.target.closest('.wk-chip');
            if (!chip) return;
            filters.querySelectorAll('.wk-chip').forEach(function (item) {
              item.classList.toggle('active', item === chip);
            });
            renderFallbackLibrary();
          });
        }
      }

      window.addEventListener('load', function () {
        setTimeout(function () {
          var list = document.getElementById('wkLibraryList');
          if (!list) return;

          if (!list.children.length && typeof window.initWorkoutLibrary === 'function') {
            try {
              window.initWorkoutLibrary();
            } catch (error) {
              list.innerHTML = '';
            }
          }

          if (!list.children.length) {
            wireFallbackLibrary();
            renderFallbackLibrary();
          }
        }, 80);
      });
    })();
  </script>
</body>
</html>
