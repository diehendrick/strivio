<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=13">
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- ===== WORKOUT TAB: Exercise Library ===== -->
        <div class="screen screen-exercise-library screen-exercise-library-figma active" data-screen="exercise-library">
          <div class="status-bar">
            <span class="status-time">9:41</span>
            <div class="status-icons">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="10" width="3" height="5" rx="0.5" fill="#0f172a" />
                <rect x="6" y="7" width="3" height="8" rx="0.5" fill="#0f172a" />
                <rect x="11" y="3" width="3" height="12" rx="0.5" fill="#0f172a" />
              </svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 3c-1.66 0-3.08.69-4.12 1.78l.7.72A4.97 4.97 0 018 4c1.38 0 2.63.56 3.54 1.46l.7-.71A5.97 5.97 0 008 3z" fill="#0f172a" />
                <path d="M10.83 7.17A3.98 3.98 0 008 6c-1.1 0-2.08.45-2.83 1.17l.71.71A2.99 2.99 0 018 7c.83 0 1.58.34 2.12.88l.71-.71z" fill="#0f172a" />
                <circle cx="8" cy="11" r="2" fill="#0f172a" />
              </svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="5" width="2" height="6" rx="0.5" fill="#0f172a" />
                <rect x="5" y="3" width="2" height="8" rx="0.5" fill="#0f172a" />
                <rect x="9" y="1" width="2" height="10" rx="0.5" fill="#0f172a" />
                <rect x="13" y="6" width="1.5" height="4" rx="0.5" fill="#0f172a" />
              </svg>
            </div>
          </div>
          <div class="wk-nav-header">
            <button class="wk-back-btn" onclick="goBack()" aria-label="Back"><img src="../../assets/svg_icons/back.svg" class="icon" width="22" alt=""></button>
            <span class="wk-nav-title">Exercise</span>
          </div>
          <div class="wk-search-wrap wk-ex-library-search-wrap">
            <span class="wk-search-icon" aria-hidden="true"></span>
            <input type="text" class="wk-search-input" placeholder="Search exercises..." id="wkExLibSearch">
            <button class="wk-search-clear" id="wkExLibSearchClear" onclick="clearExerciseSearch()" style="display:none" aria-label="Clear search"><span class="icon" style="--icon-url:url('../../assets/svg_icons/cross-x.svg'); width:16px; height:16px" aria-hidden="true"></span></button>
          </div>
          <div class="wk-ex-filter-row" id="wkExLibFilters">
            <button class="wk-ex-filter-chip" type="button" data-ex-filter-sheet="muscle" aria-haspopup="dialog" aria-expanded="false">
              <span>Muscle Group</span>
              <span class="icon wk-ex-filter-chip-chevron" style="--icon-url:url('../../assets/svg_icons/down.svg'); width:16px; height:16px" aria-hidden="true"></span>
            </button>
            <button class="wk-ex-filter-chip" type="button" data-ex-filter-sheet="level" aria-haspopup="dialog" aria-expanded="false">
              <span>Level</span>
              <span class="icon wk-ex-filter-chip-chevron" style="--icon-url:url('../../assets/svg_icons/down.svg'); width:16px; height:16px" aria-hidden="true"></span>
            </button>
            <button class="wk-ex-filter-chip" type="button" data-ex-filter-sheet="location" aria-haspopup="dialog" aria-expanded="false">
              <span>Location</span>
              <span class="icon wk-ex-filter-chip-chevron" style="--icon-url:url('../../assets/svg_icons/down.svg'); width:16px; height:16px" aria-hidden="true"></span>
            </button>
          </div>
          <div class="wk-library-summary wk-ex-library-summary">
            <span class="icon" style="--icon-url:url('../../assets/svg_icons/dumbbell-ray.svg'); width:12px; height:12px" aria-hidden="true"></span>
            <p class="wk-library-result-count" id="wkExLibraryResultsCount">0 exercises</p>
            <button class="wk-library-reset" type="button" id="wkExLibraryResetFilters" onclick="resetExerciseLibraryFilters()" hidden>Reset filters</button>
          </div>
          <div class="wk-list" id="wkExLibList">
            <!-- Dynamically rendered -->
          </div>
          <div class="wk-filter-sheet-backdrop" id="wkExFilterSheetBackdrop" hidden></div>
          <section class="wk-filter-sheet wk-ex-filter-sheet" id="wkExFilterSheet" aria-hidden="true">
            <div class="wk-filter-sheet-handle" aria-hidden="true"></div>
            <div class="wk-filter-sheet-header">
              <div>
                <p class="wk-filter-sheet-kicker">Exercise Filter</p>
                <h2 class="wk-filter-sheet-title" id="wkExFilterSheetTitle">Select Filter</h2>
              </div>
              <button class="wk-filter-sheet-close" type="button" onclick="closeExerciseLibrarySheet()" aria-label="Close filter sheet">
                <img src="../../assets/svg_icons/cross-x.svg" class="icon" width="16" height="16" alt="">
              </button>
            </div>
            <div class="wk-filter-sheet-options" id="wkExFilterSheetOptions"></div>
          </section>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=12"></script>
</body>
</html>
