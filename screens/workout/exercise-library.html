<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- ===== WORKOUT TAB: Exercise Library ===== -->
        <div class="screen screen-exercise-library active" data-screen="exercise-library">
          <div class="wk-nav-header">
            <button class="wk-back-btn" onclick="goBack()"><img src="../../assets/svg_icons/back.svg" class="icon" width="22" alt=""></button>
            <span class="wk-nav-title">Exercise Library</span>
          </div>
          <div class="wk-search-wrap">
            <iconify-icon icon="solar:magnifer-bold-duotone" width="18" class="wk-search-icon"></iconify-icon>
            <input type="text" class="wk-search-input" placeholder="Search exercises..." id="wkExLibSearch">
            <button class="wk-search-clear" id="wkExLibSearchClear" onclick="clearExerciseSearch()" style="display:none"><img src="../../assets/svg_icons/circle-x.svg" class="icon" width="16" alt=""></button>
          </div>
          <div class="wk-filters" id="wkExLibFilters">
            <button class="wk-chip active" data-filter="all">All</button>
            <button class="wk-chip" data-filter="chest">Chest</button>
            <button class="wk-chip" data-filter="back">Back</button>
            <button class="wk-chip" data-filter="legs">Legs</button>
            <button class="wk-chip" data-filter="shoulders">Shoulders</button>
            <button class="wk-chip" data-filter="arms">Arms</button>
            <button class="wk-chip" data-filter="core">Core</button>
          </div>
          <div class="wk-list" id="wkExLibList">
            <!-- Dynamically rendered -->
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>
</html>
