<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="../../styles.css?v=5">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- ===== WORKOUT TAB: Coach Q3 — Muscle Groups -->
        <div class="screen screen-coach-question active" data-screen="coach-q3">
          <div class="progress-section">
            <div class="progress-bar"><div class="progress-fill" style="width:50%"></div></div>
            <span class="progress-label">Question 3 of 6</span>
          </div>
          <div class="question-content">
            <div class="coach-illustration"><img src="../../assets/illustration/option=muscle.svg" alt=""></div>
            <h2 class="question-title">Which muscle groups?</h2>
            <p class="question-helper">Select up to 3 target areas</p>
            <div class="option-cards multi-select" data-key="coachMuscles" data-max="3" id="coachMusclesOptions">
              <div class="option-card" data-value="chest"><img src="../../assets/svg_icons/muscle.svg" class="icon" width="22" alt=""><span class="option-label">Chest</span><span class="option-check"></span></div>
              <div class="option-card" data-value="back"><img src="../../assets/svg_icons/body.svg" class="icon" width="22" alt=""><span class="option-label">Back</span><span class="option-check"></span></div>
              <div class="option-card" data-value="legs"><img src="../../assets/svg_icons/leg.svg" class="icon" width="22" alt=""><span class="option-label">Legs</span><span class="option-check"></span></div>
              <div class="option-card" data-value="shoulders"><img src="../../assets/svg_icons/shoulder.svg" class="icon" width="22" alt=""><span class="option-label">Shoulders</span><span class="option-check"></span></div>
              <div class="option-card" data-value="arms"><img src="../../assets/svg_icons/dumbbell-ray.svg" class="icon" width="22" alt=""><span class="option-label">Arms</span><span class="option-check"></span></div>
              <div class="option-card" data-value="core"><img src="../../assets/svg_icons/core.svg" class="icon" width="22" alt=""><span class="option-label">Core</span><span class="option-check"></span></div>
            </div>
          </div>
          <div class="cta-section">
            <button class="btn-primary" id="btnCoachQ3" disabled onclick="saveCoachAndNext('coach-q3','coachMuscles','coach-q4')">Continue</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <script src="../../app.js?v=5"></script>
</body>
</html>
