<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="../../styles.css?v=5">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- ===== WORKOUT TAB: Coach Q6 — Name -->
        <div class="screen screen-coach-question active" data-screen="coach-q6">
          <div class="progress-section">
            <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
            <span class="progress-label">Question 6 of 6</span>
          </div>
          <div class="question-content">
            <div class="coach-illustration"><img src="../../assets/illustration/option=note.svg" alt=""></div>
            <h2 class="question-title">Name your workout</h2>
            <p class="question-helper">Give your coach-generated plan a name</p>
            <div class="input-group coach-name-field">
              <label class="input-label">Full Name</label>
              <input type="text" class="form-input" id="coachWorkoutName" placeholder="e.g. Monday Power" maxlength="40">
            </div>
          </div>
          <div class="cta-section">
            <button class="btn-primary" id="btnCoachQ6" disabled onclick="generateCoachWorkout()">Continue</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <script src="../../app.js?v=5"></script>
</body>
</html>
