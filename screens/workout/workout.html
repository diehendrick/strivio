<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Workout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>

<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <div class="screen screen-workout active" data-screen="workout">

          <!-- Status Bar -->
          <div class="status-bar">
            <span class="status-time">9:41</span>
            <div class="status-icons">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="10" width="3" height="5" rx="0.5" fill="#0f172a" />
                <rect x="6" y="7" width="3" height="8" rx="0.5" fill="#0f172a" />
                <rect x="11" y="3" width="3" height="12" rx="0.5" fill="#0f172a" />
              </svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path
                  d="M8 3c-1.66 0-3.08.69-4.12 1.78l.7.72A4.97 4.97 0 018 4c1.38 0 2.63.56 3.54 1.46l.7-.71A5.97 5.97 0 008 3z"
                  fill="#0f172a" />
                <path
                  d="M10.83 7.17A3.98 3.98 0 008 6c-1.1 0-2.08.45-2.83 1.17l.71.71A2.99 2.99 0 018 7c.83 0 1.58.34 2.12.88l.71-.71z"
                  fill="#0f172a" />
                <circle cx="8" cy="11" r="2" fill="#0f172a" />
              </svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="5" width="2" height="6" rx="0.5" fill="#0f172a" />
                <rect x="5" y="3" width="2" height="8" rx="0.5" fill="#0f172a" />
                <rect x="9" y="1" width="2" height="10" rx="0.5" fill="#0f172a" />
                <rect x="13" y="6" width="1.5" height="4" rx="0.5" fill="#0f172a" />
              </svg>
            </div>
          </div>

          <!-- Header -->
          <div class="screen-header">
            <div class="header-left">
              <div class="header-avatar">
                <img src="../../assets/img/profile.jpg" alt="Profile">
              </div>
              <div class="header-info">
                <h1 class="header-name" id="headerName">Mike Michel</h1>
                <p class="header-date" id="headerDate">Tuesday, Apr 24</p>
              </div>
            </div>
            <div class="streak-badge">
              <div class="streak-pill">
                <img src="../../assets/svg_icons/flame.svg" class="icon-coral" width="20" height="20" alt="">
                <span class="streak-number">7</span>
              </div>
              <span class="streak-label">Day Streak</span>
            </div>
          </div>

          <!-- Tab Bar -->
          <div class="tab-bar-wrap">
            <div class="tab-bar">
              <button class="tab-item" data-tab="tracking" onclick="navigateTo('home')">Tracking</button>
              <button class="tab-item active" data-tab="workouts">Workouts</button>
            </div>
          </div>

          <!-- Scrollable Content -->
          <div class="wk-workout-wrapper">

            <!-- Today's Workout Card -->
            <div class="wk-workout-card">
              <div class="wk-workout-card-img"></div>
              <img src="../../assets/img/woman-upper-body.png" class="wk-workout-card-photo" alt="">
              <div class="wk-workout-card-date">
                <img src="../../assets/svg_icons/calendar.svg" class="icon" width="16" alt="">
                <span>Today, May 23</span>
              </div>
              <h2 class="wk-workout-card-title">Upper Body Strength</h2>
              <div class="wk-workout-card-meta">
                <div class="wk-meta-item">
                  <img src="../../assets/svg_icons/clock-five.svg" class="icon" width="16" alt="">
                  <span>45 min</span>
                </div>
                <div class="wk-meta-item">
                  <img src="../../assets/svg_icons/chart-simple.svg" class="icon" width="16" alt="">
                  <span>Intermediate</span>
                </div>
              </div>
              <div class="wk-workout-card-tags">
                <span class="wk-tag-chip">Chest</span>
                <span class="wk-tag-chip">Back</span>
                <span class="wk-tag-chip">Shoulders</span>
              </div>
              <button class="wk-workout-card-btn" onclick="navigateTo('workout-countdown')">
                <img src="../../assets/svg_icons/play.svg" class="icon" width="18" alt="">
                <span>Continue</span>
              </button>
            </div>

            <!-- 4-Card Grid -->
            <div class="wk-grid-cards">
              <!-- Workout (locked) -->
              <div class="wk-grid-card">
                <div class="wk-grid-card-header">
                  <div class="wk-grid-card-icon">
                    <img src="../../assets/svg_icons/muscle.svg" class="icon" width="28" alt="">
                  </div>
                  <div class="wk-grid-card-lock">
                    <img src="../../assets/svg_icons/lock.svg" class="icon-yellow" width="16" alt="">
                  </div>
                </div>
                <div class="wk-grid-card-body">
                  <span class="wk-grid-card-title">Workout</span>
                  <span class="wk-grid-card-desc">Explore premium workout plans</span>
                </div>
              </div>

              <!-- Exercise (locked) -->
              <div class="wk-grid-card">
                <div class="wk-grid-card-header">
                  <div class="wk-grid-card-icon">
                    <img src="../../assets/svg_icons/book.svg" class="icon-lime" width="28" alt="">
                  </div>
                  <div class="wk-grid-card-lock">
                    <img src="../../assets/svg_icons/lock.svg" class="icon-yellow" width="16" alt="">
                  </div>
                </div>
                <div class="wk-grid-card-body">
                  <span class="wk-grid-card-title">Exercise</span>
                  <span class="wk-grid-card-desc">
                    <span>Browse 1000+</span><br><span>exercises</span>
                  </span>
                </div>
              </div>

              <!-- Custom (locked) -->
              <div class="wk-grid-card">
                <div class="wk-grid-card-header">
                  <div class="wk-grid-card-icon">
                    <img src="../../assets/svg_icons/add.svg" class="icon-orange" width="28" alt="">
                  </div>
                  <div class="wk-grid-card-lock">
                    <img src="../../assets/svg_icons/lock.svg" class="icon-yellow" width="16" alt="">
                  </div>
                </div>
                <div class="wk-grid-card-body">
                  <span class="wk-grid-card-title">Custom</span>
                  <span class="wk-grid-card-desc">Create your own workout</span>
                </div>
              </div>

              <!-- Log Activity (unlocked) -->
              <div class="wk-grid-card unlocked" onclick="navigateTo('workout-log')">
                <div class="wk-grid-card-header">
                  <div class="wk-grid-card-icon">
                    <img src="../../assets/svg_icons/journal-alt.svg" class="icon-teal" width="28" alt="">
                  </div>
                  <div class="wk-grid-card-lock wk-lock-hidden">
                    <img src="../../assets/svg_icons/lock.svg" class="icon" width="16" alt="">
                  </div>
                </div>
                <div class="wk-grid-card-body">
                  <span class="wk-grid-card-title">Log Activity</span>
                  <span class="wk-grid-card-desc">View your workout history</span>
                </div>
              </div>
            </div>

          </div>

          <!-- Bottom Navigation -->
          <div class="bottom-nav">
            <button class="nav-item" data-nav="home" onclick="navigateTo('home')">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" class="nav-icon">
                <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                <polyline points="9,22 9,12 15,12 15,22" />
              </svg>
            </button>
            <button class="nav-item" data-nav="logbook" onclick="navigateTo('logbook')">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" class="nav-icon">
                <path d="M4 19.5A2.5 2.5 0 016.5 17H20" />
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z" />
                <line x1="8" y1="7" x2="16" y2="7" />
                <line x1="8" y1="11" x2="14" y2="11" />
              </svg>
            </button>
            <button class="nav-fab" id="fabButtonWorkout" onclick="navigateTo('coach-q1')">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
                stroke-linecap="round" class="nav-fab-icon">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
            </button>
            <button class="nav-item active" data-nav="coach">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7F7CF0" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" class="nav-icon">
                <circle cx="12" cy="12" r="10" />
                <path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3" />
                <line x1="12" y1="17" x2="12.01" y2="17" />
              </svg>
              <div class="nav-indicator"></div>
            </button>
            <button class="nav-item" data-nav="more">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" class="nav-icon">
                <circle cx="12" cy="12" r="1" fill="#64748b" />
                <circle cx="19" cy="12" r="1" fill="#64748b" />
                <circle cx="5" cy="12" r="1" fill="#64748b" />
              </svg>
            </button>
          </div>

        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>

</html>
