<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="../../styles.css?v=5">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- ===== WORKOUT TAB: Coach Q2 — Target -->
        <div class="screen screen-coach-question active" data-screen="coach-q2">
          <div class="progress-section">
            <div class="progress-bar"><div class="progress-fill" style="width:33.33%"></div></div>
            <span class="progress-label">Question 2 of 6</span>
          </div>
          <div class="question-content">
            <div class="coach-illustration"><img src="../../assets/illustration/option=goal.svg" alt=""></div>
            <h2 class="question-title">What's your focus?</h2>
            <p class="question-helper">Choose your primary training target</p>
            <div class="option-cards single-select" data-key="coachTarget" id="coachTargetOptions">
              <div class="option-card has-desc" data-value="general"><img src="../../assets/svg_icons/meditation.svg" class="icon" width="22" alt=""><div class="option-text"><span class="option-label">General Fitness</span><span class="option-desc">Balanced approach</span></div><span class="option-check"></span></div>
              <div class="option-card has-desc" data-value="flexibility"><img src="../../assets/svg_icons/clock-five.svg" class="icon" width="22" alt=""><div class="option-text"><span class="option-label">Flexibility</span><span class="option-desc">Mobility & recovery</span></div><span class="option-check"></span></div>
              <div class="option-card has-desc" data-value="strength"><img src="../../assets/svg_icons/dumbbell-ray.svg" class="icon" width="22" alt=""><div class="option-text"><span class="option-label">Strength</span><span class="option-desc">Build power & muscle</span></div><span class="option-check"></span></div>
              <div class="option-card has-desc" data-value="endurance"><img src="../../assets/svg_icons/running.svg" class="icon" width="22" alt=""><div class="option-text"><span class="option-label">Endurance</span><span class="option-desc">Improve stamina</span></div><span class="option-check"></span></div>
            </div>
          </div>
          <div class="cta-section">
            <button class="btn-primary" id="btnCoachQ2" disabled onclick="saveCoachAndNext('coach-q2','coachTarget','coach-q3')">Continue</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <script src="../../app.js?v=5"></script>
</body>
</html>
