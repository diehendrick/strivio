<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="../../styles.css?v=5">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- ===== WORKOUT TAB: Coach Generating ===== -->
        <div class="screen screen-loading screen-coach-generating active" data-screen="coach-generating">
          <div class="loading-content coach-generating-content">
            <div class="loading-logo coach-generating-logo"><div class="logo-pulse"></div><img src="../../assets/svg_icons/life.svg" class="icon" width="48" alt=""></div>
            <h2 class="loading-title">Building Your Workout...</h2>
            <p class="loading-desc">Your coach is creating a personalized plan based on your preferences.</p>
            <div class="loading-steps" id="coachLoadingSteps">
              <div class="loading-step pending"><span class="step-icon">&#x25CB;</span><span class="step-text">Analyzing your preferences</span></div>
              <div class="loading-step pending"><span class="step-icon">&#x25CB;</span><span class="step-text">Selecting exercises</span></div>
              <div class="loading-step pending"><span class="step-icon">&#x25CB;</span><span class="step-text">Structuring sets and reps</span></div>
              <div class="loading-step pending"><span class="step-icon">&#x25CB;</span><span class="step-text">Finalizing your plan</span></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=5"></script>
</body>
</html>
