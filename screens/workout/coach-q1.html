<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="../../styles.css?v=5">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- ===== WORKOUT TAB: Coach Q1 — Time -->
        <div class="screen screen-coach-question active" data-screen="coach-q1">
          <div class="progress-section">
            <div class="progress-bar"><div class="progress-fill" style="width:16.67%"></div></div>
            <span class="progress-label">Question 1 of 6</span>
          </div>
          <div class="question-content">
            <div class="coach-illustration"><img src="../../assets/illustration/option=timer.svg" alt=""></div>
            <h2 class="question-title">How much time do you have?</h2>
            <p class="question-helper">Build a workout that fits your schedule</p>
            <div class="option-cards single-select" data-key="coachTime" id="coachTimeOptions">
              <div class="option-card has-desc" data-value="30"><img src="../../assets/svg_icons/clock-five.svg" class="icon" width="22" alt=""><div class="option-text"><span class="option-label">30 minutes</span><span class="option-desc">Quick session</span></div><span class="option-check"></span></div>
              <div class="option-card has-desc" data-value="45"><img src="../../assets/svg_icons/clock-five.svg" class="icon" width="22" alt=""><div class="option-text"><span class="option-label">45 minutes</span><span class="option-desc">Standard session</span></div><span class="option-check"></span></div>
              <div class="option-card has-desc" data-value="60"><img src="../../assets/svg_icons/clock-five.svg" class="icon" width="22" alt=""><div class="option-text"><span class="option-label">60 minutes</span><span class="option-desc">Full session</span></div><span class="option-check"></span></div>
              <div class="option-card has-desc" data-value="90"><img src="../../assets/svg_icons/clock-five.svg" class="icon" width="22" alt=""><div class="option-text"><span class="option-label">90 minutes</span><span class="option-desc">Extended session</span></div><span class="option-check"></span></div>
            </div>
          </div>
          <div class="cta-section">
            <button class="btn-primary" id="btnCoachQ1" disabled onclick="saveCoachAndNext('coach-q1','coachTime','coach-q2')">Continue</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <script src="../../app.js?v=5"></script>
</body>
</html>
