<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- ===== WORKOUT TAB: Execution — Rest Timer ===== -->
        <div class="screen screen-exec-dark active" data-screen="workout-rest">
          <div class="wk-rest-wrap">
            <div class="wk-rest-timer-ring" id="wkRestTimerRing">
              <svg viewBox="0 0 160 160" class="wk-exec-ring-svg">
                <circle cx="80" cy="80" r="70" class="wk-exec-ring-track"/>
                <circle cx="80" cy="80" r="70" class="wk-exec-ring-fill" id="wkRestRing"
                  stroke-dasharray="439.82"
                  stroke-dashoffset="0"/>
              </svg>
              <span class="wk-rest-num" id="wkRestNum">90</span>
            </div>
            <div class="wk-rest-label">Rest Timer</div>
            <div class="wk-rest-hint" id="wkRestHint">Getting ready for next set...</div>
            <button class="wk-rest-skip-btn" onclick="skipRest()">Skip Rest</button>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
</body>
</html>
