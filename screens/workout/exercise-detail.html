<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Exercise Detail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="../../styles.css?v=33">
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- ===== WORKOUT TAB: Exercise Detail ===== -->
        <div class="screen screen-exercise-detail screen-exercise-detail-figma active" data-screen="exercise-detail">
          <div class="status-bar">
            <span class="status-time">9:41</span>
            <div class="status-icons">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="10" width="3" height="5" rx="0.5" fill="#0f172a" />
                <rect x="6" y="7" width="3" height="8" rx="0.5" fill="#0f172a" />
                <rect x="11" y="3" width="3" height="12" rx="0.5" fill="#0f172a" />
              </svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 3c-1.66 0-3.08.69-4.12 1.78l.7.72A4.97 4.97 0 018 4c1.38 0 2.63.56 3.54 1.46l.7-.71A5.97 5.97 0 008 3z" fill="#0f172a" />
                <path d="M10.83 7.17A3.98 3.98 0 008 6c-1.1 0-2.08.45-2.83 1.17l.71.71A2.99 2.99 0 018 7c.83 0 1.58.34 2.12.88l.71-.71z" fill="#0f172a" />
                <circle cx="8" cy="11" r="2" fill="#0f172a" />
              </svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="5" width="2" height="6" rx="0.5" fill="#0f172a" />
                <rect x="5" y="3" width="2" height="8" rx="0.5" fill="#0f172a" />
                <rect x="9" y="1" width="2" height="10" rx="0.5" fill="#0f172a" />
                <rect x="13" y="6" width="1.5" height="4" rx="0.5" fill="#0f172a" />
              </svg>
            </div>
          </div>
          <div class="wk-nav-header">
            <button class="wk-back-btn" onclick="goBack()" aria-label="Back">
              <span class="icon wk-ex-detail-nav-icon" style="--icon-url: url('../../assets/svg_icons/back.svg'); width: 22px; height: 22px;" aria-hidden="true"></span>
            </button>
            <span class="wk-nav-title">Exercise Detail</span>
            <button class="wk-action-icon wk-ex-detail-fav" id="wkExDetailFav" onclick="toggleFavorite()" aria-label="Toggle favorite">
              <span class="icon wk-ex-detail-fav-icon" style="--icon-url: url('../../assets/svg_icons/love.svg'); width: 22px; height: 22px;" aria-hidden="true"></span>
            </button>
          </div>
          <div class="wk-ex-detail-body" id="wkExDetailBody">
            <!-- Dynamically rendered -->
          </div>
          <div class="wk-ex-detail-footer" id="wkExDetailFooter"></div>

          <div class="bottom-sheet wk-ex-note-sheet" id="wkExerciseNoteSheet" aria-hidden="true">
            <div class="sheet-backdrop" onclick="closeExerciseNoteSheet()"></div>
            <div class="sheet-content wk-ex-note-sheet-content">
              <div class="sheet-handle"></div>
              <div class="sheet-header">
                <h3 class="sheet-title" id="wkExerciseNoteSheetTitle">Exercise Note</h3>
                <button class="sheet-close" type="button" onclick="closeExerciseNoteSheet()" aria-label="Close">
                  <span class="icon wk-ex-detail-sheet-close-icon" style="--icon-url: url('../../assets/svg_icons/cross-x.svg'); width: 16px; height: 16px;" aria-hidden="true"></span>
                </button>
              </div>
              <div class="sheet-body wk-ex-note-sheet-body" id="wkExerciseNoteSheetBody"></div>
              <div class="sheet-actions wk-ex-note-sheet-actions" id="wkExerciseNoteSheetActions"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <script src="../../app.js?v=31"></script>
</body>
</html>
