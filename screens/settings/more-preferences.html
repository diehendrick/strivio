<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Gym Style & Preferences</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=5">
</head>

<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <div class="screen screen-more-preferences active" data-screen="more-preferences">
          <div class="more-content">
            <div class="status-bar">
              <span class="status-time">9:41</span>
              <div class="status-icons">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="10" width="3" height="5" rx="0.5" fill="#0f172a" /><rect x="6" y="7" width="3" height="8" rx="0.5" fill="#0f172a" /><rect x="11" y="3" width="3" height="12" rx="0.5" fill="#0f172a" /></svg>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3c-1.66 0-3.08.69-4.12 1.78l.7.72A4.97 4.97 0 018 4c1.38 0 2.63.56 3.54 1.46l.7-.71A5.97 5.97 0 008 3z" fill="#0f172a" /><path d="M10.83 7.17A3.98 3.98 0 008 6c-1.1 0-2.08.45-2.83 1.17l.71.71A2.99 2.99 0 018 7c.83 0 1.58.34 2.12.88l.71-.71z" fill="#0f172a" /><circle cx="8" cy="11" r="2" fill="#0f172a" /></svg>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="5" width="2" height="6" rx="0.5" fill="#0f172a" /><rect x="5" y="3" width="2" height="8" rx="0.5" fill="#0f172a" /><rect x="9" y="1" width="2" height="10" rx="0.5" fill="#0f172a" /><rect x="13" y="6" width="1.5" height="4" rx="0.5" fill="#0f172a" /></svg>
              </div>
            </div>

            <div class="more-header more-header-back">
              <button class="more-back-btn" onclick="navigateTo('more')">
                <img src="../../assets/svg_icons/back.svg" width="24" alt="">
              </button>
              <h1 class="more-title">Gym Style & Preferences</h1>
            </div>

            <div class="more-scroll-wrapper">
              <p class="more-section-desc">Update your training environment and workout constraints.</p>

              <!-- Equipment Access -->
              <div class="more-form-group">
                <label class="more-form-label">Equipment Access</label>
                <div class="more-option-cards" id="equipmentOptions">
                  <button class="more-option-card" data-value="Full Gym">Full Gym</button>
                  <button class="more-option-card" data-value="Dumbbells Only">Dumbbells Only</button>
                  <button class="more-option-card" data-value="Resistance Bands">Resistance Bands</button>
                  <button class="more-option-card" data-value="Bodyweight Only">Bodyweight Only</button>
                  <button class="more-option-card" data-value="Home Equipment">Home Equipment</button>
                </div>
              </div>

              <!-- Training Style -->
              <div class="more-form-group">
                <label class="more-form-label">Training Style</label>
                <div class="more-option-cards more-option-cards-multi" id="trainingStyleOptions">
                  <button class="more-option-card" data-value="Strength">Strength</button>
                  <button class="more-option-card" data-value="Hypertrophy">Hypertrophy</button>
                  <button class="more-option-card" data-value="Cardio">Cardio</button>
                  <button class="more-option-card" data-value="HIIT">HIIT</button>
                  <button class="more-option-card" data-value="Mobility">Mobility</button>
                  <button class="more-option-card" data-value="Mixed">Mixed</button>
                </div>
              </div>

              <!-- Workout Location -->
              <div class="more-form-group">
                <label class="more-form-label">Workout Location</label>
                <div class="more-option-cards" id="locationOptions">
                  <button class="more-option-card" data-value="Gym">Gym</button>
                  <button class="more-option-card" data-value="Home">Home</button>
                  <button class="more-option-card" data-value="Outdoor">Outdoor</button>
                  <button class="more-option-card" data-value="Hybrid">Hybrid</button>
                </div>
              </div>

              <!-- Training Frequency -->
              <div class="more-form-group">
                <label class="more-form-label">Training Frequency: <span id="freqValue">4</span> days/week</label>
                <div class="more-freq-slider-wrap">
                  <input type="range" class="more-freq-slider" id="freqSlider" min="1" max="7" step="1" value="4">
                  <div class="more-freq-labels">
                    <span>1</span>
                    <span>2</span>
                    <span>3</span>
                    <span>4</span>
                    <span>5</span>
                    <span>6</span>
                    <span>7</span>
                  </div>
                </div>
              </div>

              <!-- Preferred Days -->
              <div class="more-form-group">
                <label class="more-form-label">Preferred Training Days</label>
                <div class="more-day-cards" id="dayOptions">
                  <button class="more-day-card" data-value="Mon">Mon</button>
                  <button class="more-day-card" data-value="Tue">Tue</button>
                  <button class="more-day-card" data-value="Wed">Wed</button>
                  <button class="more-day-card" data-value="Thu">Thu</button>
                  <button class="more-day-card" data-value="Fri">Fri</button>
                  <button class="more-day-card" data-value="Sat">Sat</button>
                  <button class="more-day-card" data-value="Sun">Sun</button>
                </div>
              </div>

              <!-- Workout Duration -->
              <div class="more-form-group">
                <label class="more-form-label">Preferred Workout Duration</label>
                <div class="more-option-cards" id="durationOptions">
                  <button class="more-option-card" data-value="30 min">30 min</button>
                  <button class="more-option-card" data-value="45 min">45 min</button>
                  <button class="more-option-card" data-value="60 min">60 min</button>
                  <button class="more-option-card" data-value="90 min">90 min</button>
                </div>
              </div>

              <button class="more-save-btn" id="savePrefsBtn">Save Changes</button>

              <div class="more-bottom-spacer"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="more-dialog" id="planApplyDialog">
    <div class="more-dialog-backdrop"></div>
    <div class="more-dialog-content">
      <h3 class="more-dialog-title">Apply Updated Plan?</h3>
      <p class="more-dialog-text">Your preference changes may affect your workout schedule and plan. When would you like to apply?</p>
      <div class="more-dialog-actions more-dialog-actions-vertical">
        <button class="more-dialog-btn more-dialog-btn-primary" onclick="applyPlanNow()">Apply Now</button>
        <button class="more-dialog-btn more-dialog-btn-secondary" onclick="applyPlanNextWeek()">Apply Next Week</button>
      </div>
    </div>
  </div>

  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <script src="../../app.js?v=5"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const state = window.__strivio_state;

      // Equipment
      document.querySelectorAll('#equipmentOptions .more-option-card').forEach(card => {
        if (state.equipment === card.dataset.value) card.classList.add('selected');
        card.addEventListener('click', function() {
          document.querySelectorAll('#equipmentOptions .more-option-card').forEach(c => c.classList.remove('selected'));
          this.classList.add('selected');
        });
      });

      // Training style
      document.querySelectorAll('#trainingStyleOptions .more-option-card').forEach(card => {
        if (state.trainingStyles && state.trainingStyles.includes(card.dataset.value)) card.classList.add('selected');
        card.addEventListener('click', function() {
          this.classList.toggle('selected');
        });
      });

      // Location
      document.querySelectorAll('#locationOptions .more-option-card').forEach(card => {
        if (state.location === card.dataset.value) card.classList.add('selected');
        card.addEventListener('click', function() {
          document.querySelectorAll('#locationOptions .more-option-card').forEach(c => c.classList.remove('selected'));
          this.classList.add('selected');
        });
      });

      // Frequency slider
      const freqSlider = document.getElementById('freqSlider');
      const freqValue = document.getElementById('freqValue');
      freqSlider.value = state.frequency || 4;
      freqValue.textContent = freqSlider.value;
      freqSlider.addEventListener('input', function() {
        freqValue.textContent = this.value;
      });

      // Days
      document.querySelectorAll('#dayOptions .more-day-card').forEach(card => {
        if (state.trainingDays && state.trainingDays.includes(card.dataset.value)) card.classList.add('selected');
        card.addEventListener('click', function() {
          this.classList.toggle('selected');
        });
      });

      // Duration
      document.querySelectorAll('#durationOptions .more-option-card').forEach(card => {
        if (state.workoutDuration === card.dataset.value) card.classList.add('selected');
        card.addEventListener('click', function() {
          document.querySelectorAll('#durationOptions .more-option-card').forEach(c => c.classList.remove('selected'));
          this.classList.add('selected');
        });
      });

      // Save
      document.getElementById('savePrefsBtn').addEventListener('click', function() {
        const eq = document.querySelector('#equipmentOptions .more-option-card.selected');
        if (eq) state.equipment = eq.dataset.value;
        state.trainingStyles = Array.from(document.querySelectorAll('#trainingStyleOptions .more-option-card.selected')).map(c => c.dataset.value);
        const loc = document.querySelector('#locationOptions .more-option-card.selected');
        if (loc) state.location = loc.dataset.value;
        state.frequency = parseInt(freqSlider.value);
        state.trainingDays = Array.from(document.querySelectorAll('#dayOptions .more-day-card.selected')).map(c => c.dataset.value);
        const dur = document.querySelector('#durationOptions .more-option-card.selected');
        if (dur) state.workoutDuration = dur.dataset.value;

        document.getElementById('planApplyDialog').classList.add('more-dialog-active');
      });
    });

    function applyPlanNow() {
      document.getElementById('planApplyDialog').classList.remove('more-dialog-active');
      navigateTo('more');
    }

    function applyPlanNextWeek() {
      document.getElementById('planApplyDialog').classList.remove('more-dialog-active');
      navigateTo('more');
    }
  </script>
</body>

</html>
