<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Change Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=5">
</head>

<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <div class="screen screen-more-password active" data-screen="more-password">
          <div class="more-content">
            <div class="status-bar">
              <span class="status-time">9:41</span>
              <div class="status-icons">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="10" width="3" height="5" rx="0.5" fill="#0f172a" /><rect x="6" y="7" width="3" height="8" rx="0.5" fill="#0f172a" /><rect x="11" y="3" width="3" height="12" rx="0.5" fill="#0f172a" /></svg>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3c-1.66 0-3.08.69-4.12 1.78l.7.72A4.97 4.97 0 018 4c1.38 0 2.63.56 3.54 1.46l.7-.71A5.97 5.97 0 008 3z" fill="#0f172a" /><path d="M10.83 7.17A3.98 3.98 0 008 6c-1.1 0-2.08.45-2.83 1.17l.71.71A2.99 2.99 0 018 7c.83 0 1.58.34 2.12.88l.71-.71z" fill="#0f172a" /><circle cx="8" cy="11" r="2" fill="#0f172a" /></svg>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="5" width="2" height="6" rx="0.5" fill="#0f172a" /><rect x="5" y="3" width="2" height="8" rx="0.5" fill="#0f172a" /><rect x="9" y="1" width="2" height="10" rx="0.5" fill="#0f172a" /><rect x="13" y="6" width="1.5" height="4" rx="0.5" fill="#0f172a" /></svg>
              </div>
            </div>

            <div class="more-header more-header-back">
              <button class="more-back-btn" onclick="navigateTo('more')">
                <img src="../../assets/svg_icons/back.svg" width="24" alt="">
              </button>
              <h1 class="more-title">Change Password</h1>
            </div>

            <div class="more-scroll-wrapper">
              <div class="more-password-form">
                <div class="more-input-group">
                  <label class="more-input-label">Current Password</label>
                  <div class="more-input-wrap">
                    <input type="password" class="more-input" id="currentPassword" placeholder="Enter current password">
                    <button class="more-input-eye" onclick="togglePassword('currentPassword', this)">
                      <img src="../../assets/svg_icons/eye-crossed.svg" width="20" alt="">
                    </button>
                  </div>
                  <span class="more-input-error" id="currentPasswordError"></span>
                </div>

                <div class="more-input-group">
                  <label class="more-input-label">New Password</label>
                  <div class="more-input-wrap">
                    <input type="password" class="more-input" id="newPassword" placeholder="Enter new password">
                    <button class="more-input-eye" onclick="togglePassword('newPassword', this)">
                      <img src="../../assets/svg_icons/eye-crossed.svg" width="20" alt="">
                    </button>
                  </div>
                  <span class="more-input-error" id="newPasswordError"></span>
                </div>

                <div class="more-input-group">
                  <label class="more-input-label">Confirm New Password</label>
                  <div class="more-input-wrap">
                    <input type="password" class="more-input" id="confirmPassword" placeholder="Confirm new password">
                    <button class="more-input-eye" onclick="togglePassword('confirmPassword', this)">
                      <img src="../../assets/svg_icons/eye-crossed.svg" width="20" alt="">
                    </button>
                  </div>
                  <span class="more-input-error" id="confirmPasswordError"></span>
                </div>

                <div class="more-password-rules">
                  <p class="more-password-rules-title">Password must:</p>
                  <ul class="more-password-rules-list">
                    <li id="ruleLength">Be at least 8 characters</li>
                    <li id="ruleUpper">Contain an uppercase letter</li>
                    <li id="ruleNumber">Contain a number</li>
                  </ul>
                </div>

                <button class="more-save-btn" id="savePasswordBtn">Update Password</button>
              </div>

              <div class="more-bottom-spacer"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="more-dialog" id="passwordSuccessDialog">
    <div class="more-dialog-backdrop"></div>
    <div class="more-dialog-content">
      <img src="../../assets/svg_icons/checkmark.svg" width="48" class="more-dialog-icon" alt="">
      <h3 class="more-dialog-title">Password Updated</h3>
      <p class="more-dialog-text">Your password has been successfully updated.</p>
      <div class="more-dialog-actions">
        <button class="more-dialog-btn more-dialog-btn-primary" onclick="navigateTo('more')">Done</button>
      </div>
    </div>
  </div>

  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <script src="../../app.js?v=5"></script>
  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const img = btn.querySelector('img');
      if (input.type === 'password') {
        input.type = 'text';
        img.src = '../../assets/svg_icons/eye.svg';
      } else {
        input.type = 'password';
        img.src = '../../assets/svg_icons/eye-crossed.svg';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      const newPass = document.getElementById('newPassword');
      newPass.addEventListener('input', function() {
        const val = this.value;
        document.getElementById('ruleLength').classList.toggle('valid', val.length >= 8);
        document.getElementById('ruleUpper').classList.toggle('valid', /[A-Z]/.test(val));
        document.getElementById('ruleNumber').classList.toggle('valid', /[0-9]/.test(val));
      });

      document.getElementById('savePasswordBtn').addEventListener('click', function() {
        let valid = true;
        const current = document.getElementById('currentPassword').value;
        const newP = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;

        // Reset errors
        document.querySelectorAll('.more-input-error').forEach(e => e.textContent = '');

        if (!current) {
          document.getElementById('currentPasswordError').textContent = 'Current password is required';
          valid = false;
        }
        if (newP.length < 8) {
          document.getElementById('newPasswordError').textContent = 'Password must be at least 8 characters';
          valid = false;
        }
        if (newP !== confirm) {
          document.getElementById('confirmPasswordError').textContent = 'Passwords do not match';
          valid = false;
        }
        if (current === newP && current) {
          document.getElementById('newPasswordError').textContent = 'New password must be different';
          valid = false;
        }

        if (valid) {
          document.getElementById('passwordSuccessDialog').classList.add('more-dialog-active');
        }
      });
    });
  </script>
</body>

</html>
