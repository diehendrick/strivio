<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Personal Goals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=5">
</head>

<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <div class="screen screen-more-goals active" data-screen="more-goals">
          <div class="more-content">
            <!-- Status Bar -->
            <div class="status-bar">
              <span class="status-time">9:41</span>
              <div class="status-icons">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <rect x="1" y="10" width="3" height="5" rx="0.5" fill="#0f172a" />
                  <rect x="6" y="7" width="3" height="8" rx="0.5" fill="#0f172a" />
                  <rect x="11" y="3" width="3" height="12" rx="0.5" fill="#0f172a" />
                </svg>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path d="M8 3c-1.66 0-3.08.69-4.12 1.78l.7.72A4.97 4.97 0 018 4c1.38 0 2.63.56 3.54 1.46l.7-.71A5.97 5.97 0 008 3z" fill="#0f172a" />
                  <path d="M10.83 7.17A3.98 3.98 0 008 6c-1.1 0-2.08.45-2.83 1.17l.71.71A2.99 2.99 0 018 7c.83 0 1.58.34 2.12.88l.71-.71z" fill="#0f172a" />
                  <circle cx="8" cy="11" r="2" fill="#0f172a" />
                </svg>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <rect x="1" y="5" width="2" height="6" rx="0.5" fill="#0f172a" />
                  <rect x="5" y="3" width="2" height="8" rx="0.5" fill="#0f172a" />
                  <rect x="9" y="1" width="2" height="10" rx="0.5" fill="#0f172a" />
                  <rect x="13" y="6" width="1.5" height="4" rx="0.5" fill="#0f172a" />
                </svg>
              </div>
            </div>

            <!-- Header with Back -->
            <div class="more-header more-header-back">
              <button class="more-back-btn" onclick="navigateTo('more')">
                <img src="../../assets/svg_icons/back.svg" width="24" alt="">
              </button>
              <h1 class="more-title">Personal Goals</h1>
            </div>

            <!-- Scrollable Content -->
            <div class="more-scroll-wrapper">
              <p class="more-section-desc">Update your outcome targets. Changes may affect your plan recommendations.</p>

              <!-- Primary Goal -->
              <div class="more-form-group">
                <label class="more-form-label">Primary Goal</label>
                <div class="more-option-cards" id="goalOptions">
                  <button class="more-option-card" data-value="Lose Weight">Lose Weight</button>
                  <button class="more-option-card" data-value="Build Muscle">Build Muscle</button>
                  <button class="more-option-card" data-value="Maintain Fitness">Maintain Fitness</button>
                  <button class="more-option-card" data-value="Improve Health">Improve Health</button>
                  <button class="more-option-card" data-value="Increase Strength">Increase Strength</button>
                </div>
              </div>

              <!-- Target Weight -->
              <div class="more-form-group">
                <label class="more-form-label">Target Weight (kg)</label>
                <div class="more-text-input-wrap">
                  <input type="number" class="more-text-input" id="targetWeightInput" placeholder="e.g. 70" step="0.1" min="30" max="300">
                </div>
              </div>

              <!-- Goal Pace -->
              <div class="more-form-group">
                <label class="more-form-label">Goal Pace</label>
                <div class="more-pace-slider-wrap">
                  <input type="range" class="more-pace-slider" id="paceSlider" min="0" max="3" step="1" value="1">
                  <div class="more-pace-labels">
                    <span>Slow</span>
                    <span>Moderate</span>
                    <span>Fast</span>
                    <span>Aggressive</span>
                  </div>
                </div>
              </div>

              <!-- Motivation -->
              <div class="more-form-group">
                <label class="more-form-label">Motivation</label>
                <div class="more-option-cards more-option-cards-multi" id="motivationOptions">
                  <button class="more-option-card" data-value="Look Better">Look Better</button>
                  <button class="more-option-card" data-value="Feel Healthier">Feel Healthier</button>
                  <button class="more-option-card" data-value="Build Confidence">Build Confidence</button>
                  <button class="more-option-card" data-value="Sports Performance">Sports Performance</button>
                  <button class="more-option-card" data-value="Longevity">Longevity</button>
                </div>
              </div>

              <!-- Activity Priority -->
              <div class="more-form-group">
                <label class="more-form-label">Activity Priority</label>
                <div class="more-option-cards" id="activityPriorityOptions">
                  <button class="more-option-card" data-value="Strength">Strength</button>
                  <button class="more-option-card" data-value="Cardio">Cardio</button>
                  <button class="more-option-card" data-value="Mobility">Mobility</button>
                  <button class="more-option-card" data-value="General Fitness">General Fitness</button>
                </div>
              </div>

              <!-- Save Button -->
              <button class="more-save-btn" id="saveGoalsBtn">Save Changes</button>

              <div class="more-bottom-spacer"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Plan Apply Dialog -->
  <div class="more-dialog" id="planApplyDialog">
    <div class="more-dialog-backdrop"></div>
    <div class="more-dialog-content">
      <h3 class="more-dialog-title">Apply Updated Plan?</h3>
      <p class="more-dialog-text">Your goal changes may affect workouts, nutrition targets, and coach advice. When would you like to apply the new plan?</p>
      <div class="more-dialog-actions more-dialog-actions-vertical">
        <button class="more-dialog-btn more-dialog-btn-primary" onclick="applyPlanNow()">Apply Now</button>
        <button class="more-dialog-btn more-dialog-btn-secondary" onclick="applyPlanNextWeek()">Apply Next Week</button>
      </div>
    </div>
  </div>

  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <script src="../../app.js?v=5"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const state = window.__strivio_state;

      // Initialize goal options
      const goalCards = document.querySelectorAll('#goalOptions .more-option-card');
      goalCards.forEach(card => {
        if (state.goals && state.goals.includes(card.dataset.value)) {
          card.classList.add('selected');
        }
        card.addEventListener('click', function() {
          document.querySelectorAll('#goalOptions .more-option-card').forEach(c => c.classList.remove('selected'));
          this.classList.add('selected');
        });
      });

      // Initialize target weight
      if (state.targetWeight) {
        document.getElementById('targetWeightInput').value = state.targetWeight;
      }

      // Initialize pace slider
      const paceValues = [0.25, 0.5, 1.0, 1.5];
      const paceSlider = document.getElementById('paceSlider');
      const currentPaceIndex = paceValues.indexOf(state.pace);
      if (currentPaceIndex !== -1) {
        paceSlider.value = currentPaceIndex;
      }

      // Initialize motivation options
      const motCards = document.querySelectorAll('#motivationOptions .more-option-card');
      motCards.forEach(card => {
        if (state.motivations && state.motivations.includes(card.dataset.value)) {
          card.classList.add('selected');
        }
        card.addEventListener('click', function() {
          this.classList.toggle('selected');
        });
      });

      // Initialize activity priority
      const actCards = document.querySelectorAll('#activityPriorityOptions .more-option-card');
      actCards.forEach(card => {
        if (state.activityPriority === card.dataset.value) {
          card.classList.add('selected');
        }
        card.addEventListener('click', function() {
          document.querySelectorAll('#activityPriorityOptions .more-option-card').forEach(c => c.classList.remove('selected'));
          this.classList.add('selected');
        });
      });

      // Save button
      document.getElementById('saveGoalsBtn').addEventListener('click', function() {
        const selectedGoal = document.querySelector('#goalOptions .more-option-card.selected');
        if (selectedGoal) {
          state.goals = [selectedGoal.dataset.value];
        }
        state.targetWeight = parseFloat(document.getElementById('targetWeightInput').value) || null;
        state.pace = paceValues[parseInt(paceSlider.value)];
        state.motivations = Array.from(document.querySelectorAll('#motivationOptions .more-option-card.selected')).map(c => c.dataset.value);
        const selectedActivity = document.querySelector('#activityPriorityOptions .more-option-card.selected');
        if (selectedActivity) {
          state.activityPriority = selectedActivity.dataset.value;
        }

        // Show plan apply dialog
        document.getElementById('planApplyDialog').classList.add('more-dialog-active');
      });
    });

    function applyPlanNow() {
      document.getElementById('planApplyDialog').classList.remove('more-dialog-active');
      navigateTo('more');
    }

    function applyPlanNextWeek() {
      document.getElementById('planApplyDialog').classList.remove('more-dialog-active');
      navigateTo('more');
    }
  </script>
</body>

</html>
