<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Profile Overview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=5">
</head>

<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <div class="screen screen-more-profile active" data-screen="more-profile">
          <div class="more-content">
            <div class="status-bar">
              <span class="status-time">9:41</span>
              <div class="status-icons">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="10" width="3" height="5" rx="0.5" fill="#0f172a" /><rect x="6" y="7" width="3" height="8" rx="0.5" fill="#0f172a" /><rect x="11" y="3" width="3" height="12" rx="0.5" fill="#0f172a" /></svg>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3c-1.66 0-3.08.69-4.12 1.78l.7.72A4.97 4.97 0 018 4c1.38 0 2.63.56 3.54 1.46l.7-.71A5.97 5.97 0 008 3z" fill="#0f172a" /><path d="M10.83 7.17A3.98 3.98 0 008 6c-1.1 0-2.08.45-2.83 1.17l.71.71A2.99 2.99 0 018 7c.83 0 1.58.34 2.12.88l.71-.71z" fill="#0f172a" /><circle cx="8" cy="11" r="2" fill="#0f172a" /></svg>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="5" width="2" height="6" rx="0.5" fill="#0f172a" /><rect x="5" y="3" width="2" height="8" rx="0.5" fill="#0f172a" /><rect x="9" y="1" width="2" height="10" rx="0.5" fill="#0f172a" /><rect x="13" y="6" width="1.5" height="4" rx="0.5" fill="#0f172a" /></svg>
              </div>
            </div>

            <div class="more-header more-header-back">
              <button class="more-back-btn" onclick="navigateTo('more')">
                <img src="../../assets/svg_icons/back.svg" width="24" alt="">
              </button>
              <h1 class="more-title">Profile Overview</h1>
            </div>

            <div class="more-scroll-wrapper">
              <!-- Profile Card -->
              <div class="more-profile-detail-card">
                <div class="more-profile-detail-avatar">
                  <img src="../../assets/img/profile.jpg" alt="Profile">
                  <button class="more-profile-edit-avatar">
                    <img src="../../assets/svg_icons/edit.svg" width="16" alt="">
                  </button>
                </div>
                <h2 class="more-profile-detail-name" id="profileName">Mike Michel</h2>
                <p class="more-profile-detail-email">mike.michel@email.com</p>
              </div>

              <!-- Profile Fields -->
              <div class="more-profile-fields">
                <div class="more-profile-field">
                  <span class="more-profile-field-label">Name</span>
                  <input type="text" class="more-profile-field-input" id="editName" value="Mike Michel">
                </div>
                <div class="more-profile-field">
                  <span class="more-profile-field-label">Age</span>
                  <input type="number" class="more-profile-field-input" id="editAge" value="28" min="14" max="100">
                </div>
                <div class="more-profile-field">
                  <span class="more-profile-field-label">Weight (kg)</span>
                  <input type="number" class="more-profile-field-input" id="editWeight" value="78.2" step="0.1" min="30" max="300">
                </div>
                <div class="more-profile-field">
                  <span class="more-profile-field-label">Goal</span>
                  <span class="more-profile-field-value" id="profileGoal">Lose Weight</span>
                </div>
                <div class="more-profile-field">
                  <span class="more-profile-field-label">Coach</span>
                  <span class="more-profile-field-value" id="profileCoach">Marcus</span>
                </div>
                <div class="more-profile-field">
                  <span class="more-profile-field-label">Membership</span>
                  <span class="more-profile-field-value more-profile-field-premium">Free</span>
                </div>
              </div>

              <button class="more-save-btn" id="saveProfileBtn">Save Changes</button>

              <div class="more-bottom-spacer"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="../../app.js?v=5"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const state = window.__strivio_state;
      if (state.name) {
        document.getElementById('editName').value = state.name;
        document.getElementById('profileName').textContent = state.name;
      }
      if (state.age) document.getElementById('editAge').value = state.age;
      if (state.weight) document.getElementById('editWeight').value = state.weight;
      if (state.goals && state.goals.length) document.getElementById('profileGoal').textContent = state.goals[0];
      if (state.coach) document.getElementById('profileCoach').textContent = state.coach;

      document.getElementById('saveProfileBtn').addEventListener('click', function() {
        state.name = document.getElementById('editName').value;
        state.age = parseInt(document.getElementById('editAge').value);
        state.weight = parseFloat(document.getElementById('editWeight').value);
        navigateTo('more');
      });
    });
  </script>
</body>

</html>
