<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Create Custom Meal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper">
        <div class="screen screen-create-meal active">
          <div class="create-header">
            <button class="back-btn" onclick="navigateTo('custom-meals-list')">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2"><polyline points="15,18 9,12 15,6"></polyline></svg>
            </button>
            <span class="create-title">Create Custom Meal</span>
            <div style="width:40px"></div>
          </div>
          <div class="create-content">
            <div class="form-group">
              <label class="form-label">Meal Name</label>
              <input type="text" class="form-input-lg" placeholder="e.g., Morning Smoothie" value="">
            </div>
            <button class="btn-continue" onclick="navigateTo('add-foods-custom')">Continue</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
  <style>
    .screen-create-meal { background:#F5F6FA; display:flex; flex-direction:column; height:100%; }
    .create-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:white; border-bottom:1px solid #F4F4F4; }
    .create-title { font-family:'Nunito',sans-serif; font-size:18px; font-weight:600; color:#0f172a; }
    .create-content { flex:1; padding:32px 20px; }
    .form-group { margin-bottom:24px; }
    .form-label { font-family:'Inter',sans-serif; font-size:13px; font-weight:500; color:#64748b; margin-bottom:10px; display:block; }
    .form-input-lg { width:100%; height:56px; background:white; border:1px solid #E5E7EB; border-radius:14px; padding:0 16px; font-family:'Inter',sans-serif; font-size:16px; color:#0f172a; outline:none; }
    .form-input-lg:focus { border-color:#0056D8; }
    .btn-continue { width:100%; height:56px; background:#0056D8; border:none; border-radius:9999px; color:white; font-family:'Inter',sans-serif; font-size:16px; font-weight:600; cursor:pointer; margin-top:20px; }
    .btn-continue:active { transform:scale(0.98); background:#3B82F6; }
  </style>
</body>
</html>
