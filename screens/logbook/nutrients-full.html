<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio - Daily Nutrients</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=8">
</head>

<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <div class="screen screen-nutrients-full active" data-screen="nutrients-full">
          <div class="status-bar nutrients-status-bar">
            <span class="status-time">9:41</span>
            <div class="status-icons">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="10" width="3" height="5" rx="0.5" fill="#0f172a" />
                <rect x="6" y="7" width="3" height="8" rx="0.5" fill="#0f172a" />
                <rect x="11" y="3" width="3" height="12" rx="0.5" fill="#0f172a" />
              </svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path
                  d="M8 3c-1.66 0-3.08.69-4.12 1.78l.7.72A4.97 4.97 0 018 4c1.38 0 2.63.56 3.54 1.46l.7-.71A5.97 5.97 0 008 3z"
                  fill="#0f172a" />
                <path
                  d="M10.83 7.17A3.98 3.98 0 008 6c-1.1 0-2.08.45-2.83 1.17l.71.71A2.99 2.99 0 018 7c.83 0 1.58.34 2.12.88l.71-.71z"
                  fill="#0f172a" />
                <circle cx="8" cy="11" r="2" fill="#0f172a" />
              </svg>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="5" width="2" height="6" rx="0.5" fill="#0f172a" />
                <rect x="5" y="3" width="2" height="8" rx="0.5" fill="#0f172a" />
                <rect x="9" y="1" width="2" height="10" rx="0.5" fill="#0f172a" />
                <rect x="13" y="6" width="1.5" height="4" rx="0.5" fill="#0f172a" />
              </svg>
            </div>
          </div>

          <header class="nl-header nf-header">
            <button class="nl-back" type="button" onclick="navigateTo('logbook')" aria-label="Go back">
              <span class="icon icon-default" style="--icon-url: url('../../assets/svg_icons/back.svg'); width: 24px; height: 24px;"></span>
            </button>
            <h1>Daily Nutrients</h1>
          </header>

          <main class="nf-content">
            <section class="nf-summary-card" aria-labelledby="nfSummaryTitle">
              <div class="nf-summary-copy">
                <p class="nf-summary-label">Premium Breakdown</p>
                <h2 id="nfSummaryTitle">Micronutrients vs RDV</h2>
                <p class="nf-summary-desc">Grouped by category and sorted to surface the lowest coverage first.</p>
              </div>
              <div class="nf-summary-stats" aria-label="Nutrient summary">
                <article>
                  <strong>13</strong>
                  <span>Tracked</span>
                </article>
                <article>
                  <strong>4</strong>
                  <span>Low</span>
                </article>
                <article>
                  <strong>1</strong>
                  <span>High</span>
                </article>
              </div>
            </section>

            <section class="nf-toolbar" aria-label="Sort nutrients">
              <div class="nf-sort-pills" id="nfSortPills">
                <button class="nf-sort-pill active" type="button" data-sort="low">Lowest RDV</button>
                <button class="nf-sort-pill" type="button" data-sort="high">Highest RDV</button>
                <button class="nf-sort-pill" type="button" data-sort="alpha">A-Z</button>
              </div>
              <div class="nf-legend" aria-label="Coverage legend">
                <span><i class="is-low"></i>Low</span>
                <span><i class="is-mid"></i>Partial</span>
                <span><i class="is-good"></i>Met</span>
                <span><i class="is-high"></i>High</span>
              </div>
            </section>

            <section class="nf-sections" id="nfSections"></section>
            <div class="nf-bottom-spacer" aria-hidden="true"></div>
          </main>
        </div>

      </div>
    </div>
  </div>

  <script>
    (function() {
      const nutrients = [
        { name: 'Vitamin D', category: 'Vitamins', intake: 6, target: 15, unit: 'mcg', percent: 40 },
        { name: 'Vitamin E', category: 'Vitamins', intake: 6.8, target: 15, unit: 'mg', percent: 45 },
        { name: 'Folate', category: 'Vitamins', intake: 180, target: 400, unit: 'mcg', percent: 45 },
        { name: 'Vitamin C', category: 'Vitamins', intake: 58, target: 90, unit: 'mg', percent: 64 },
        { name: 'Vitamin A', category: 'Vitamins', intake: 680, target: 900, unit: 'mcg', percent: 76 },
        { name: 'Vitamin B12', category: 'Vitamins', intake: 2.5, target: 2.4, unit: 'mcg', percent: 104 },
        { name: 'Iron', category: 'Minerals', intake: 7.6, target: 18, unit: 'mg', percent: 42 },
        { name: 'Magnesium', category: 'Minerals', intake: 230, target: 400, unit: 'mg', percent: 58 },
        { name: 'Potassium', category: 'Minerals', intake: 2300, target: 3400, unit: 'mg', percent: 68 },
        { name: 'Calcium', category: 'Minerals', intake: 740, target: 1000, unit: 'mg', percent: 74 },
        { name: 'Zinc', category: 'Minerals', intake: 8.4, target: 11, unit: 'mg', percent: 76 },
        { name: 'Fiber', category: 'Other', intake: 18, target: 28, unit: 'g', percent: 64 },
        { name: 'Saturated Fat', category: 'Other', intake: 12, target: 20, unit: 'g', percent: 60 },
        { name: 'Sugar', category: 'Other', intake: 35, target: 50, unit: 'g', percent: 70 },
        { name: 'Sodium', category: 'Other', intake: 1840, target: 2300, unit: 'mg', percent: 80 }
      ];

      const categories = ['Vitamins', 'Minerals', 'Other'];
      const labels = {
        low: 'Lowest RDV',
        high: 'Highest RDV',
        alpha: 'A-Z'
      };

      function getStatus(percent) {
        if (percent > 100) return 'high';
        if (percent >= 80) return 'good';
        if (percent >= 50) return 'mid';
        return 'low';
      }

      function formatValue(value, unit) {
        return Number.isInteger(value) ? value + unit : value.toFixed(1).replace(/\\.0$/, '') + unit;
      }

      function sortItems(items, sortKey) {
        const copy = items.slice();
        if (sortKey === 'high') {
          copy.sort((a, b) => b.percent - a.percent || a.name.localeCompare(b.name));
        } else if (sortKey === 'alpha') {
          copy.sort((a, b) => a.name.localeCompare(b.name));
        } else {
          copy.sort((a, b) => a.percent - b.percent || a.name.localeCompare(b.name));
        }
        return copy;
      }

      function renderSections(sortKey) {
        const root = document.getElementById('nfSections');
        if (!root) return;

        root.innerHTML = categories.map(category => {
          const items = sortItems(nutrients.filter(item => item.category === category), sortKey);
          return `
            <section class="nf-section-card" aria-labelledby="section-${category}">
              <div class="nf-section-head">
                <h3 id="section-${category}">${category}</h3>
                <span>${labels[sortKey]}</span>
              </div>
              <div class="nf-list">
                ${items.map(item => {
                  const status = getStatus(item.percent);
                  return `
                    <article class="nf-item">
                      <div class="nf-item-main">
                        <div class="nf-item-copy">
                          <strong>${item.name}</strong>
                          <span>${formatValue(item.intake, item.unit)} / ${formatValue(item.target, item.unit)} RDV</span>
                        </div>
                        <b class="nf-percent is-${status}">${item.percent}%</b>
                      </div>
                      <div class="nf-bar-track" aria-hidden="true">
                        <i class="is-${status}" style="width:${Math.min(item.percent, 100)}%"></i>
                      </div>
                    </article>
                  `;
                }).join('')}
              </div>
            </section>
          `;
        }).join('');
      }

      function setActiveSort(sortKey) {
        document.querySelectorAll('.nf-sort-pill').forEach(button => {
          button.classList.toggle('active', button.dataset.sort === sortKey);
        });
        renderSections(sortKey);
      }

      document.addEventListener('DOMContentLoaded', function() {
        const scroller = document.querySelector('.nf-content');
        if (scroller) scroller.scrollTop = 0;
        renderSections('low');
        document.querySelectorAll('.nf-sort-pill').forEach(button => {
          button.addEventListener('click', function() {
            setActiveSort(button.dataset.sort);
          });
        });
      });
    })();
  </script>
  <script src="../../app.js?v=8"></script>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
</body>

</html>
