<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio - Food Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=17">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">
        <div class="screen screen-meal-list active" data-screen="add-food-home">
          <section class="meal-food-library meal-food-page" id="mealFoodLibrary" data-view="list" data-tab="library" aria-label="Food Library">
            <div class="status-bar">
              <span class="status-time">9:41</span>
              <div class="status-icons">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="10" width="3" height="5" rx="0.5" fill="#0f172a"/><rect x="6" y="7" width="3" height="8" rx="0.5" fill="#0f172a"/><rect x="11" y="3" width="3" height="12" rx="0.5" fill="#0f172a"/></svg>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3c-1.66 0-3.08.69-4.12 1.78l.7.72A4.97 4.97 0 018 4c1.38 0 2.63.56 3.54 1.46l.7-.71A5.97 5.97 0 008 3z" fill="#0f172a"/><path d="M10.83 7.17A3.98 3.98 0 008 6c-1.1 0-2.08.45-2.83 1.17l.71.71A2.99 2.99 0 018 7c.83 0 1.58.34 2.12.88l.71-.71z" fill="#0f172a"/><circle cx="8" cy="11" r="2" fill="#0f172a"/></svg>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1" y="5" width="2" height="6" rx="0.5" fill="#0f172a"/><rect x="5" y="3" width="2" height="8" rx="0.5" fill="#0f172a"/><rect x="9" y="1" width="2" height="10" rx="0.5" fill="#0f172a"/><rect x="13" y="6" width="1.5" height="4" rx="0.5" fill="#0f172a"/></svg>
              </div>
            </div>

            <div class="meal-library-list-view" id="mealLibraryListView">
              <header class="meal-detail-topbar">
                <button class="meal-detail-nav-btn" type="button" onclick="navigateTo('meal-detail')" aria-label="Close food library">
                  <span class="icon" style="--icon-url: url('../../assets/svg_icons/cross-x.svg'); width: 24px; height: 24px;"></span>
                </button>
                <h1>Food Library</h1>
              </header>

              <div class="meal-library-controls">
                <label class="meal-library-search">
                  <img src="../../assets/svg_icons/search.svg" alt="">
                  <input id="mealLibrarySearch" type="search" placeholder="Search food..." autocomplete="off" aria-label="Search food">
                  <button class="meal-library-search-clear" id="mealLibrarySearchClear" type="button" aria-label="Clear search" hidden>
                    <img src="../../assets/svg_icons/cross-x.svg" alt="">
                  </button>
                </label>

                <div class="meal-library-tabs" role="tablist" aria-label="Food source">
                  <button type="button" class="active" data-library-tab="library">Library</button>
                  <button type="button" data-library-tab="favorites">Favorites</button>
                  <button type="button" data-library-tab="meals">My Meals</button>
                </div>

                <div class="meal-library-chips" id="mealLibraryChips" aria-label="Food categories"></div>
              </div>

              <div class="meal-library-results" id="mealLibraryResults"></div>
              <div class="meal-library-empty" id="mealLibraryEmpty" hidden>
                <img src="../../assets/svg_icons/not-found-alt.svg" alt="">
                <h3 id="mealLibraryEmptyTitle">No foods found.</h3>
                <p id="mealLibraryEmptyText">Try checking your spelling or using broader keywords like Chicken or Salad.</p>
              </div>
            </div>

            <div class="meal-library-detail-view" id="mealLibraryDetailView" hidden>
              <main class="meal-library-detail-scroll">
                <header class="meal-detail-topbar">
                  <button class="meal-detail-nav-btn" type="button" id="mealLibraryDetailBack" aria-label="Back to food library">
                    <span class="icon icon-default" style="--icon-url: url('../../assets/svg_icons/back.svg'); width: 24px; height: 24px;"></span>
                  </button>
                  <h1>Meal Details</h1>
                  <button class="meal-detail-nav-btn" type="button" id="mealLibraryDetailFavorite" aria-label="Favorite food">
                    <svg viewBox="0 0 24 24" fill="none" width="20" height="20">
                      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </header>

                <img class="meal-library-detail-hero" id="mealLibraryDetailHero" src="https://images.unsplash.com/photo-1473093295043-cdd812d0d0f?auto=format&fit=crop&w=900&q=80" alt="">

                <section class="meal-detail-summary">
                  <div class="meal-detail-summary-copy">
                    <h2 id="mealLibraryDetailName">Banana</h2>
                    <p id="mealLibraryDetailMeta">Generic &middot; 70 kcal/serving</p>
                  </div>
                  <span class="meal-detail-health-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </span>
                </section>

                <section class="meal-detail-section">
                  <h3>Nutrition</h3>
                  <div class="meal-detail-list-card">
                    <div class="meal-detail-list-row">
                      <span>Calories</span>
                      <strong id="mealLibraryDetailCalories">70 kcal</strong>
                    </div>
                    <div class="meal-detail-list-row">
                      <span>Protein</span>
                      <span><em id="mealLibraryProtein">1g</em></span>
                    </div>
                    <div class="meal-detail-list-row">
                      <span>Carbs</span>
                      <span><em id="mealLibraryCarbs">18g</em></span>
                    </div>
                    <div class="meal-detail-list-row">
                      <span>Fat</span>
                      <span><em id="mealLibraryFat">0g</em></span>
                    </div>
                  </div>
                </section>

                <section class="meal-detail-section">
                  <h3>Assign to Meal</h3>
                  <div class="meal-detail-chip-row" id="mealLibraryMealChips">
                    <button type="button" class="meal-detail-chip active" data-assign-meal="Snacks"><span class="meal-chip-icon" style="--meal-chip-icon: url('../../assets/svg_icons/snack.svg')" aria-hidden="true"></span>Snacks</button>
                    <button type="button" class="meal-detail-chip" data-assign-meal="Breakfast"><span class="meal-chip-icon" style="--meal-chip-icon: url('../../assets/svg_icons/morning.svg')" aria-hidden="true"></span>Breakfast</button>
                    <button type="button" class="meal-detail-chip" data-assign-meal="Lunch"><span class="meal-chip-icon" style="--meal-chip-icon: url('../../assets/svg_icons/day.svg')" aria-hidden="true"></span>Lunch</button>
                    <button type="button" class="meal-detail-chip" data-assign-meal="Dinner"><span class="meal-chip-icon" style="--meal-chip-icon: url('../../assets/svg_icons/night.svg')" aria-hidden="true"></span>Dinner</button>
                  </div>
                </section>

                <section class="meal-detail-section">
                  <h3>Serving Size</h3>
                  <div class="meal-detail-chip-row" id="mealLibraryServingChips">
                    <button type="button" class="meal-detail-chip active" data-serving="1 serving">1 serving</button>
                    <button type="button" class="meal-detail-chip" data-serving="100g">100g</button>
                    <button type="button" class="meal-detail-chip" data-serving="1 Bowl">1 Bowl</button>
                    <button type="button" class="meal-detail-chip" data-serving="Custom">Custom</button>
                  </div>
                    <div class="meal-library-custom-serving" id="mealLibraryCustomServing" hidden>
                      <label>
                        <span>Amount</span>
                        <input id="mealLibraryCustomAmount" type="number" min="1" step="1" value="150" inputmode="decimal">
                      </label>
                      <div class="meal-detail-chip-row" id="mealLibraryCustomUnits" aria-label="Custom serving unit">
                        <button type="button" class="meal-detail-chip active" data-custom-unit="g">g</button>
                        <button type="button" class="meal-detail-chip" data-custom-unit="oz">oz</button>
                        <button type="button" class="meal-detail-chip" data-custom-unit="cup">cup</button>
                        <button type="button" class="meal-detail-chip" data-custom-unit="serving">serving</button>
                      </div>
                    </div>
                </section>
              </main>

              <footer class="meal-library-logbar">
                <div class="meal-library-stepper">
                  <button type="button" id="mealLibraryMinus" aria-label="Decrease quantity">-</button>
                  <strong id="mealLibraryQty">1</strong>
                  <button type="button" id="mealLibraryPlus" aria-label="Increase quantity">+</button>
                </div>
                <button type="button" id="mealLibraryLogBtn">Log to Snacks</button>
              </footer>
            </div>

            <div class="meal-library-snackbar" id="mealLibrarySnackbar" role="status" aria-live="polite" hidden>
              <span id="mealLibrarySnackbarText">Added to Snacks</span>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script src="../../app.js?v=16"></script>
  <script>
    (function() {
      const healthIcon = '<svg viewBox="0 0 24 24" fill="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 1 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const genericFoodPhoto = 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=900&q=80';
      const baseFoods = [
        { id: 'oatmeal', name: 'Oatmeal (1 bowl)', meta: 'P 12g · C 55g · F 8g', kcal: 350, category: 'Oatmeal', image: 'https://images.unsplash.com/photo-1517673400267-0251440c45dc?auto=format&fit=crop&w=900&q=80', fallback: genericFoodPhoto },
        { id: 'greek-yogurt', name: 'Greek Yogurt (1 cup)', meta: 'P 20g · C 10g · F 0g', kcal: 120, category: 'Yogurt', favorite: true, image: 'https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=900&q=80', fallback: genericFoodPhoto },
        { id: 'avocado-toast', name: 'Avocado Toast (1 slice)', meta: 'P 5g · C 20g · F 15g', kcal: 250, category: 'Salad', image: 'https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=900&q=80', fallback: genericFoodPhoto },
        { id: 'berry-smoothie', name: 'Berry Smoothie (12 oz)', meta: 'P 8g · C 35g · F 2g', kcal: 180, category: 'Banana', image: 'https://images.unsplash.com/photo-1505252585461-04db1eb84625?auto=format&fit=crop&w=900&q=80', fallback: genericFoodPhoto },
        { id: 'greek-parfait', name: 'Greek Yogurt Parfait', meta: 'P 12g · C 25g · F 5g', kcal: 210, category: 'Yogurt', tab: 'meals', favorite: true, image: 'https://images.unsplash.com/photo-1490474418585-ba9bad8fd0ea?auto=format&fit=crop&w=900&q=80', fallback: genericFoodPhoto },
        { id: 'almond-banana-wrap', name: 'Almond Butter Banana Wrap', meta: 'P 6g · C 30g · F 14g', kcal: 290, category: 'Banana', tab: 'meals', image: 'https://images.unsplash.com/photo-1482049016688-2d3e1b311543?auto=format&fit=crop&w=900&q=80', fallback: genericFoodPhoto },
        { id: 'chia-pudding', name: 'Chia Seed Pudding', meta: 'P 7g · C 18g · F 12g', kcal: 220, category: 'Core', tab: 'meals', image: 'https://images.unsplash.com/photo-1511690743698-d9d85f2fbf38?auto=format&fit=crop&w=900&q=80', fallback: genericFoodPhoto }
      ];
      let foods = [];
      const favorites = new Set(baseFoods.filter(function(food) { return food.favorite; }).map(function(food) { return food.id; }));
      const library = document.getElementById('mealFoodLibrary');
      const input = document.getElementById('mealLibrarySearch');
      const clearButton = document.getElementById('mealLibrarySearchClear');
      const chipsEl = document.getElementById('mealLibraryChips');
      const resultsEl = document.getElementById('mealLibraryResults');
      const emptyEl = document.getElementById('mealLibraryEmpty');
      const listView = document.getElementById('mealLibraryListView');
      const detailView = document.getElementById('mealLibraryDetailView');
      const customServing = document.getElementById('mealLibraryCustomServing');
      const snackbar = document.getElementById('mealLibrarySnackbar');
      const snackbarText = document.getElementById('mealLibrarySnackbarText');
      let activeTab = 'library';
      let activeChip = 'All';
      let query = '';
      let selectedFood = null;
      let assignedMeal = 'Snacks';
      let servingSize = '1 serving';
      let customUnit = 'g';
      let quantity = 1;
      let snackbarTimer = null;

      function pickManualFoodPhoto(name) {
        const normalized = String(name || '').toLowerCase();
        if (normalized.indexOf('toast') >= 0 || normalized.indexOf('avocado') >= 0) return 'https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=900&q=80';
        if (normalized.indexOf('yogurt') >= 0 || normalized.indexOf('parfait') >= 0) return 'https://images.unsplash.com/photo-1490474418585-ba9bad8fd0ea?auto=format&fit=crop&w=900&q=80';
        if (normalized.indexOf('smoothie') >= 0) return 'https://images.unsplash.com/photo-1505252585461-04db1eb84625?auto=format&fit=crop&w=900&q=80';
        if (normalized.indexOf('oat') >= 0 || normalized.indexOf('porridge') >= 0) return 'https://images.unsplash.com/photo-1517673400267-0251440c45dc?auto=format&fit=crop&w=900&q=80';
        if (normalized.indexOf('chia') >= 0 || normalized.indexOf('pudding') >= 0) return 'https://images.unsplash.com/photo-1511690743698-d9d85f2fbf38?auto=format&fit=crop&w=900&q=80';
        return genericFoodPhoto;
      }

      function readCustomMeals() {
        try {
          const parsed = JSON.parse(localStorage.getItem('strivio_custom_meals') || '[]');
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return [];
        }
      }

      function mapCustomMeal(saved) {
        const protein = Number(saved.protein) || 0;
        const carbs = Number(saved.carbs) || 0;
        const fat = Number(saved.fat) || 0;
        const servingLabel = (saved.servingAmount || '1') + ' ' + (saved.servingUnit || 'Serving');
        return {
          id: saved.id || ('manual-' + Date.now()),
          name: (saved.name || 'Custom Food') + ' (' + servingLabel + ')',
          meta: 'P ' + protein + 'g · C ' + carbs + 'g · F ' + fat + 'g',
          kcal: Number(saved.kcal) || 0,
          category: 'Custom',
          tab: 'meals',
          image: saved.image || pickManualFoodPhoto(saved.name),
          fallback: genericFoodPhoto
        };
      }

      function refreshFoods() {
        foods = readCustomMeals().map(mapCustomMeal).concat(baseFoods);
        if (!selectedFood && foods.length) selectedFood = foods[0];
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, function(char) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char];
        });
      }

      function imageErrorAttr(fallback) {
        return "this.onerror=null;this.src='" + fallback + "';";
      }

      function plainName(food) {
        return food.name.replace(/\s*\([^)]*\)/g, '');
      }

      function parseMacro(food, label) {
        const match = food.meta.match(new RegExp(label + '\\s+(\\d+)g', 'i'));
        return match ? Number(match[1]) : 0;
      }

      function showListView() {
        library.dataset.view = 'list';
        listView.hidden = false;
        detailView.hidden = true;
      }

      function showDetailView(food) {
        selectedFood = food;
        assignedMeal = 'Snacks';
        servingSize = '1 serving';
        customUnit = 'g';
        quantity = 1;
        library.dataset.view = 'detail';
        listView.hidden = true;
        detailView.hidden = false;
        renderDetail();
      }

      function renderDetail() {
        const protein = parseMacro(selectedFood, 'P');
        const carbs = parseMacro(selectedFood, 'C');
        const fat = parseMacro(selectedFood, 'F');
        document.getElementById('mealLibraryDetailHero').src = selectedFood.image;
        document.getElementById('mealLibraryDetailHero').onerror = function() {
          this.onerror = null;
          this.src = selectedFood.fallback;
        };
        document.getElementById('mealLibraryDetailHero').alt = plainName(selectedFood);
        document.getElementById('mealLibraryDetailName').textContent = plainName(selectedFood);
        document.getElementById('mealLibraryDetailMeta').innerHTML = 'Generic &middot; ' + selectedFood.kcal + ' kcal/serving';
        document.getElementById('mealLibraryDetailCalories').textContent = (selectedFood.kcal * quantity) + ' kcal';
        document.getElementById('mealLibraryProtein').textContent = (protein * quantity) + 'g';
        document.getElementById('mealLibraryCarbs').textContent = (carbs * quantity) + 'g';
        document.getElementById('mealLibraryFat').textContent = (fat * quantity) + 'g';
        document.getElementById('mealLibraryDetailFavorite').classList.toggle('active', favorites.has(selectedFood.id));
        document.getElementById('mealLibraryQty').textContent = quantity;
        document.getElementById('mealLibraryMinus').disabled = quantity <= 1;
        document.getElementById('mealLibraryLogBtn').textContent = 'Log to ' + assignedMeal;
        customServing.hidden = servingSize !== 'Custom';
        document.querySelectorAll('[data-assign-meal]').forEach(function(chip) {
          chip.classList.toggle('active', chip.dataset.assignMeal === assignedMeal);
        });
        document.querySelectorAll('[data-serving]').forEach(function(chip) {
          chip.classList.toggle('active', chip.dataset.serving === servingSize);
        });
        document.querySelectorAll('[data-custom-unit]').forEach(function(unit) {
          unit.classList.toggle('active', unit.dataset.customUnit === customUnit);
        });
      }

      function showSnackbar(message, callback) {
        clearTimeout(snackbarTimer);
        snackbarText.textContent = message;
        snackbar.hidden = false;
        requestAnimationFrame(function() {
          snackbar.classList.add('show');
        });
        snackbarTimer = setTimeout(function() {
          snackbar.classList.remove('show');
          setTimeout(function() {
            snackbar.hidden = true;
            if (callback) callback();
          }, 180);
        }, 900);
      }

      function restoreManualFood() {
        const raw = sessionStorage.getItem('strivio_manual_food_created');
        refreshFoods();
        if (!raw) return;

        sessionStorage.removeItem('strivio_manual_food_created');

        try {
          const saved = JSON.parse(raw);
          const existing = readCustomMeals();
          if (!existing.some(function(item) { return item.id === saved.id; })) {
            existing.unshift(saved);
            localStorage.setItem('strivio_custom_meals', JSON.stringify(existing));
          }
          refreshFoods();

          activeTab = 'meals';
          activeChip = 'All';
          query = '';
          input.value = '';
          showListView();
          render();
          showSnackbar('New food has added');
        } catch (error) {}
      }

      function applyFoodLibraryFocus() {
        const raw = sessionStorage.getItem('strivio_food_library_focus');
        if (!raw) return;

        sessionStorage.removeItem('strivio_food_library_focus');
        try {
          const focus = JSON.parse(raw);
          refreshFoods();
          if (focus.tab) activeTab = focus.tab;
          render();
          if (focus.foodId) {
            const matched = foods.find(function(food) { return food.id === focus.foodId; });
            if (matched) showDetailView(matched);
          }
        } catch (error) {}
      }

      function logSelectedFood() {
        const customAmount = document.getElementById('mealLibraryCustomAmount').value || '1';
        const displayServing = servingSize === 'Custom' ? customAmount + customUnit : servingSize;
        sessionStorage.setItem('strivio_logged_food', JSON.stringify({
          id: selectedFood.id + '-' + Date.now(),
          name: selectedFood.name,
          detailName: plainName(selectedFood),
          brand: 'Generic',
          meta: selectedFood.meta,
          kcal: selectedFood.kcal * quantity,
          protein: parseMacro(selectedFood, 'P') * quantity,
          carbs: parseMacro(selectedFood, 'C') * quantity,
          fat: parseMacro(selectedFood, 'F') * quantity,
          image: selectedFood.image,
          fallback: selectedFood.fallback,
          assignedMeal: assignedMeal,
          quantity: quantity,
          servingSize: displayServing
        }));
        showSnackbar(plainName(selectedFood) + ' added to ' + assignedMeal, function() {
          navigateTo('meal-detail');
        });
      }

      function matches() {
        return foods.filter(function(food) {
          const tabMatch = activeTab === 'library' || (activeTab === 'favorites' && favorites.has(food.id)) || (activeTab === 'meals' && food.tab === 'meals');
          const chipMatch = activeChip === 'All' || food.category === activeChip || food.name.indexOf(activeChip) >= 0;
          const searchMatch = !query || (food.name + ' ' + food.meta).toLowerCase().indexOf(query.toLowerCase()) >= 0;
          return tabMatch && chipMatch && searchMatch;
        });
      }

      function renderChips() {
        const chips = ['All', 'Oatmeal', 'Banana', 'Chicken', 'Salad', 'Salmon', 'Arms', 'Core'];
        chipsEl.innerHTML = chips.map(function(chip) {
          return '<button type="button" class="' + (chip === activeChip ? 'active' : '') + '" data-library-filter="' + escapeHtml(chip) + '">' + escapeHtml(chip) + '</button>';
        }).join('');
      }

      function render() {
        library.dataset.tab = activeTab;
        document.querySelectorAll('[data-library-tab]').forEach(function(tab) {
          tab.classList.toggle('active', tab.dataset.libraryTab === activeTab);
        });
        renderChips();
        const rows = matches();
        input.closest('.meal-library-search').classList.toggle('has-query', Boolean(query));
        clearButton.hidden = !query;
        resultsEl.hidden = rows.length === 0;
        emptyEl.hidden = rows.length !== 0;
        document.getElementById('mealLibraryEmptyTitle').textContent = activeTab === 'favorites' && !query ? 'You do not have any favorite meals' : (activeTab === 'meals' && !query ? 'You do not have any custom meals' : 'No foods found for "' + (query || activeChip).toLowerCase() + '"');
        resultsEl.innerHTML = rows.map(function(food) {
          return '<article class="meal-library-card">' +
            '<button class="meal-library-card-main" type="button" data-open-food="' + escapeHtml(food.id) + '">' +
              '<img src="' + food.image + '" alt="' + escapeHtml(food.name) + '" onerror="' + imageErrorAttr(food.fallback) + '">' +
              '<span><strong>' + escapeHtml(food.name) + '</strong><em>' + escapeHtml(food.meta) + '</em><b>' + food.kcal + ' kcal</b></span>' +
            '</button>' +
            '<button class="meal-library-favorite ' + (favorites.has(food.id) ? 'active' : '') + '" type="button" data-favorite="' + escapeHtml(food.id) + '" aria-label="Toggle favorite">' + healthIcon + '</button>' +
          '</article>';
        }).join('');
      }

      input.addEventListener('input', function() {
        query = input.value.trim();
        render();
      });
      clearButton.addEventListener('click', function() {
        input.value = '';
        query = '';
        input.focus();
        render();
      });
      document.querySelectorAll('[data-library-tab]').forEach(function(tab) {
        tab.addEventListener('click', function() {
          activeTab = tab.dataset.libraryTab;
          activeChip = 'All';
          render();
        });
      });
      chipsEl.addEventListener('click', function(event) {
        const chip = event.target.closest('[data-library-filter]');
        if (!chip) return;
        activeChip = chip.dataset.libraryFilter;
        render();
      });
      resultsEl.addEventListener('click', function(event) {
        const fav = event.target.closest('[data-favorite]');
        if (fav) {
          if (favorites.has(fav.dataset.favorite)) favorites.delete(fav.dataset.favorite);
          else favorites.add(fav.dataset.favorite);
          render();
          return;
        }
        if (event.target.closest('[data-open-food]')) {
          const openButton = event.target.closest('[data-open-food]');
          const food = foods.find(function(item) {
            return item.id === openButton.dataset.openFood;
          });
          if (food) showDetailView(food);
        }
      });
      document.getElementById('mealLibraryDetailBack').addEventListener('click', function() {
        showListView();
        render();
      });
      document.getElementById('mealLibraryDetailFavorite').addEventListener('click', function() {
        if (favorites.has(selectedFood.id)) favorites.delete(selectedFood.id);
        else favorites.add(selectedFood.id);
        renderDetail();
      });
      document.getElementById('mealLibraryMealChips').addEventListener('click', function(event) {
        const chip = event.target.closest('[data-assign-meal]');
        if (!chip) return;
        assignedMeal = chip.dataset.assignMeal;
        renderDetail();
      });
      document.getElementById('mealLibraryServingChips').addEventListener('click', function(event) {
        const chip = event.target.closest('[data-serving]');
        if (!chip) return;
        servingSize = chip.dataset.serving;
        renderDetail();
      });
      document.getElementById('mealLibraryCustomUnits').addEventListener('click', function(event) {
        const unit = event.target.closest('[data-custom-unit]');
        if (!unit) return;
        customUnit = unit.dataset.customUnit;
        renderDetail();
      });
      document.getElementById('mealLibraryCustomAmount').addEventListener('input', renderDetail);
      document.getElementById('mealLibraryMinus').addEventListener('click', function() {
        quantity = Math.max(1, quantity - 1);
        renderDetail();
      });
      document.getElementById('mealLibraryPlus').addEventListener('click', function() {
        quantity = Math.min(99, quantity + 1);
        renderDetail();
      });
      document.getElementById('mealLibraryLogBtn').addEventListener('click', logSelectedFood);

      refreshFoods();
      render();
      restoreManualFood();
      applyFoodLibraryFocus();
    })();
  </script>
</body>
</html>
