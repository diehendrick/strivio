<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Add Food</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- Screen: Add Food Home -->
        <div class="screen screen-add-food active" data-screen="add-food-home">
          
          <!-- Header -->
          <div class="add-food-header">
            <button class="back-btn" onclick="navigateTo('logbook')" aria-label="Go back">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15,18 9,12 15,6"></polyline>
              </svg>
            </button>
            <h1 class="add-food-title">Add Food</h1>
            <div class="header-spacer"></div>
          </div>

          <div class="add-food-scroll">
            <!-- Search Bar -->
            <div class="search-container">
              <div class="search-bar">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" class="search-input" id="foodSearch" placeholder="Search food..." onkeyup="handleSearch(event)">
                <button class="barcode-btn" onclick="openBarcode()" aria-label="Scan barcode">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7F7CF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                    <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                    <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                    <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Quick Actions Grid -->
            <div class="quick-actions">
              <button class="action-card" onclick="openBarcode()">
                <div class="action-icon barcode-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7F7CF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                    <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                    <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                    <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                  </svg>
                </div>
                <div class="action-content">
                  <div class="action-title">
                    Scan Barcode
                    <span class="action-badge" id="barcodeBadge">
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                      </svg>
                    </span>
                  </div>
                  <span class="action-desc">Instant nutrition data</span>
                </div>
              </button>

              <button class="action-card" onclick="navigateTo('manual-entry')">
                <div class="action-icon manual-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7F7CF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                </div>
                <div class="action-content">
                  <span class="action-title">Manual Entry</span>
                  <span class="action-desc">Add custom food manually</span>
                </div>
              </button>

              <button class="action-card" onclick="navigateTo('ai-photo-upload')">
                <div class="action-icon ai-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7F7CF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                  </svg>
                </div>
                <div class="action-content">
                  <span class="action-title">AI Photo Estimate</span>
                  <span class="action-desc">Upload a photo to estimate calories</span>
                </div>
              </button>
            </div>

            <!-- Recent Foods Section -->
            <div class="foods-section">
              <div class="section-header">
                <h3 class="section-title">Recent Foods</h3>
              </div>
              <div class="food-chips">
                <button class="food-chip" onclick="selectRecentFood('Chicken Rice')">Chicken Rice</button>
                <button class="food-chip" onclick="selectRecentFood('Banana')">Banana</button>
                <button class="food-chip" onclick="selectRecentFood('Greek Yogurt')">Greek Yogurt</button>
                <button class="food-chip" onclick="selectRecentFood('Protein Shake')">Protein Shake</button>
              </div>
            </div>

            <!-- Favourites Section -->
            <div class="foods-section">
              <div class="section-header">
                <h3 class="section-title">Favourites</h3>
                <span class="section-count" id="favCount">3/3</span>
              </div>
              <div class="food-chips">
                <button class="food-chip favourite" onclick="selectRecentFood('Oatmeal')">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="#F59E0B" stroke="none">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                  </svg>
                  Oatmeal
                </button>
                <button class="food-chip favourite" onclick="selectRecentFood('Protein Shake')">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="#F59E0B" stroke="none">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                  </svg>
                  Protein Shake
                </button>
                <button class="food-chip favourite" onclick="selectRecentFood('Eggs')">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="#F59E0B" stroke="none">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                  </svg>
                  Eggs
                </button>
              </div>
            </div>

            <!-- Spacer -->
            <div class="bottom-spacer"></div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="../../app.js?v=3"></script>
  <script>
    (function() {
      const isPremium = window.__strivio_state?.isPremium || false;
      
      // Show/hide premium badge on barcode option
      document.getElementById('barcodeBadge').style.display = isPremium ? 'none' : 'flex';
      
      window.handleSearch = function(e) {
        if (e.key === 'Enter') {
          const query = e.target.value.trim();
          if (query) {
            navigateTo('food-search-results?q=' + encodeURIComponent(query));
          }
        }
      };
      
      window.openBarcode = function() {
        if (isPremium) {
          navigateTo('barcode-scanner');
        } else {
          navigateTo('paywall-sheet?context=barcode&return=add-food-home');
        }
      };
      
      window.selectRecentFood = function(foodName) {
        // Navigate to food detail with the selected food
        navigateTo('food-detail-preview?food=' + encodeURIComponent(foodName));
      };
    })();
  </script>

  <style>
    .screen-add-food {
      background: #F5F6FA;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    .add-food-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: white;
      border-bottom: 1px solid #F4F4F4;
    }
    
    .back-btn {
      width: 40px;
      height: 40px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      margin-left: -8px;
    }
    
    .back-btn:active {
      background: #F5F6FA;
    }
    
    .add-food-title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: #0f172a;
      margin: 0;
    }
    
    .header-spacer {
      width: 40px;
    }
    
    .add-food-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    
    .search-container {
      margin-bottom: 20px;
    }
    
    .search-bar {
      display: flex;
      align-items: center;
      background: white;
      border-radius: 14px;
      padding: 12px 16px;
      gap: 12px;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
    }
    
    .search-icon {
      flex-shrink: 0;
    }
    
    .search-input {
      flex: 1;
      border: none;
      background: none;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: #0f172a;
      outline: none;
    }
    
    .search-input::placeholder {
      color: #9CA3AF;
    }
    
    .barcode-btn {
      width: 36px;
      height: 36px;
      background: #F1F0FF;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .barcode-btn:active {
      background: #E5E1FE;
    }
    
    .quick-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 28px;
    }
    
    .action-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: white;
      border: none;
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
      transition: transform 0.2s;
    }
    
    .action-card:active {
      transform: scale(0.99);
    }
    
    .action-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .barcode-icon {
      background: #F1F0FF;
    }
    
    .manual-icon {
      background: #F1F0FF;
    }
    
    .ai-icon {
      background: #F1F0FF;
    }
    
    .action-content {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    
    .action-title {
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .action-badge {
      width: 18px;
      height: 18px;
      background: #FEF3C7;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .action-desc {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #64748b;
    }
    
    .foods-section {
      margin-bottom: 24px;
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    
    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #0f172a;
      margin: 0;
    }
    
    .section-count {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #9CA3AF;
      font-weight: 500;
    }
    
    .food-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .food-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: white;
      border: 1px solid #E5E7EB;
      border-radius: 9999px;
      padding: 10px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #0f172a;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .food-chip:active {
      background: #F5F6FA;
    }
    
    .food-chip.favourite {
      background: #FFFBEB;
      border-color: #FEF3C7;
    }
    
    .bottom-spacer {
      height: 40px;
    }
  </style>
</body>
</html>
