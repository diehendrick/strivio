<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — AI Estimate Result</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper">
        <div class="screen screen-ai-result active">
          <div class="ai-result-header">
            <button class="back-btn" onclick="navigateTo('ai-photo-upload')">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2"><polyline points="15,18 9,12 15,6"></polyline></svg>
            </button>
            <span class="ai-result-title">AI Estimate Result</span>
            <div style="width:40px"></div>
          </div>
          <div class="ai-result-content">
            <div class="photo-preview">
              <div class="photo-placeholder">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <circle cx="8.5" cy="8.5" r="1.5"></circle>
                  <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
              </div>
            </div>
            <div class="estimated-nutrition">
              <h3 class="nutrition-header">Estimated Nutrition</h3>
              <div class="nutrition-value-large">540 kcal</div>
              <div class="nutrition-macros">Protein 32g • Carbs 58g • Fat 18g</div>
              <div class="confidence-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="12" y1="8" x2="12" y2="12"></line>
                  <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                Confidence: Medium
              </div>
            </div>
            <div class="ai-result-actions">
              <button class="btn-edit" onclick="navigateTo('manual-entry')">Edit Details</button>
              <button class="btn-log" onclick="navigateTo('log-food')">Log This Food</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
  <style>
    .screen-ai-result { background:#F5F6FA; display:flex; flex-direction:column; height:100%; }
    .ai-result-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:white; border-bottom:1px solid #F4F4F4; }
    .ai-result-title { font-family:'Nunito',sans-serif; font-size:18px; font-weight:600; color:#0f172a; }
    .ai-result-content { flex:1; padding:24px 20px; }
    .photo-preview { margin-bottom:24px; }
    .photo-placeholder { width:100%; height:200px; background:linear-gradient(135deg,#E5E7EB 0%,#F5F6FA 100%); border-radius:16px; display:flex; align-items:center; justify-content:center; }
    .estimated-nutrition { background:white; border-radius:20px; padding:24px; margin-bottom:24px; text-align:center; box-shadow:0 2px 12px rgba(15,23,42,0.04); }
    .nutrition-header { font-family:'Nunito',sans-serif; font-size:14px; font-weight:600; color:#64748b; margin:0 0 12px; }
    .nutrition-value-large { font-family:'Nunito',sans-serif; font-size:40px; font-weight:700; color:#0f172a; margin-bottom:8px; }
    .nutrition-macros { font-family:'Inter',sans-serif; font-size:14px; color:#64748b; margin-bottom:16px; }
    .confidence-badge { display:inline-flex; align-items:center; gap:6px; background:#FFFBEB; padding:8px 14px; border-radius:9999px; font-family:'Inter',sans-serif; font-size:13px; font-weight:500; color:#92400E; }
    .ai-result-actions { display:flex; flex-direction:column; gap:12px; }
    .btn-edit { height:56px; background:white; border:2px solid #E5E7EB; border-radius:9999px; color:#0f172a; font-family:'Inter',sans-serif; font-size:16px; font-weight:600; cursor:pointer; }
    .btn-log { height:56px; background:#0056D8; border:none; border-radius:9999px; color:white; font-family:'Inter',sans-serif; font-size:16px; font-weight:600; cursor:pointer; }
  </style>
</body>
</html>
