<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Select Date</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- Screen: Calendar Bottom Sheet -->
        <div class="screen screen-calendar-sheet active" data-screen="calendar-sheet">
          <div class="bottom-sheet-overlay" onclick="closeCalendar()">
            <div class="bottom-sheet" onclick="event.stopPropagation()">
              
              <!-- Sheet Header -->
              <div class="sheet-header">
                <h2 class="sheet-title">Select Date</h2>
                <button class="sheet-close" onclick="closeCalendar()" aria-label="Close">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                  </svg>
                </button>
              </div>

              <!-- Month Navigation -->
              <div class="calendar-nav">
                <button class="calendar-nav-btn" onclick="changeMonth(-1)" aria-label="Previous month">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15,18 9,12 15,6"></polyline>
                  </svg>
                </button>
                <span class="calendar-month" id="currentMonth">May 2026</span>
                <button class="calendar-nav-btn" onclick="changeMonth(1)" aria-label="Next month">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9,18 15,12 9,6"></polyline>
                  </svg>
                </button>
              </div>

              <!-- Weekday Headers -->
              <div class="calendar-weekdays">
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>
                <span>Sun</span>
              </div>

              <!-- Calendar Grid -->
              <div class="calendar-grid" id="calendarGrid">
                <!-- Days will be generated by JS -->
              </div>

              <!-- Sheet Actions -->
              <div class="sheet-actions">
                <button class="sheet-btn-text" onclick="selectToday()">Today</button>
                <button class="sheet-btn-primary" onclick="applyDate()">Apply</button>
              </div>

            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="../../app.js?v=3"></script>
  <script>
    (function() {
      let currentDate = new Date(2026, 4, 5); // May 5, 2026
      let selectedDate = new Date(currentDate);
      
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 
                          'July', 'August', 'September', 'October', 'November', 'December'];
      
      function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        document.getElementById('currentMonth').textContent = `${monthNames[month]} ${year}`;
        
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startingDay = firstDay.getDay() || 7; // Convert Sunday (0) to 7
        
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';
        
        // Empty cells for days before month starts
        for (let i = 1; i < startingDay; i++) {
          const emptyCell = document.createElement('div');
          emptyCell.className = 'calendar-day empty';
          grid.appendChild(emptyCell);
        }
        
        // Days of the month
        for (let day = 1; day <= daysInMonth; day++) {
          const dayCell = document.createElement('button');
          dayCell.className = 'calendar-day';
          dayCell.textContent = day;
          
          const date = new Date(year, month, day);
          
          // Check if this is the selected date
          if (isSameDate(date, selectedDate)) {
            dayCell.classList.add('selected');
          }
          
          // Check if this is today
          const today = new Date(2026, 4, 5);
          if (isSameDate(date, today)) {
            dayCell.classList.add('today');
          }
          
          dayCell.onclick = () => selectDate(date);
          grid.appendChild(dayCell);
        }
      }
      
      function isSameDate(date1, date2) {
        return date1.getDate() === date2.getDate() &&
               date1.getMonth() === date2.getMonth() &&
               date1.getFullYear() === date2.getFullYear();
      }
      
      function selectDate(date) {
        selectedDate = new Date(date);
        renderCalendar();
      }
      
      window.changeMonth = function(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendar();
      };
      
      window.selectToday = function() {
        selectedDate = new Date(2026, 4, 5); // Today
        currentDate = new Date(2026, 4, 5);
        renderCalendar();
      };
      
      window.applyDate = function() {
        // Store selected date and close
        localStorage.setItem('strivio_selected_date', selectedDate.toISOString());
        window.history.back();
      };
      
      window.closeCalendar = function() {
        window.history.back();
      };
      
      // Initial render
      renderCalendar();
    })();
  </script>

  <style>
    .screen-calendar-sheet {
      background: rgba(15, 23, 42, 0.32);
      display: flex;
      align-items: flex-end;
    }
    
    .bottom-sheet-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    
    .bottom-sheet {
      width: 100%;
      background: white;
      border-radius: 24px 24px 0 0;
      padding: 20px 24px 32px;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.2);
    }
    
    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .sheet-title {
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: #0f172a;
    }
    
    .sheet-close {
      width: 32px;
      height: 32px;
      background: #F5F6FA;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .calendar-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 8px;
    }
    
    .calendar-nav-btn {
      width: 36px;
      height: 36px;
      background: #F5F6FA;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .calendar-month {
      font-family: 'Nunito', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #0f172a;
    }
    
    .calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 8px;
      padding: 0 4px;
    }
    
    .calendar-weekdays span {
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: #9CA3AF;
      padding: 8px 0;
    }
    
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 24px;
      padding: 0 4px;
    }
    
    .calendar-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      border-radius: 50%;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #0f172a;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .calendar-day:hover:not(.empty) {
      background: #F5F6FA;
    }
    
    .calendar-day.selected {
      background: #0056D8;
      color: white;
    }
    
    .calendar-day.today:not(.selected) {
      border: 2px solid #0056D8;
      color: #0056D8;
    }
    
    .calendar-day.empty {
      cursor: default;
    }
    
    .sheet-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid #F4F4F4;
    }
    
    .sheet-btn-text {
      background: none;
      border: none;
      color: #0056D8;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 12px 16px;
    }
    
    .sheet-btn-primary {
      height: 44px;
      background: #0056D8;
      border: none;
      border-radius: 9999px;
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 0 24px;
    }
  </style>
</body>
</html>
