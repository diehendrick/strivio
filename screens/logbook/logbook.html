<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio - Log Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=13">
</head>

<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <div class="screen screen-logbook screen-logbook-figma active" data-screen="logbook">
          <div class="logbook-scroll lb-figma-scroll" id="logbookContent">
            <div class="status-bar lb-status-bar">
              <span class="status-time">9:41</span>
              <div class="status-icons">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <rect x="1" y="10" width="3" height="5" rx="0.5" fill="#0f172a" />
                  <rect x="6" y="7" width="3" height="8" rx="0.5" fill="#0f172a" />
                  <rect x="11" y="3" width="3" height="12" rx="0.5" fill="#0f172a" />
                </svg>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path d="M8 3c-1.66 0-3.08.69-4.12 1.78l.7.72A4.97 4.97 0 018 4c1.38 0 2.63.56 3.54 1.46l.7-.71A5.97 5.97 0 008 3z" fill="#0f172a" />
                  <path d="M10.83 7.17A3.98 3.98 0 008 6c-1.1 0-2.08.45-2.83 1.17l.71.71A2.99 2.99 0 018 7c.83 0 1.58.34 2.12.88l.71-.71z" fill="#0f172a" />
                  <circle cx="8" cy="11" r="2" fill="#0f172a" />
                </svg>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <rect x="1" y="5" width="2" height="6" rx="0.5" fill="#0f172a" />
                  <rect x="5" y="3" width="2" height="8" rx="0.5" fill="#0f172a" />
                  <rect x="9" y="1" width="2" height="10" rx="0.5" fill="#0f172a" />
                  <rect x="13" y="6" width="1.5" height="4" rx="0.5" fill="#0f172a" />
                </svg>
              </div>
            </div>

            <header class="lb-figma-header">
              <h1>Log Book</h1>
              <button class="lb-calendar-button" id="calendarBtn" aria-label="Open calendar">
                <span class="icon lb-calendar-button-icon" style="--icon-url: url('../../assets/svg_icons/calendar.svg'); width: 24px; height: 24px;" aria-hidden="true"></span>
              </button>
            </header>

            <div class="lb-days-row" aria-label="Week selector">
              <button type="button" class="lb-day"><span>S</span><strong>04</strong></button>
              <button type="button" class="lb-day"><span>M</span><strong>05</strong></button>
              <button type="button" class="lb-day"><span>T</span><strong>06</strong></button>
              <button type="button" class="lb-day active"><span>W</span><strong>07</strong></button>
              <button type="button" class="lb-day"><span>T</span><strong>08</strong></button>
              <button type="button" class="lb-day"><span>F</span><strong>09</strong></button>
              <button type="button" class="lb-day"><span>S</span><strong>10</strong></button>
            </div>

            <section class="overview-card lb-overview-card" id="macroOverviewCard">
              <div class="calorie-ring-section">
                <div class="calorie-side">
                  <span class="calorie-side-value" id="calRemaining">1160</span>
                  <span class="calorie-side-label">Remaining</span>
                </div>
                <div class="calorie-ring">
                  <svg viewBox="0 0 120 120" class="ring-svg" aria-hidden="true">
                    <circle cx="60" cy="60" r="52" class="ring-track" />
                    <circle cx="60" cy="60" r="52" class="ring-progress lb-ring-progress" id="calorieRing" stroke-dasharray="326.73" stroke-dashoffset="130.69" />
                  </svg>
                  <div class="ring-center">
                    <span class="ring-value" id="calConsumed">840</span>
                    <span class="ring-label">Consume</span>
                  </div>
                </div>
                <div class="calorie-side">
                  <span class="calorie-side-value" id="calTarget">2000</span>
                  <span class="calorie-side-label">Target</span>
                </div>
              </div>

              <div class="lb-macro-summary">
                <div class="lb-macro-mini">
                  <span>Protein</span>
                  <div><i style="width:47%; background:#3b82f6"></i></div>
                  <strong>56 / 120g</strong>
                </div>
                <div class="lb-macro-mini">
                  <span>Carbs</span>
                  <div><i style="width:45%; background:#f97316"></i></div>
                  <strong>112 / 250g</strong>
                </div>
                <div class="lb-macro-mini">
                  <span>Fat</span>
                  <div><i style="width:74%; background:#0056D8"></i></div>
                  <strong>28 / 70g</strong>
                </div>
              </div>

            <h2 class="lb-section-title">Meals</h2>
            <section class="logbook-card lb-meals-card" id="lbMealsCard"></section>

            <h2 class="lb-section-title">Action</h2>
            <section class="logbook-card lb-action-card">
              <button class="lb-action-row" type="button" id="copyPrevBtn">
                <span class="lb-action-main">
                  <span class="lb-action-icon-wrap">
                    <span class="icon lb-action-icon" style="--icon-url: url('../../assets/svg_icons/copy.svg'); width: 18px; height: 18px;" aria-hidden="true"></span>
                  </span>
                  <span class="lb-action-copy">
                    <strong>Copy Yesterday</strong>
                    <em>Reuse yesterday’s meals instantly</em>
                  </span>
                </span>
                <span class="lb-action-trailing" aria-hidden="true">
                  <span class="icon lb-action-chevron" style="--icon-url: url('../../assets/svg_icons/foward.svg'); width: 16px; height: 16px;"></span>
                </span>
              </button>
              <button class="lb-action-row" type="button" id="nutrientsCard">
                <span class="lb-action-main">
                  <span class="lb-action-icon-wrap">
                    <span class="icon lb-action-icon" style="--icon-url: url('../../assets/svg_icons/salad.svg'); width: 18px; height: 18px;" aria-hidden="true"></span>
                  </span>
                  <span class="lb-action-copy">
                    <strong>Full Nutrients</strong>
                    <em>Micros, vitamins, and minerals</em>
                  </span>
                </span>
                <span class="lb-action-trailing" aria-hidden="true">
                  <span class="icon lb-action-chevron" style="--icon-url: url('../../assets/svg_icons/foward.svg'); width: 16px; height: 16px;"></span>
                </span>
              </button>
              <button class="lb-action-row" type="button" id="macroOverviewAction">
                <span class="lb-action-main">
                  <span class="lb-action-icon-wrap">
                    <span class="icon lb-action-icon" style="--icon-url: url('../../assets/svg_icons/chart-pie-alt.svg'); width: 18px; height: 18px;" aria-hidden="true"></span>
                  </span>
                  <span class="lb-action-copy">
                    <strong>Macro Overview</strong>
                    <em>Review today’s macro balance</em>
                  </span>
                </span>
                <span class="lb-action-trailing" aria-hidden="true">
                  <span class="icon lb-action-chevron" style="--icon-url: url('../../assets/svg_icons/foward.svg'); width: 16px; height: 16px;"></span>
                </span>
              </button>
              <button class="lb-action-row" type="button" id="manualEntryBtn">
                <span class="lb-action-main">
                  <span class="lb-action-icon-wrap">
                    <span class="icon lb-action-icon" style="--icon-url: url('../../assets/svg_icons/edit.svg'); width: 18px; height: 18px;" aria-hidden="true"></span>
                  </span>
                  <span class="lb-action-copy">
                    <strong>Add Manually</strong>
                    <em>Log a food without searching</em>
                  </span>
                </span>
                <span class="lb-action-trailing" aria-hidden="true">
                  <span class="icon lb-action-chevron" style="--icon-url: url('../../assets/svg_icons/foward.svg'); width: 16px; height: 16px;"></span>
                </span>
              </button>
              <button class="lb-action-row" type="button" id="myMealsBtn">
                <span class="lb-action-main">
                  <span class="lb-action-icon-wrap">
                    <span class="icon lb-action-icon" style="--icon-url: url('../../assets/svg_icons/turkey.svg'); width: 18px; height: 18px;" aria-hidden="true"></span>
                  </span>
                  <span class="lb-action-copy">
                    <strong>My Meals</strong>
                    <em>Open your saved meal library</em>
                  </span>
                </span>
                <span class="lb-action-trailing" aria-hidden="true">
                  <span class="icon lb-action-chevron" style="--icon-url: url('../../assets/svg_icons/foward.svg'); width: 16px; height: 16px;"></span>
                </span>
              </button>
            </section>
          </div>

          <nav class="bottom-nav app-bottom-nav lb-bottom-nav">
            <button class="nav-item" data-nav="home" onclick="navigateTo('home')" aria-label="Home">
              <img src="../../assets/svg_icons/house.svg" alt="">
              <span class="nav-label">Home</span>
            </button>
            <button class="nav-item active" data-nav="logbook" aria-label="Logbook">
              <img src="../../assets/svg_icons/book-open.svg" alt="">
              <span class="nav-label">Logbook</span>
            </button>
            <button class="nav-fab" id="addFoodBtn" aria-label="Add food">
              <img src="../../assets/svg_icons/plus.svg" alt="">
            </button>
            <button class="nav-item" data-nav="coach" onclick="navigateTo('coach-main')" aria-label="Coach">
              <img src="../../assets/svg_icons/coach.svg" alt="">
              <span class="nav-label">Coach</span>
            </button>
            <button class="nav-item" data-nav="more" onclick="navigateTo('more')" aria-label="More">
              <img src="../../assets/svg_icons/more.svg" alt="">
              <span class="nav-label">More</span>
            </button>
          </nav>

          <div class="bottom-sheet calendar-sheet lb-calendar-sheet" id="logbookCalendarSheet">
            <div class="sheet-backdrop" data-close-calendar></div>
            <div class="sheet-content">
              <div class="sheet-handle"></div>
              <div class="calendar-header">
                <button class="calendar-nav-btn" type="button" data-calendar-prev aria-label="Previous month">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15,18 9,12 15,6"></polyline>
                  </svg>
                </button>
                <div>
                  <h2 class="calendar-title">Select Date</h2>
                  <span class="calendar-month-label" id="logbookCalendarMonth">May 2026</span>
                </div>
                <button class="calendar-nav-btn" type="button" data-calendar-next aria-label="Next month">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9,18 15,12 9,6"></polyline>
                  </svg>
                </button>
              </div>
              <div class="calendar-body">
                <div class="calendar-weekdays">
                  <span class="calendar-weekday">Mon</span>
                  <span class="calendar-weekday">Tue</span>
                  <span class="calendar-weekday">Wed</span>
                  <span class="calendar-weekday">Thu</span>
                  <span class="calendar-weekday">Fri</span>
                  <span class="calendar-weekday">Sat</span>
                  <span class="calendar-weekday">Sun</span>
                </div>
                <div class="calendar-days" id="logbookCalendarDays"></div>
              </div>
              <div class="sheet-actions lb-calendar-actions">
                <button class="sheet-btn-text" type="button" data-calendar-today>Today</button>
                <button class="sheet-btn-primary" type="button" data-calendar-apply>Apply</button>
              </div>
            </div>
          </div>

          <div class="bottom-sheet lb-quick-edit-sheet" id="lbQuickEditSheet" aria-hidden="true">
            <div class="sheet-backdrop" data-close-quick-edit></div>
            <div class="sheet-content">
              <div class="sheet-handle"></div>
              <div class="lb-quick-edit-header">
                <h3>Quick Edit</h3>
                <button class="lb-quick-edit-close" type="button" data-close-quick-edit aria-label="Close quick edit">
                  <span class="icon lb-quick-edit-close-icon" style="--icon-url: url('../../assets/svg_icons/circle-x.svg'); width: 24px; height: 24px;" aria-hidden="true"></span>
                </button>
              </div>
              <div class="lb-quick-edit-body">
                <div class="lb-quick-edit-item" id="lbQuickEditItem"></div>
                <div class="lb-quick-edit-serving">
                  <div class="lb-quick-edit-serving-copy">
                    <strong>Serving</strong>
                    <span id="lbQuickEditServingMeta">0 kcal per serving</span>
                  </div>
                  <div class="lb-quick-edit-counter">
                    <button type="button" id="lbQuickEditMinus" aria-label="Decrease serving">−</button>
                    <span id="lbQuickEditServingValue">1</span>
                    <button type="button" id="lbQuickEditPlus" aria-label="Increase serving">+</button>
                  </div>
                </div>
                <div class="lb-quick-edit-actions">
                  <button class="lb-quick-edit-save" type="button" id="lbQuickEditSaveBtn">Save Changes</button>
                  <button class="lb-quick-edit-delete" type="button" id="lbQuickEditDeleteBtn" aria-label="Delete food">
                    <span class="icon lb-quick-edit-delete-icon" style="--icon-url: url('../../assets/svg_icons/trash.svg'); width: 24px; height: 24px;" aria-hidden="true"></span>
                  </button>

          <div class="toast-container" id="toastContainer"></div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <script src="../../app.js?v=10"></script>
  <script>
    (function() {
      const content = document.getElementById('logbookContent');
      const isPremium = window.__strivio_state?.isPremium || false;
      const mealsCard = document.getElementById('lbMealsCard');
      const quickEditSheet = document.getElementById('lbQuickEditSheet');
      const quickEditItemEl = document.getElementById('lbQuickEditItem');
      const quickEditServingMetaEl = document.getElementById('lbQuickEditServingMeta');
      const quickEditServingValueEl = document.getElementById('lbQuickEditServingValue');
      let touchStartX = 0;
      let touchEndX = 0;
      const expandedMeals = new Set(['breakfast']);
      let currentDateKey = '2026-05-07';
      let quickEditState = null;

      function showToast(message) {
        const container = document.getElementById('toastContainer');
        if (!container) return;
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        container.appendChild(toast);
        requestAnimationFrame(() => toast.classList.add('show'));
        setTimeout(() => {
          toast.classList.remove('show');
          setTimeout(() => toast.remove(), 300);
        }, 2200);
      }

      function navigateDate(direction) {
        if (!content) return;
        content.style.transition = 'transform 0.2s ease-out';
        content.style.transform = `translateX(${-direction * 28}px)`;
        setTimeout(() => {
          content.style.transform = 'translateX(0)';
          showToast(direction > 0 ? 'Next day' : 'Previous day');
        }, 200);
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      const mealMeta = {
        breakfast: { label: 'Breakfast', iconClass: 'lb-meal-breakfast' },
        lunch: { label: 'Lunch', iconClass: 'lb-meal-lunch' },
        dinner: { label: 'Dinner', iconClass: 'lb-meal-dinner' },
        snacks: { label: 'Snacks', iconClass: 'lb-meal-snacks' }
      };

      const mealTemplateState = {
        breakfast: {
          items: [
            { id: 'breakfast-oatmeal', name: 'Oatmeal (1 bowl)', image: 'https://images.unsplash.com/photo-1517673400267-0251440c45dc?auto=format&fit=crop&w=200&q=80', perServingKcal: 350, perServingMacros: { protein: 12, carbs: 55, fat: 8 }, servings: 1 },
            { id: 'breakfast-yogurt', name: 'Greek Yogurt (1 cup)', image: 'https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=200&q=80', perServingKcal: 120, perServingMacros: { protein: 20, carbs: 10, fat: 0 }, servings: 1 },
            { id: 'breakfast-toast', name: 'Avocado Toast (1 slice)', image: 'https://images.unsplash.com/photo-1541519227354-08fa5d50c44d?auto=format&fit=crop&w=200&q=80', perServingKcal: 250, perServingMacros: { protein: 5, carbs: 20, fat: 15 }, servings: 1 }
          ]
        },
        lunch: {
          items: [
            { id: 'lunch-bowl', name: 'Chicken Rice Bowl', image: 'https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=200&q=80', perServingKcal: 410, perServingMacros: { protein: 28, carbs: 42, fat: 11 }, servings: 1 },
            { id: 'lunch-fruit', name: 'Fruit Cup', image: 'https://images.unsplash.com/photo-1490474418585-ba9bad8fd0ea?auto=format&fit=crop&w=200&q=80', perServingKcal: 140, perServingMacros: { protein: 2, carbs: 28, fat: 1 }, servings: 1 }
          ]
        },
        dinner: {
          items: [
            { id: 'dinner-salmon', name: 'Salmon Plate', image: 'https://images.unsplash.com/photo-1467003909585-2f8a72700288?auto=format&fit=crop&w=200&q=80', perServingKcal: 430, perServingMacros: { protein: 30, carbs: 18, fat: 24 }, servings: 1 },
            { id: 'dinner-yogurt', name: 'Yogurt Parfait', image: 'https://images.unsplash.com/photo-1505253716362-afaea1d3d1af?auto=format&fit=crop&w=200&q=80', perServingKcal: 150, perServingMacros: { protein: 9, carbs: 20, fat: 3 }, servings: 1 }
          ]
        },
        snacks: {
          items: [
            { id: 'snack-banana', name: 'Banana Smoothie', image: 'https://images.unsplash.com/photo-1623065422902-30a2d299bbe4?auto=format&fit=crop&w=200&q=80', perServingKcal: 180, perServingMacros: { protein: 8, carbs: 24, fat: 4 }, servings: 1 }
          ]
        }
      };

      const mealStatesByDate = {};

      function cloneData(data) {
        return JSON.parse(JSON.stringify(data));
      }

      function getFoodMacros(food, servings) {
        const safeServings = Math.max(1, servings || food.servings || 1);
        return {
          protein: food.perServingMacros.protein * safeServings,
          carbs: food.perServingMacros.carbs * safeServings,
          fat: food.perServingMacros.fat * safeServings
        };
      }

      function getFoodCalories(food, servings) {
        const safeServings = Math.max(1, servings || food.servings || 1);
        return food.perServingKcal * safeServings;
      }

      function formatMacrosLine(macros) {
        return `P ${macros.protein}g · C ${macros.carbs}g · F ${macros.fat}g`;
      }

      function computeMealSummaryText(meal) {
        const totals = (meal.items || []).reduce((acc, food) => {
          const macros = getFoodMacros(food);
          acc.kcal += getFoodCalories(food);
          acc.protein += macros.protein;
          acc.carbs += macros.carbs;
          acc.fat += macros.fat;
          return acc;
        }, { kcal: 0, protein: 0, carbs: 0, fat: 0 });

        return `${totals.kcal} kcal · P ${totals.protein}g · C ${totals.carbs}g · F ${totals.fat}g`;
      }

      function ensureMealState(key, mealSummaries) {
        if (!mealStatesByDate[key]) {
          mealStatesByDate[key] = cloneData(mealTemplateState);
        }

        Object.keys(mealMeta).forEach(mealKey => {
          const meal = mealStatesByDate[key][mealKey] || { items: [] };
          if (typeof meal.summaryLocked !== 'boolean') {
            meal.summaryLocked = true;
          }
          if (meal.summaryLocked !== false) {
            meal.summaryText = mealSummaries?.[mealKey] || meal.summaryText || '0 kcal · P 0g · C 0g · F 0g';
          }
          mealStatesByDate[key][mealKey] = meal;
        });

        return mealStatesByDate[key];
      }

      function getActiveDayData() {
        return logbookData[currentDateKey] || logbookData['2026-05-07'];
      }

      function getActiveMeals() {
        return ensureMealState(currentDateKey, getActiveDayData().meals);
      }

      function getActiveMeal(mealKey) {
        return getActiveMeals()[mealKey];
      }

      function getFoodById(mealKey, foodId) {
        const meal = getActiveMeal(mealKey);
        return meal?.items?.find(item => item.id === foodId) || null;
      }

      function setMealEdited(mealKey) {
        const meal = getActiveMeal(mealKey);
        if (!meal) return;
        meal.summaryLocked = false;
        meal.summaryText = computeMealSummaryText(meal);
      }

      function setLogbookSelection(mealKey, foodId) {
        window.__strivio_state = window.__strivio_state || {};
        window.__strivio_state.logbookSelectedMeal = mealKey;
        window.__strivio_state.logbookSelectedFoodId = foodId || null;
        try { localStorage.setItem('strivio_state', JSON.stringify(window.__strivio_state)); } catch (e) {}
      }

      function renderMeals() {
        if (!mealsCard) return;
        const meals = getActiveMeals();
        const keys = Object.keys(mealMeta);

        mealsCard.innerHTML = keys.map((mealKey, index) => {
          const meta = mealMeta[mealKey];
          const meal = meals[mealKey];
          const isExpanded = expandedMeals.has(mealKey);
          const summaryText = meal.summaryLocked !== false ? meal.summaryText : computeMealSummaryText(meal);
          const itemsHtml = (meal.items && meal.items.length)
            ? meal.items.map(food => {
              const macrosText = formatMacrosLine(getFoodMacros(food));
              return '' +
                `<article class="lb-food-card">` +
                  `<button class="lb-food-detail" type="button" data-food-detail="${mealKey}" data-food-id="${food.id}">` +
                    `<span class="lb-food-thumb"><img src="${food.image}" alt="${escapeHtml(food.name)}"></span>` +
                    `<span class="lb-food-copy">` +
                      `<strong>${escapeHtml(food.name)}</strong>` +
                      `<em>${escapeHtml(macrosText)}</em>` +
                      `<b>${getFoodCalories(food)} kcal</b>` +
                    `</span>` +
                  `</button>` +
                  `<button class="lb-food-edit" type="button" data-food-edit="${mealKey}" data-food-id="${food.id}" aria-label="Quick edit ${escapeHtml(food.name)}">` +
                    `<span class="icon lb-food-edit-icon" style="--icon-url: url('../../assets/svg_icons/edit.svg'); width: 16px; height: 16px;" aria-hidden="true"></span>` +
                  `</button>` +
                `</article>`;
            }).join('')
            : `<div class="lb-meal-empty">No foods logged yet. Add food to this meal.</div>`;

          return '' +
            `<section class="lb-meal-group${isExpanded ? ' is-expanded' : ''}${index < keys.length - 1 ? ' has-divider' : ''}">` +
              `<button class="lb-meal-head" type="button" data-meal-toggle="${mealKey}" aria-expanded="${isExpanded ? 'true' : 'false'}">` +
                `<span class="lb-meal-icon ${meta.iconClass}"><img src="../../assets/svg_icons/morning.svg" alt=""></span>` +
                `<span class="lb-meal-copy">` +
                  `<strong>${meta.label}</strong>` +
                  `<em>${escapeHtml(summaryText)}</em>` +
                `</span>` +
                `<span class="lb-meal-chevron-wrap">` +
                  `<span class="icon lb-meal-chevron" style="--icon-url: url('../../assets/svg_icons/down.svg'); width: 14px; height: 14px;" aria-hidden="true"></span>` +
                `</span>` +
              `</button>` +
              (isExpanded
                ? `<div class="lb-meal-panel">${itemsHtml}<button class="lb-meal-add-btn" type="button" data-add-food="${mealKey}"><span class="icon lb-meal-add-icon" style="--icon-url: url('../../assets/svg_icons/plus.svg'); width: 18px; height: 18px;" aria-hidden="true"></span><span>Add Food</span></button></div>`
                : '') +
            `</section>`;
        }).join('');
      }

      function getQuickEditFood() {
        if (!quickEditState) return null;
        return getFoodById(quickEditState.mealKey, quickEditState.foodId);
      }

      function syncQuickEditSheet() {
        const food = getQuickEditFood();
        if (!food || !quickEditItemEl || !quickEditServingMetaEl || !quickEditServingValueEl) return;

        quickEditItemEl.innerHTML = '' +
          `<div class="lb-quick-edit-food-card">` +
            `<span class="lb-food-thumb lb-quick-edit-thumb"><img src="${food.image}" alt="${escapeHtml(food.name)}"></span>` +
            `<div class="lb-quick-edit-copy">` +
              `<strong>${escapeHtml(food.name)}</strong>` +
              `<em>${escapeHtml(formatMacrosLine(getFoodMacros(food, 1)))}</em>` +
              `<b>${food.perServingKcal} kcal</b>` +
            `</div>` +
            `<button class="lb-quick-edit-log-again" type="button" id="lbQuickEditLogAgain">Log Again</button>` +
          `</div>`;

        quickEditServingMetaEl.textContent = `${food.perServingKcal} kcal per serving`;
        quickEditServingValueEl.textContent = String(quickEditState.servings);
        quickEditItemEl.querySelector('#lbQuickEditLogAgain')?.addEventListener('click', logAgainQuickEditFood);
      }

      function openQuickEdit(mealKey, foodId) {
        const food = getFoodById(mealKey, foodId);
        if (!food) return;
        quickEditState = {
          mealKey,
          foodId,
          servings: Math.max(1, food.servings || 1)
        };
        syncQuickEditSheet();
        quickEditSheet?.setAttribute('aria-hidden', 'false');
        if (typeof openSheet === 'function') {
          openSheet('lbQuickEditSheet');
        } else {
          quickEditSheet?.classList.add('open');
        }
      }

      function closeQuickEdit(skipReset) {
        quickEditSheet?.setAttribute('aria-hidden', 'true');
        if (typeof closeSheet === 'function') {
          closeSheet('lbQuickEditSheet');
        } else {
          quickEditSheet?.classList.remove('open');
        }
        if (!skipReset) {
          quickEditState = null;
        }
      }

      function saveQuickEditChanges() {
        const food = getQuickEditFood();
        if (!food || !quickEditState) return;
        food.servings = Math.max(1, quickEditState.servings);
        setMealEdited(quickEditState.mealKey);
        renderMeals();
        closeQuickEdit();
        showToast('Changes saved');
      }

      function deleteQuickEditFood() {
        if (!quickEditState) return;
        const meal = getActiveMeal(quickEditState.mealKey);
        if (!meal) return;
        meal.items = (meal.items || []).filter(item => item.id !== quickEditState.foodId);
        setMealEdited(quickEditState.mealKey);
        renderMeals();
        closeQuickEdit();
        showToast('Food removed');
      }

      function logAgainQuickEditFood() {
        const food = getQuickEditFood();
        if (!food || !quickEditState) return;
        const meal = getActiveMeal(quickEditState.mealKey);
        if (!meal) return;
        const clonedFood = cloneData(food);
        clonedFood.id = `${food.id}-copy-${Date.now()}`;
        clonedFood.servings = Math.max(1, quickEditState.servings);
        meal.items.push(clonedFood);
        setMealEdited(quickEditState.mealKey);
        renderMeals();
        closeQuickEdit();
        showToast('Food added again');
      }

      const calendarSheet = document.getElementById('logbookCalendarSheet');
      const calendarMonthEl = document.getElementById('logbookCalendarMonth');
      const calendarDaysEl = document.getElementById('logbookCalendarDays');
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'];
      const logbookData = {
        '2026-05-06': {
          consumed: 1045,
          target: 2000,
          macros: {
            protein: { value: 68, target: 120, color: '#3b82f6' },
            carbs: { value: 138, target: 250, color: '#f97316' },
            fat: { value: 34, target: 70, color: '#0056D8' }
          },
          meals: {
            breakfast: '390 kcal · P 24g · C 40g · F 11g',
            lunch: '520 kcal · P 31g · C 62g · F 14g',
            dinner: '0 kcal · P 0g · C 0g · F 0g',
            snacks: '135 kcal · P 13g · C 12g · F 9g'
          }
        },
        '2026-05-07': {
          consumed: 840,
          target: 2000,
          macros: {
            protein: { value: 56, target: 120, color: '#3b82f6' },
            carbs: { value: 112, target: 250, color: '#f97316' },
            fat: { value: 28, target: 70, color: '#0056D8' }
          },
          meals: {
            breakfast: '420 kcal · P 28g · C 42g · F 12g',
            lunch: '650 kcal · P 35g · C 70g · F 18g',
            dinner: '580 kcal · P 22g · C 38g · F 20g',
            snacks: '580 kcal · P 8g · C 10g · F 5g'
          }
        },
        '2026-05-08': {
          consumed: 1320,
          target: 2100,
          macros: {
            protein: { value: 82, target: 130, color: '#3b82f6' },
            carbs: { value: 172, target: 260, color: '#f97316' },
            fat: { value: 46, target: 75, color: '#0056D8' }
          },
          meals: {
            breakfast: '510 kcal · P 32g · C 55g · F 16g',
            lunch: '610 kcal · P 38g · C 68g · F 19g',
            dinner: '200 kcal · P 12g · C 30g · F 6g',
            snacks: '0 kcal · P 0g · C 0g · F 0g'
          }
        }
      };
      let calendarDate = new Date(2026, 4, 7);
      let selectedDate = new Date(calendarDate);

      function dateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      function getDayInitial(date) {
        return ['S', 'M', 'T', 'W', 'T', 'F', 'S'][date.getDay()];
      }

      function updateMacro(index, label, macro) {
        const item = document.querySelectorAll('.lb-macro-mini')[index];
        if (!item || !macro) return;
        const fill = item.querySelector('i');
        const value = item.querySelector('strong');
        const percent = Math.min(100, Math.round((macro.value / macro.target) * 100));
        if (fill) {
          fill.style.width = `${percent}%`;
          fill.style.background = macro.color;
        }
        if (value) value.textContent = `${macro.value} / ${macro.target}g`;
      }

      function applyLogbookDate(date, quiet) {
        selectedDate = new Date(date);
        calendarDate = new Date(selectedDate);
        const key = dateKey(selectedDate);
        currentDateKey = key;
        const dayData = logbookData[key] || logbookData['2026-05-07'];
        const consumed = dayData.consumed;
        const target = dayData.target;
        const remaining = Math.max(0, target - consumed);
        const ring = document.getElementById('calorieRing');
        const ringLength = 326.73;
        const consumedRatio = Math.min(1, consumed / target);

        document.getElementById('calRemaining').textContent = remaining;
        document.getElementById('calConsumed').textContent = consumed;
        document.getElementById('calTarget').textContent = target;
        if (ring) ring.setAttribute('stroke-dashoffset', (ringLength * (1 - consumedRatio)).toFixed(2));
        updateMacro(0, 'Protein', dayData.macros.protein);
        updateMacro(1, 'Carbs', dayData.macros.carbs);
        updateMacro(2, 'Fat', dayData.macros.fat);
        ensureMealState(key, dayData.meals);
        renderMeals();
        closeQuickEdit();

        const weekStart = new Date(selectedDate);
        weekStart.setDate(selectedDate.getDate() - 3);
        document.querySelectorAll('.lb-day').forEach((dayButton, index) => {
          const date = new Date(weekStart);
          date.setDate(weekStart.getDate() + index);
          dayButton.dataset.date = dateKey(date);
          dayButton.querySelector('span').textContent = getDayInitial(date);
          dayButton.querySelector('strong').textContent = String(date.getDate()).padStart(2, '0');
          dayButton.classList.toggle('active', isSameDate(date, selectedDate));
        });

        if (!quiet) showToast(`May ${selectedDate.getDate()} selected`);
      }

      function isSameDate(dateA, dateB) {
        return dateA.getDate() === dateB.getDate() &&
          dateA.getMonth() === dateB.getMonth() &&
          dateA.getFullYear() === dateB.getFullYear();
      }

      function renderLogbookCalendar() {
        if (!calendarMonthEl || !calendarDaysEl) return;
        const year = calendarDate.getFullYear();
        const month = calendarDate.getMonth();
        const today = new Date(2026, 4, 7);
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const startOffset = firstDay.getDay() || 7;

        calendarMonthEl.textContent = `${monthNames[month]} ${year}`;
        calendarDaysEl.innerHTML = '';

        for (let i = 1; i < startOffset; i++) {
          const emptyDay = document.createElement('span');
          emptyDay.className = 'calendar-day other-month';
          calendarDaysEl.appendChild(emptyDay);
        }

        for (let day = 1; day <= lastDay.getDate(); day++) {
          const date = new Date(year, month, day);
          const dayBtn = document.createElement('button');
          dayBtn.type = 'button';
          dayBtn.className = 'calendar-day';
          dayBtn.textContent = day;
          if (isSameDate(date, selectedDate)) dayBtn.classList.add('selected');
          if (isSameDate(date, today)) dayBtn.classList.add('today');
          dayBtn.addEventListener('click', () => {
            selectedDate = date;
            renderLogbookCalendar();
          });
          calendarDaysEl.appendChild(dayBtn);
        }
      }

      function openLogbookCalendar() {
        renderLogbookCalendar();
        calendarSheet?.classList.add('open');
      }

      function closeLogbookCalendar() {
        calendarSheet?.classList.remove('open');
      }

      if (content) {
        content.addEventListener('touchstart', e => {
          touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        content.addEventListener('touchend', e => {
          touchEndX = e.changedTouches[0].screenX;
          const diff = touchStartX - touchEndX;
          if (Math.abs(diff) > 50) navigateDate(diff > 0 ? 1 : -1);
        }, { passive: true });
      }

      applyLogbookDate(selectedDate, true);

      document.querySelectorAll('.lb-day').forEach(day => {
        day.addEventListener('click', () => {
          const parsed = new Date(`${day.dataset.date}T00:00:00`);
          if (!Number.isNaN(parsed.getTime())) applyLogbookDate(parsed);
        });
      });

      document.getElementById('calendarBtn')?.addEventListener('click', openLogbookCalendar);
      document.querySelectorAll('[data-close-calendar]').forEach(item => {
        item.addEventListener('click', closeLogbookCalendar);
      });
      document.querySelector('[data-calendar-prev]')?.addEventListener('click', () => {
        calendarDate.setMonth(calendarDate.getMonth() - 1);
        renderLogbookCalendar();
      });
      document.querySelector('[data-calendar-next]')?.addEventListener('click', () => {
        calendarDate.setMonth(calendarDate.getMonth() + 1);
        renderLogbookCalendar();
      });
      document.querySelector('[data-calendar-today]')?.addEventListener('click', () => {
        selectedDate = new Date(2026, 4, 7);
        calendarDate = new Date(selectedDate);
        renderLogbookCalendar();
      });
      document.querySelector('[data-calendar-apply]')?.addEventListener('click', () => {
        try { localStorage.setItem('strivio_selected_date', selectedDate.toISOString()); } catch(e) {}
        applyLogbookDate(selectedDate, true);
        closeLogbookCalendar();
        showToast(`May ${selectedDate.getDate()} selected`);
      });

      mealsCard?.addEventListener('click', event => {
        const toggleBtn = event.target.closest('[data-meal-toggle]');
        if (toggleBtn) {
          const mealKey = toggleBtn.getAttribute('data-meal-toggle');
          if (expandedMeals.has(mealKey)) {
            expandedMeals.delete(mealKey);
          } else {
            expandedMeals.add(mealKey);
          }
          renderMeals();
          return;
        }

        const editBtn = event.target.closest('[data-food-edit]');
        if (editBtn) {
          event.preventDefault();
          event.stopPropagation();
          openQuickEdit(editBtn.getAttribute('data-food-edit'), editBtn.getAttribute('data-food-id'));
          return;
        }

        const detailBtn = event.target.closest('[data-food-detail]');
        if (detailBtn) {
          const mealKey = detailBtn.getAttribute('data-food-detail');
          const foodId = detailBtn.getAttribute('data-food-id');
          setLogbookSelection(mealKey, foodId);
          navigateTo('meal-detail');
          return;
        }

        const addBtn = event.target.closest('[data-add-food]');
        if (addBtn) {
          const mealKey = addBtn.getAttribute('data-add-food');
          setLogbookSelection(mealKey, null);
          navigateTo('add-food-home');
        }
      });

      document.querySelectorAll('[data-close-quick-edit]').forEach(item => {
        item.addEventListener('click', () => closeQuickEdit());
      });
      document.getElementById('lbQuickEditMinus')?.addEventListener('click', () => {
        if (!quickEditState) return;
        quickEditState.servings = Math.max(1, quickEditState.servings - 1);
        syncQuickEditSheet();
      });
      document.getElementById('lbQuickEditPlus')?.addEventListener('click', () => {
        if (!quickEditState) return;
        quickEditState.servings += 1;
        syncQuickEditSheet();
      });
      document.getElementById('lbQuickEditSaveBtn')?.addEventListener('click', saveQuickEditChanges);
      document.getElementById('lbQuickEditDeleteBtn')?.addEventListener('click', deleteQuickEditFood);
      document.getElementById('macroOverviewCard')?.addEventListener('click', () => showToast('Macro overview shown'));
      document.getElementById('copyPrevBtn')?.addEventListener('click', () => navigateTo('copy-previous-day'));
      document.getElementById('nutrientsCard')?.addEventListener('click', () => navigateTo(isPremium ? 'nutrients-full' : 'nutrients-locked'));
      document.getElementById('macroOverviewAction')?.addEventListener('click', () => navigateTo('micro-overview'));
      document.getElementById('manualEntryBtn')?.addEventListener('click', () => navigateTo('manual-entry'));
      document.getElementById('myMealsBtn')?.addEventListener('click', () => navigateTo('custom-meals-list'));
      document.getElementById('addFoodBtn')?.addEventListener('click', () => navigateTo('add-food-home'));
    })();
  </script>
</body>

</html>
