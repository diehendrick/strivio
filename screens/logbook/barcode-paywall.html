<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Scan Barcodes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper">
        <div class="screen screen-barcode-paywall active">
          <div class="paywall-scroll">
            <h1 class="paywall-page-title">Scan Barcodes Faster</h1>
            <div class="barcode-illustration">
              <svg width="160" height="160" viewBox="0 0 160 160" fill="none">
                <rect x="20" y="40" width="120" height="80" rx="8" fill="#EAF2FF"/>
                <rect x="35" y="60" width="6" height="40" fill="#0056D8"/>
                <rect x="48" y="60" width="6" height="40" fill="#0056D8"/>
                <rect x="61" y="60" width="12" height="40" fill="#0056D8"/>
                <rect x="80" y="60" width="6" height="40" fill="#0056D8"/>
                <rect x="93" y="60" width="18" height="40" fill="#0056D8"/>
                <rect x="118" y="60" width="6" height="40" fill="#0056D8"/>
                <circle cx="80" cy="20" r="8" fill="#FEF3C7"/>
                <circle cx="60" cy="30" r="4" fill="#FEF3C7" opacity="0.5"/>
                <circle cx="100" cy="30" r="4" fill="#FEF3C7" opacity="0.5"/>
              </svg>
            </div>
            <p class="paywall-description">Scan barcodes for instant nutrition data and log packaged foods faster.</p>
            <button class="btn-primary-paywall" onclick="navigateTo('paywall-sheet?context=barcode&return=barcode-scanner')">Unlock Premium</button>
            <button class="btn-secondary-paywall" onclick="navigateTo('add-food-home')">Not Now</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
  <style>
    .screen-barcode-paywall { background:#F5F6FA; display:flex; flex-direction:column; height:100%; }
    .paywall-scroll { padding:40px 24px; display:flex; flex-direction:column; align-items:center; text-align:center; }
    .paywall-page-title { font-family:'Nunito',sans-serif; font-size:24px; font-weight:600; color:#0f172a; margin:0 0 32px; }
    .barcode-illustration { margin-bottom:32px; }
    .paywall-description { font-family:'Inter',sans-serif; font-size:15px; color:#64748b; line-height:1.6; margin:0 0 40px; max-width:280px; }
    .btn-primary-paywall { width:100%; height:56px; background:#0056D8; border:none; border-radius:9999px; color:white; font-family:'Inter',sans-serif; font-size:16px; font-weight:600; cursor:pointer; margin-bottom:12px; }
    .btn-secondary-paywall { width:100%; height:52px; background:none; border:none; color:#64748b; font-family:'Inter',sans-serif; font-size:16px; font-weight:500; cursor:pointer; }
  </style>
</body>
</html>
