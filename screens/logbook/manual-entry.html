<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Strivio — Manual Entry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper" id="screensWrapper">

        <!-- Screen: Manual Food Entry -->
        <div class="screen screen-manual-entry active" data-screen="manual-entry">
          
          <!-- Header -->
          <div class="manual-header">
            <button class="back-btn" onclick="navigateTo('add-food-home')" aria-label="Go back">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15,18 9,12 15,6"></polyline>
              </svg>
            </button>
            <h1 class="manual-title">Manual Food Entry</h1>
            <div class="header-spacer"></div>
          </div>

          <div class="manual-scroll">
            <!-- Form Fields -->
            <div class="manual-form">
              
              <!-- Food Name -->
              <div class="form-group">
                <label class="form-label">Food Name <span class="required">*</span></label>
                <input type="text" class="form-input" id="foodName" placeholder="e.g., Homemade Smoothie">
              </div>

              <!-- Serving Size -->
              <div class="form-group">
                <label class="form-label">Serving Size <span class="required">*</span></label>
                <input type="text" class="form-input" id="servingSize" placeholder="e.g., 1 cup, 100g">
              </div>

              <!-- Calories -->
              <div class="form-group">
                <label class="form-label">Calories <span class="required">*</span></label>
                <div class="input-with-unit">
                  <input type="number" class="form-input" id="calories" placeholder="0">
                  <span class="input-unit">kcal</span>
                </div>
              </div>

              <!-- Macros Header -->
              <label class="form-label">Macronutrients</label>
              
              <!-- Protein -->
              <div class="form-group">
                <div class="input-with-unit">
                  <input type="number" class="form-input" id="protein" placeholder="0">
                  <span class="input-unit">g protein</span>
                </div>
              </div>

              <!-- Carbs -->
              <div class="form-group">
                <div class="input-with-unit">
                  <input type="number" class="form-input" id="carbs" placeholder="0">
                  <span class="input-unit">g carbs</span>
                </div>
              </div>

              <!-- Fat -->
              <div class="form-group">
                <div class="input-with-unit">
                  <input type="number" class="form-input" id="fat" placeholder="0">
                  <span class="input-unit">g fat</span>
                </div>
              </div>

              <!-- Optional Nutrients Toggle -->
              <button class="optional-toggle" onclick="toggleOptional()">
                <span>Optional Nutrients</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="toggleIcon">
                  <polyline points="6,9 12,15 18,9"></polyline>
                </svg>
              </button>

              <!-- Optional Fields (Collapsible) -->
              <div class="optional-fields" id="optionalFields">
                <div class="form-group">
                  <div class="input-with-unit">
                    <input type="number" class="form-input" id="fiber" placeholder="0">
                    <span class="input-unit">g fiber</span>
                  </div>
                </div>
                <div class="form-group">
                  <div class="input-with-unit">
                    <input type="number" class="form-input" id="sugar" placeholder="0">
                    <span class="input-unit">g sugar</span>
                  </div>
                </div>
                <div class="form-group">
                  <div class="input-with-unit">
                    <input type="number" class="form-input" id="sodium" placeholder="0">
                    <span class="input-unit">mg sodium</span>
                  </div>
                </div>
              </div>

            </div>

            <!-- Spacer -->
            <div class="bottom-spacer"></div>
          </div>

          <!-- Save Button -->
          <button class="save-food-btn" onclick="saveFood()">
            Save Food
          </button>

        </div>

      </div>
    </div>
  </div>

  <script src="../../app.js?v=3"></script>
  <script>
    let optionalExpanded = false;
    
    function toggleOptional() {
      optionalExpanded = !optionalExpanded;
      const fields = document.getElementById('optionalFields');
      const icon = document.getElementById('toggleIcon');
      
      fields.classList.toggle('expanded', optionalExpanded);
      icon.style.transform = optionalExpanded ? 'rotate(180deg)' : 'rotate(0deg)';
    }
    
    function saveFood() {
      const name = document.getElementById('foodName').value;
      const serving = document.getElementById('servingSize').value;
      const calories = document.getElementById('calories').value;
      
      // Basic validation
      if (!name || !serving || !calories) {
        showToast('Please fill in all required fields');
        return;
      }
      
      // Show success
      showToast('Food saved successfully');
      
      setTimeout(() => {
        navigateTo('add-food-home');
      }, 1000);
    }
    
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'manual-toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      
      requestAnimationFrame(() => {
        toast.classList.add('show');
      });
      
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }
  </script>

  <style>
    .screen-manual-entry {
      background: #F5F6FA;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    .manual-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: white;
      border-bottom: 1px solid #F4F4F4;
    }
    
    .back-btn {
      width: 40px;
      height: 40px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      margin-left: -8px;
    }
    
    .manual-title {
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: #0f172a;
      margin: 0;
    }
    
    .header-spacer {
      width: 40px;
    }
    
    .manual-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    
    .manual-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .form-label {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
    }
    
    .required {
      color: #EF4444;
    }
    
    .form-input {
      height: 52px;
      background: white;
      border: 1px solid #E5E7EB;
      border-radius: 14px;
      padding: 0 16px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: #0f172a;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .form-input:focus {
      border-color: #0056D8;
    }
    
    .form-input::placeholder {
      color: #9CA3AF;
    }
    
    .input-with-unit {
      position: relative;
    }
    
    .input-with-unit .form-input {
      padding-right: 90px;
    }
    
    .input-unit {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #9CA3AF;
    }
    
    .optional-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: none;
      border: none;
      padding: 12px 0;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #0056D8;
      cursor: pointer;
      margin-top: 8px;
    }
    
    .optional-toggle svg {
      transition: transform 0.2s;
    }
    
    .optional-fields {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
    }
    
    .optional-fields.expanded {
      max-height: 300px;
    }
    
    .save-food-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      height: 56px;
      background: #0056D8;
      border: none;
      border-radius: 9999px;
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 100;
    }
    
    .save-food-btn:active {
      transform: scale(0.98);
      background: #3B82F6;
    }
    
    .bottom-spacer {
      height: 80px;
    }
    
    .manual-toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0F172A;
      color: white;
      padding: 14px 20px;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
    }
    
    .manual-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</body>
</html>
