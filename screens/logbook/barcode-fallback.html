<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Barcode Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper">
        <div class="screen screen-barcode-fallback active">
          <div class="fallback-content">
            <div class="fallback-icon">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
            </div>
            <h1 class="fallback-title">Barcode Not Found</h1>
            <p class="fallback-desc">We couldn't find this product in the database. You can add it manually.</p>
            <button class="btn-primary" onclick="navigateTo('manual-entry')">Add Manually</button>
            <button class="btn-secondary" onclick="navigateTo('barcode-scanner')">Try Scanning Again</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
  <style>
    .screen-barcode-fallback { background:#F5F6FA; display:flex; flex-direction:column; height:100%; }
    .fallback-content { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 24px; text-align:center; }
    .fallback-icon { width:80px; height:80px; background:#FEF3C7; border-radius:20px; display:flex; align-items:center; justify-content:center; margin-bottom:24px; }
    .fallback-title { font-family:'Nunito',sans-serif; font-size:22px; font-weight:600; color:#0f172a; margin:0 0 12px; }
    .fallback-desc { font-family:'Inter',sans-serif; font-size:15px; color:#64748b; line-height:1.6; margin:0 0 40px; max-width:280px; }
    .btn-primary { width:100%; max-width:280px; height:56px; background:#0056D8; border:none; border-radius:9999px; color:white; font-family:'Inter',sans-serif; font-size:16px; font-weight:600; cursor:pointer; margin-bottom:12px; }
    .btn-secondary { width:100%; max-width:280px; height:52px; background:none; border:none; color:#64748b; font-family:'Inter',sans-serif; font-size:16px; font-weight:500; cursor:pointer; }
  </style>
</body>
</html>
