<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — AI Photo Estimate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=3">
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper">
        <div class="screen screen-ai-photo active">
          <div class="ai-header">
            <button class="back-btn" onclick="navigateTo('add-food-home')">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2"><polyline points="15,18 9,12 15,6"></polyline></svg>
            </button>
            <span class="ai-title">AI Photo Estimate</span>
            <div style="width:40px"></div>
          </div>
          <div class="ai-content">
            <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#7F7CF0" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
              <p class="upload-text">Tap to upload a photo of your meal</p>
              <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(event)">
            </div>
            <p class="ai-instruction">Take or upload a clear photo of your meal. We'll estimate calories and macros for you.</p>
            <div class="ai-buttons">
              <button class="btn-camera" onclick="document.getElementById('fileInput').click()">Take Photo</button>
              <button class="btn-gallery" onclick="document.getElementById('fileInput').click()">Upload from Gallery</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../../app.js?v=3"></script>
  <script>
    function handleFile(e) {
      if (e.target.files && e.target.files[0]) {
        navigateTo('ai-estimation-result');
      }
    }
  </script>
  <style>
    .screen-ai-photo { background:#F5F6FA; display:flex; flex-direction:column; height:100%; }
    .ai-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:white; border-bottom:1px solid #F4F4F4; }
    .back-btn { width:40px; height:40px; background:none; border:none; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; margin-left:-8px; }
    .ai-title { font-family:'Outfit',sans-serif; font-size:18px; font-weight:600; color:#0f172a; }
    .ai-content { flex:1; padding:32px 20px; display:flex; flex-direction:column; }
    .upload-area { flex:1; background:white; border:2px dashed #E5E7EB; border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; transition:all 0.2s; margin-bottom:24px; }
    .upload-area:hover { border-color:#7F7CF0; background:#F1F0FF; }
    .upload-text { font-family:'Inter',sans-serif; font-size:14px; color:#64748b; margin-top:16px; }
    .ai-instruction { font-family:'Inter',sans-serif; font-size:14px; color:#64748b; line-height:1.6; text-align:center; margin:0 0 24px; }
    .ai-buttons { display:flex; flex-direction:column; gap:12px; }
    .btn-camera { height:56px; background:#7F7CF0; border:none; border-radius:9999px; color:white; font-family:'Inter',sans-serif; font-size:16px; font-weight:600; cursor:pointer; }
    .btn-gallery { height:56px; background:white; border:2px solid #E5E7EB; border-radius:9999px; color:#0f172a; font-family:'Inter',sans-serif; font-size:16px; font-weight:600; cursor:pointer; }
  </style>
</body>
</html>
