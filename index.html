<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Strivio — Your Personalized Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="styles.css?v=3">
  <script>
    // Redirect to splash screen on load (dynamic base path)
    const basePath = window.location.pathname.replace(/\/[^\/]*$/, '');
    window.location.href = basePath + '/screens/auth/splash.html';
  </script>
</head>
<body>
  <div class="app-container">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="screens-wrapper">
        <div class="screen screen-splash active">
          <div class="splash-logo">
            <img src="assets/strivio_logo.svg" alt="Strivio" class="splash-logo-img">
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
